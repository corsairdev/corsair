[project]
name = "corsair-cloud"
version = "0.1.0"
description = "Thin HTTP client for hosted Corsair Cloud projects"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://corsair.dev"
Documentation = "https://docs.corsair.dev/clients/python"
Repository = "https://github.com/corsairdev/corsair"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["corsair_cloud"]

# Ship the py.typed marker so type checkers honor the inline hints (the
# "Typing :: Typed" classifier promises it).
[tool.setuptools.package-data]
corsair_cloud = ["py.typed"]
