# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Keeps the profile CodeRabbit already used here, and points it at the plugin
# rules so it stops re-raising decisions the team has already made.
reviews:
  profile: chill
  path_instructions:
    - path: "packages/**"
      instructions: >-
        For plugin packages (every packages/<plugin>/ except packages/corsair,
        cli, mcp, studio, ui and app): check plugin code against the R8 conventions in .github/PLUGIN_PR_RULES.md
        (credentials from ctx.key, ApiError kept intact, retry policy, response
        schemas from the provider's docs, risk levels, timeouts, no secrets or
        personal data in errors and logs). Do not raise the settled decisions in
        R9 of that file: retrying a write after a 429 (except one that reports
        an exhausted daily or monthly quota, which is still a finding), optional or nullish
        response fields, a live suite that skips with a warning when its key is
        missing, the corsair peer range in package.json, risk levels per input,
        and core-wide checks (kek with encryptDataAtRest, root DEFAULT handler
        order, approval argument redaction).
    - path: "packages/{corsair,cli,mcp,studio,ui,app}/**"
      instructions: >-
        This is core or a core package, not a plugin: the R9 exclusions in
        .github/PLUGIN_PR_RULES.md do not apply here. Review changes to the
        kek and encryptDataAtRest checks, error-handler order, approval
        argument redaction, retries and webhook routing in full.
    - path: "docs/plugins/**"
      instructions: >-
        These pages are generated by scripts/generate-plugin-docs.ts from the
        plugin's code and plugin-docs.yaml. Type strings (string literals
        without quotes, z.unknown() shown as any), the setup text and the
        example snippets come from the shared generator, so do not ask a plugin
        PR to edit them; raise generator problems against the generator.
knowledge_base:
  code_guidelines:
    filePatterns:
      - ".github/PLUGIN_PR_RULES.md"
