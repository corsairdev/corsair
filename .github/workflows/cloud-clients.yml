name: Cloud clients

on:
  push:
    paths:
      - "packages/corsair/core/cloud/contract.openapi.yaml"
      - "clients/**"
      - "scripts/generate-clients.mjs"
  pull_request:
    paths:
      - "packages/corsair/core/cloud/contract.openapi.yaml"
      - "clients/**"
      - "scripts/generate-clients.mjs"

jobs:
  generate-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - run: pnpm generate:clients

      - name: Go build smoke test
        run: go build ./...
        working-directory: clients/go

      - name: Python import smoke test
        run: |
          pip install .
          python -c "import corsair_cloud"
        working-directory: clients/python

      # Swift client is generated but not compiled here — a Swift toolchain
      # in CI is out of scope (ceiling); regenerate + build locally if needed.
