name: Plugin PR Review Loop

on:
  # Greptile edits its summary comment on every review, and issue_comment runs in
  # base context with full permissions for any PR, fork or not. Don't add
  # pull_request_review back: each review fires both events a second apart, the
  # later run cancels the earlier one, and only the review run's check lands on
  # the PR head, so every reviewed PR shows a cancelled "triage".
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage:
    if: >-
      github.event.comment.user.login == 'greptile-apps[bot]' &&
      github.event.issue.pull_request != null
    # On the job, so a comment from anyone else (its run is skipped) can't cancel
    # a triage in progress.
    concurrency:
      group: review-loop-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Run review loop triage
        run: node --experimental-strip-types scripts/pr-review/loop-main.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BOT_DRY_RUN: ${{ vars.PR_BOT_DRY_RUN }}
