name: Publish corsair-cloud to PyPI

on:
  push:
    tags:
      - 'corsair-cloud-py-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        working-directory: clients/python
        run: |
          tag_version="${GITHUB_REF_NAME#corsair-cloud-py-v}"
          pkg_version="$(grep -m1 -E '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag version ($tag_version) does not match pyproject version ($pkg_version)" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine

      - name: Build
        run: python -m build
        working-directory: clients/python

      - name: Upload to PyPI
        run: twine upload dist/*
        working-directory: clients/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
