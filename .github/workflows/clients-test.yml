name: Clients Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'clients/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: swift test
        run: swift test
        working-directory: clients/swift

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e ".[dev]"
        working-directory: clients/python

      - name: pytest
        run: pytest
        working-directory: clients/python

  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: go test
        run: go test ./...
        working-directory: clients/go
