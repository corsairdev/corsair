name: Docs llms-full.txt

# docs/llms-full.txt (served by Mintlify in place of its generated 53 MB file)
# is generated from the written pages. This fails a PR that changes them
# without regenerating it. Plugin pages and the changelog aren't in the file.

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '!docs/plugins/**'
      - '!docs/changelog.mdx'
      - 'scripts/llms-full/**'
      - '.github/workflows/docs-llms-full.yml'

permissions:
  contents: read

jobs:
  check:
    name: docs/llms-full.txt is up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: scripts/llms-full/pnpm-lock.yaml

      - name: Check
        run: pnpm generate:llms-full --check
