name: Deploy Packages to NPM

on:
  push:
    branches: [main]
    paths:
      - 'packages/*/package.json'
      - 'adapters/*/package.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write # starts release-on-merge.yml once this run has published

# One publish at a time; a newer pending run replaces an older one, and every
# run publishes whatever npm is missing.
concurrency:
  group: deploy-npm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter . --filter "./packages/**" --filter "./adapters/**"

      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Publish changed packages
        run: node scripts/publish-changed.mjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CORSAIR_DEV_TOKEN: ${{ secrets.NPM_CORSAIR_DEV_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_CORSAIR_DEV_TOKEN }}

      # release-on-merge.yml leaves a version npm doesn't have yet alone, so a
      # change merged while this was publishing waits. Now that the versions
      # are on npm, it can release that change.
      # Also after a partial failure: packages that did publish can release
      # what merged meanwhile.
      - name: Release anything merged while this published
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-on-merge.yml --repo "$GITHUB_REPOSITORY" --ref main
