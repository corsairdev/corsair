displayName: MailerLite
description: Manage MailerLite subscribers, campaigns, automations, and ecommerce data through the current REST API.
overviewNote: >-
  Connect an API key generated in MailerLite Integrations. Subscriber reactivation
  requires explicit renewed consent; never set resubscribe unless the contact has
  asked to subscribe again. Campaign scheduling sends email to the selected audience.
apiNotes:
  subscribers.create: >-
    The plugin pins X-Version to the implementation date and preserves MailerLite's
    Retry-After value. Subscriber status and group changes follow MailerLite's consent
    rules; do not use resubscribe without renewed consent.
  groups.importSubscribers: >-
    This import route is limited to five creation requests per minute and can enter
    subscribers into automations when trigger_automations is true.
  campaigns.schedule: >-
    Scheduling with delivery=instant sends the campaign immediately; scheduled and
    timezone-based delivery also sends once MailerLite reaches the configured time.
  automations.enable: >-
    Enabling activates workflow triggers and may start sending automation emails.
  orders.create: >-
    Orders marked complete can trigger purchase automations and revenue attribution.
  customers.create: >-
    Set accepts_marketing from the customer's actual consent; create_subscriber is
    passed explicitly and does not imply consent by itself.
  productVariants.create: >-
    E-commerce product variant creation with resource_id can delete variants omitted
    from the submitted list.
