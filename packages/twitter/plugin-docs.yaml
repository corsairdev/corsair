# Display copy for the docs, the catalog, corsair.dev and Hub, and one call
# example per operation. Generated with the plugin from X's OpenAPI spec;
# docs-examples.test.ts parses every example with its input schema.
displayName: X (Twitter)
domain: x.com
description: "Read and act on X (Twitter) through the full X API v2: publish and search posts, read timelines, mentions, likes, bookmarks and followers, look up and search users, send and read Direct Messages and encrypted Chat, manage Lists, Spaces, Communities, trends, news, Community Notes, live broadcasts and media uploads, and run usage, compliance and webhook routes (259 operations)."
overviewNote: "Connect with OAuth 2.0 (Authorization Code with PKCE) to act as an X user, or with the app's Bearer token (authType api_key) for app-only routes and public reads. X bills every call pay-per-use: a post or a DM costs $0.015 ($0.20 for a post with a URL), each post read $0.005, each user read $0.010 and each DM event read $0.010, so keep max_results low. Following, liking and quote-posting left the self-serve tiers on 2026-04-20 and may answer 403. Access tokens last 2 hours and X rotates the refresh token on every refresh; the plugin stores the new one. Streaming endpoints (filtered, sample and firehose streams) are not included."
examples:
  read:
    path: posts.search.recent
    title: Search the last 7 days of posts
    args: {"query": "from:XDevelopers -is:retweet", "max_results": 10, "post.fields": ["created_at", "public_metrics"]}
  write:
    path: posts.create
    title: Publish a post as the connected user
    args: {"text": "Shipping the new release today."}
