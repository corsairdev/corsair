displayName: Kalshi
description: A regulated prediction-market exchange. Read markets, events and your portfolio, and place, amend and cancel orders, with a demo environment for testing.
domain: kalshi.com
factory:
  note: "`kalshi()` defaults to the **production** environment, where order writes spend real money. Start with `environment: 'demo'` and demo credentials, then switch to production deliberately."
  options:
    environment: demo
overviewNote: "Kalshi needs **two credentials**: an API key ID and the matching PEM private key (RSA or Ed25519). Generate them together in your Kalshi account settings; the private key is shown only once. Demo and production use separate accounts and separate keys."
examples:
  read:
    path: markets.get
    title: Get a market
    args:
      ticker: KXHIGHNY-26NOV12-T60
  write:
    path: orders.cancel
    title: Cancel a resting order (demo environment)
    args:
      order_id: "<order-id>"
      market_ticker: KXHIGHNY-26NOV12-T60
apiExamples:
  events.get:
    call: "{ event_ticker: 'KXHIGHNY-26NOV12' }"
  markets.get:
    call: "{ ticker: 'KXHIGHNY-26NOV12-T60' }"
  markets.orderbook:
    call: "{ ticker: 'KXHIGHNY-26NOV12-T60', depth: 10 }"
  series.get:
    call: "{ series_ticker: 'KXHIGHNY' }"
  orders.get:
    call: "{ order_id: '<order-id>' }"
  orders.create:
    call: "{ ticker: 'KXHIGHNY-26NOV12-T60', side: 'bid', count: '10.00', price: '0.5600', time_in_force: 'good_till_canceled' }"
  orders.amend:
    call: "{ order_id: '<order-id>', ticker: 'KXHIGHNY-26NOV12-T60', side: 'bid', price: '0.5800', count: '10.00' }"
  orders.cancel:
    call: "{ order_id: '<order-id>', market_ticker: 'KXHIGHNY-26NOV12-T60' }"
  orders.batchCreate:
    call: "{ orders: [{ ticker: 'KXHIGHNY-26NOV12-T60', side: 'bid', count: '10.00', price: '0.5600', time_in_force: 'good_till_canceled' }] }"
