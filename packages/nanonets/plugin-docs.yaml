displayName: Nanonets
description: AI document processing with Nanonets - extract fields from images and URLs with OCR models, train models, review and correct predicted files, approve or delete them, and query connected data stores.
domain: nanonets.com
recommendedAuth: api_key
overviewNote: |
  Create an API key at app.nanonets.com/#keys (Extract Data screen, Account Info, API Keys, "Add a New Key"); the first key is issued automatically at signup. The key is sent as HTTP Basic auth with the key as username and an empty password. Things to know before you call:

  - **Predictions are writes.** Every create call uploads a file to Nanonets and consumes API quota, so they are classified `write`, not `read`. Files are sent as `base64_data` (PNG or JPEG); the binary multipart `file` field is not wrapped.
  - **`async: true`** switches a create call to the documented async variant: the response comes back pending with a `request_file_id`, which you poll with `predictions.getFileByFileId` until `message` is `success`. Recommended above 3 pages; results normally finish within ~5 minutes.
  - **Quota and rate limits.** 402 means the free API call quota is exhausted and is never retried. 429 is per model per 1-minute window on the predict calls; the plugin retries up to three times with exponential backoff (Nanonets documents 30s→60s→120s) and honors Retry-After when sent.
  - **Paging is a day window.** `predictions.listFiles` takes `start_day_interval` and `current_batch_day` as days since 1970-01-01 GMT (floor of unix seconds over 86400) and returns moderated and unmoderated images for that window; walk the windows forward yourself.
  - **`files.updateFields` replaces the whole field set.** Send the full `moderated_boxes` array from a prior read: unchanged boxes stay, new boxes need `is_new: true`, and any field you omit is deleted. The request is sent as `text/plain` because that is the documented working sample.
  - **Deleting is permanent.** `files.delete` removes the file and its predictions for good. `integrations.executeQuery` runs arbitrary SQL against a connected store (documented examples include UPDATE), so it is also classified destructive.
  - **Training.** `models.uploadTrainingUrls` adds images by URL, then `models.train` retrains; the model state walks 2→3→4→5 (usable). `models.updateGuidelines` changes extraction behavior of Instant Learning models via natural-language instructions.
  - **Webhooks.** Nanonets can POST document events to URLs you configure in its UI (Workflow → Exports → Webhooks), but it signs nothing, so the plugin receives none.
examples:
  read:
    path: predictions.getFileByFileId
    title: Fetch a prediction file by ID
    args:
      model_id: d4d3beec-1029-497a-8d4c-8a3e2de6e7f2
      request_file_id: 68d2b0f6-af9c-4c71-9d3e-2f3a4b5c6d7e
  write:
    path: predictions.createFromUrls
    title: Extract fields from an image URL
    args:
      model_id: d4d3beec-1029-497a-8d4c-8a3e2de6e7f2
      urls:
        - 'https://example.com/invoice.png'
apiExamples:
  predictions.createFromFile:
    call: "{ model_id: 'd4d3beec-1029-497a-8d4c-8a3e2de6e7f2', base64_data: '<base64 PNG or JPEG>', async: true }"
  predictions.createFromUrls:
    call: "{ model_id: 'd4d3beec-1029-497a-8d4c-8a3e2de6e7f2', urls: ['https://example.com/invoice.png'], pages_to_process: '1,2' }"
  predictions.listFiles:
    call: "{ model_id: 'd4d3beec-1029-497a-8d4c-8a3e2de6e7f2', start_day_interval: 20590, current_batch_day: 20591 }"
  predictions.getFileByPageId:
    call: "{ model_id: 'd4d3beec-1029-497a-8d4c-8a3e2de6e7f2', id: '68d2b0f6-af9c-4c71-9d3e-2f3a4b5c6d7e' }"
  predictions.getFileByFileId:
    call: "{ model_id: 'd4d3beec-1029-497a-8d4c-8a3e2de6e7f2', request_file_id: '68d2b0f6-af9c-4c71-9d3e-2f3a4b5c6d7e' }"
  models.uploadTrainingUrls:
    call: "{ model_id: 'd4d3beec-1029-497a-8d4c-8a3e2de6e7f2', urls: ['https://example.com/receipt-1.png', 'https://example.com/receipt-2.png'] }"
  models.train:
    call: "{ model_id: 'd4d3beec-1029-497a-8d4c-8a3e2de6e7f2' }"
  models.updateGuidelines:
    call: "{ model_id: 'd4d3beec-1029-497a-8d4c-8a3e2de6e7f2', field_instructions: 'Extract the invoice total and tax fields', table_instructions: 'Extract line items as a table', ai_guidelines: true }"
  files.approve:
    call: "{ model_id: 'd4d3beec-1029-497a-8d4c-8a3e2de6e7f2', request_file_id: '68d2b0f6-af9c-4c71-9d3e-2f3a4b5c6d7e' }"
  files.unapprove:
    call: "{ model_id: 'd4d3beec-1029-497a-8d4c-8a3e2de6e7f2', request_file_id: '68d2b0f6-af9c-4c71-9d3e-2f3a4b5c6d7e' }"
  files.delete:
    call: "{ model_id: 'd4d3beec-1029-497a-8d4c-8a3e2de6e7f2', file_id: '68d2b0f6-af9c-4c71-9d3e-2f3a4b5c6d7e' }"
  files.updateFields:
    call: "{ model_id: 'd4d3beec-1029-497a-8d4c-8a3e2de6e7f2', moderated_boxes: [{ id: 'box-1', label: 'total_amount', xmin: 10, ymin: 20, xmax: 200, ymax: 40, ocr_text: '120.00' }] }"
  files.assign:
    call: "{ model_id: 'd4d3beec-1029-497a-8d4c-8a3e2de6e7f2', member: 'reviewer@example.com', file_ids: ['68d2b0f6-af9c-4c71-9d3e-2f3a4b5c6d7e'] }"
  files.retryExports:
    call: "{ model_id: 'd4d3beec-1029-497a-8d4c-8a3e2de6e7f2', file_ids: ['68d2b0f6-af9c-4c71-9d3e-2f3a4b5c6d7e'] }"
  files.retryPredictions:
    call: "{ model_id: 'd4d3beec-1029-497a-8d4c-8a3e2de6e7f2', file_ids: ['68d2b0f6-af9c-4c71-9d3e-2f3a4b5c6d7e'] }"
  integrations.list: {}
  integrations.executeQuery:
    call: "{ external_integration_id: 'a1b2c3d4-e5f6-7890-abcd-ef1234567890', query: 'select * from passports limit 10' }"
