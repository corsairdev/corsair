displayName: OpenSEO
description: "Open-source SEO platform with 85 operations: keyword research and metrics, live Google SERPs, domain and backlink analysis, rank tracking, local SEO and Google Business Profiles, site audits, AI visibility tracking across ChatGPT, Claude, Gemini and Perplexity, Search Console, Google Analytics, IndexNow and saved reports."
overviewNote: "Calls go to OpenSEO's hosted MCP server with an `oseo_` API key (OpenSEO > Settings > API keys). Most operations take a `projectId` from `projects.list`. Research lookups spend OpenSEO credits (the reply's `meta.creditsCharged`); `account.whoami` shows the balance. Search Console and Google Analytics operations read the Google accounts connected inside OpenSEO."
examples:
  read:
    path: keywords.research
    title: Research keywords
    args: {"projectId": "6f1c2a9e-3b7d-4e58-9a14-2c8b5d7e0f31", "seeds": [{"seed": "coffee subscription"}], "resultLimit": 150}
