  tasks.show:
    call: "{ task_id: 98765 }"
  tasks.showByLocalId:
    call: "{ project_id: 552668, local_task_id: 42 }"
  tasks.create:
    call: "{ project_id: 552668, description: 'Login button does nothing on Safari', priority: 'important', status: 'todo', tag_names: ['safari'] }"
  tasks.update:
    call: "{ project_id: 552668, task_id: 98765, status: 'doing', assigned_to_id: 4561 }"
  tasks.delete:
    call: "{ project_id: 552668, task_id: 98765 }"
  tasks.move:
    call: "{ project_id: 552668, destination_project_id: 552669, task_ids: [42, 43] }"
  tasks.listForUser:
    call: "{ user_id: 4561 }"
  tasks.listComments:
    call: "{ project_id: 552668, task_id: 98765 }"
  tasks.createComment:
