  tasks.uploadAttachment:
    call: "{ project_id: 552668, task_id: 98765, file: { url: 'https://example.com/report.pdf' } }"
  tasks.deleteAttachment:
    call: "{ project_id: 552668, task_id: 98765, attachment_id: 331 }"
  columns.list:
