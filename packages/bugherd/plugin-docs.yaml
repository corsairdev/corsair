displayName: BugHerd
description: Work with BugHerd website feedback and bug reports. List and triage tasks, move them across the board, comment, attach files, and manage projects, columns and webhooks.
domain: bugherd.com
recommendedAuth: api_key
overviewNote: |
  The [BugHerd API v2](https://docs.bugherd.com/api) authenticates with your organization's API key (Settings > organization > Authentication Token). It is sent as HTTP Basic with the key as the username and `x` as the password, and it can see every project in the organization.

  Tasks have two ids: the global `id` that every task route takes, and `local_task_id`, the #number shown in the BugHerd UI. Use `tasks.showByLocalId` to turn a #number into a task, and `tasks.move` takes #numbers. A task's `status` is its column name (`backlog`, `todo`, `doing`, `done`, `closed` or a custom column); a task with no status sits in the Feedback panel.

  Lists return up to 100 records per page; pass `page` to get the next one. An empty list means there are no more. BugHerd allows 60 requests a minute.

  **Risk.** Deletes (projects, tasks, columns, attachments, webhooks) cannot be undone, and `projects.addGuest` with an email sends that person an invitation, so these are `destructive`. Projects come back without the project's widget `api_key`, which lets anyone post feedback into the project.
references:
  - title: BugHerd API v2 reference
    url: https://docs.bugherd.com/api
examples:
  read:
    path: tasks.list
    title: Open tasks in a project
    args:
      project_id: 552668
      status: todo
  write:
    path: tasks.update
    title: Move a task to Doing and assign it
    args:
      project_id: 552668
      task_id: 98765
      status: doing
      assigned_to_id: 4561
apiNotes:
  tasks.listForUser: |
    `GET /users/{user_id}/tasks.json`. BugHerd answers with a bare array; the plugin returns it as `{ tasks }` like the other task lists.
  tasks.show: |
    `GET /projects/{project_id}/tasks/{task_id}.json`, or `GET /tasks/{task_id}.json` when no project id is given.
  tasks.uploadAttachment: |
    `POST /projects/{project_id}/tasks/{task_id}/attachments/upload` as multipart form data. BugHerd allows about 30 seconds per upload; use `tasks.createAttachment` with a URL for large files.
  tasks.move: |
    `POST /projects/{project_id}/move_tasks.json`. BugHerd notes the route may not be enabled on every account (404).
