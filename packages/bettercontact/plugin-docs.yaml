displayName: BetterContact
description: Waterfall enrichment API for finding verified B2B emails and mobile phone numbers.
overviewNote: |
  BetterContact integrates waterfall enrichment across multiple data providers for verified work emails and direct phone numbers.

  Pass `key` to the plugin factory or set `BETTERCONTACT_API_KEY` in environment variables:

  ```ts
  bettercontact({ key: process.env.BETTERCONTACT_API_KEY })
  ```
