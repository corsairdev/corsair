# Display copy for the docs, the catalog, corsair.dev and Hub.
displayName: ElevenLabs
description: AI audio platform; generate speech, dialogue, sound effects and music, transcribe and align audio, change or isolate voices, dub video, manage voices and history, and run conversational agents.
domain: elevenlabs.io
overviewNote: |
  Audio comes back as base64 in `contentBase64`, with `contentType`, `byteLength` and what ElevenLabs reports in its headers: `requestId`, `traceId`, `characterCost` (credits charged) and `historyItemId` (`songId` on music). Base64 is expensive in an agent's context, so speech operations (`textToSpeech`, `textToDialogue`, `voiceChanger`) take `includeContent: false` to leave it out, and leave it out on their own above `maxBytes` (default 700000 bytes, about 43 s of 128 kbps mp3). `contentOmitted` then says why and `note` says how to get it: `history.getAudio({ historyItemId })`. The history item can take a few seconds to appear after the audio returns.

  Sound effects, music, stems and isolation have no history item, so ElevenLabs keeps no copy. Their output always comes back in the result, up to 50 MB.

  Calls here wait for the audio. A script on Corsair's cloud has a 25 s wall and can return at most 1,000,000 bytes, and for what we timed, size is the first limit. Single runs on 2026-11-08: a 10 s sound effect took 2.1 s, 530 characters of speech 1.1 s with eleven_flash_v2_5 and 1.7 s with eleven_multilingual_v2, and 15, 30 and 60 s of music took 3.9, 4.6 and 6.9 s. Music's default format is about 24 KB/s, so its base64 passes the cap at about 31 s of audio: the 30 s result was 960,972 bytes, the 60 s result 1,920,973. To stay under the cap, ask for a lower-bitrate `outputFormat` (`mp3_22050_32` gave 4.05 KB/s in one 6 s run, so about 3 minutes fits), or pass `contentBase64` to the next operation in the same script and return only the metadata. We did not time long transcription, isolation, voice changer or stems. A run the wall cuts off may still finish and bill. `dubbing.create` is the one long operation with a job: follow it with `dubbing.get`, or let `get_job` do it. Transcripts of long files can use `speechToText.convert({ webhook: true })`.

  ElevenLabs has no idempotency keys, so a repeated generation bills again. By default the plugin retries a generation only when ElevenLabs refused it before running it: a 429 with `rate_limit_exceeded`, `concurrent_limit_exceeded`, `system_busy` or the older `too_many_concurrent_requests`, at most 3 times, waiting as `Retry-After` says. If `Retry-After` is over 30 s it doesn't wait and you get the 429. It never retries a generation on a 5xx, a timeout, a network failure or any other 429; those errors say the run may have happened. Reads retry any 429 under the same rules, and a 5xx at most 2 times. A custom handler in `errorHandlers` can change all of this, including retrying a generation after a 5xx, which can bill twice.

  Not covered, on purpose: Studio and projects, professional voice training, instant voice cloning from files (consent and verification concerns), websockets, realtime and Speech Engine, streaming variants (an operation returns one value), phone numbers and outbound calls, workspace admin, SMB, and Flows.
examples:
  read:
    path: voices.list
    title: Find a voice
    args:
      search: narrator
      pageSize: 5
  write:
    path: textToSpeech.convert
    title: Speak a sentence
    args:
      voiceId: FGY2WhTYpPnrIDTdsKH5
      text: Your order has shipped.
      modelId: eleven_flash_v2_5
      outputFormat: mp3_22050_32
exampleWebhook:
  path: speechToText.transcriptionCompleted
  note: "Create a webhook in ElevenLabs under Developers, Webhooks, with HMAC auth, and save the secret it shows you as the account's `webhook_signature` (or pass `webhookSecret`); deliveries are refused until it is set. Tick the events you want, and select the webhook in the agent's settings for post-call events. Hand `processWebhook` the raw body text (`await request.text()`), not parsed JSON, because ElevenLabs signs the exact bytes it sent. Deliveries name no account, so with several tenants put `?tenantId=<id>` on the webhook URL and pass `Object.fromEntries(new URL(request.url).searchParams)` as `processWebhook`'s fourth argument. Passed as a `URLSearchParams`, the query falls back to the `default` tenant. The signature covers the body but not the URL, so `?tenantId=` only picks which tenant's secret checks a delivery. When tenants share a secret, by storing the same one or through the `webhookSecret` option, anyone holding a signed delivery under 30 minutes old can resend it with another `tenantId`, and that tenant's hooks run on it. Give each tenant its own webhook secret, or check in an `after` hook that the event's ids belong to that tenant before acting on it. By then the plugin has logged the event under that tenant. A `before` hook runs ahead of the signature check, so it can receive an unsigned or forged delivery. Keep side effects in `after`. A delivery with a bad signature or a payload that fails validation comes back from `processWebhook` as `response.success: false`, so answer non-2xx for it. The same event can arrive more than once, from ElevenLabs' retries or from someone resending a signed delivery within 30 minutes, so make hooks safe to run twice, for example by recording the `conversation_id` or `request_id` each one acted on."
  after: "if (result.data?.type === 'speech_to_text_transcription') console.log(result.data.data?.request_id, result.data.data?.transcription?.text);"
apiNotes:
  textToSpeech.convert: Spends credits by text length (`characterCost` says how many). The history item keeps its own stored format, so `history.getAudio` can return a different bitrate from `outputFormat`.
  textToSpeech.convertWithTimestamps: Same audio fields as `textToSpeech.convert`, plus `alignment` and `normalized_alignment`.
  speechToText.convert: Pass `fileBase64` or `sourceUrl`. With `webhook` true it returns `request_id` and `transcription_id` at once and delivers to the workspace's speech-to-text webhooks, which must exist first. `speechToText.getTranscript` answers 404 until the transcript is ready, the same as for a wrong id, which is why this isn't declared as a job.
  audioIsolation.isolate: ElevenLabs refuses audio under about 4.6 s. No history item, so the output always comes back in the result. It takes no `outputFormat`, and a clip of about 7.5 s came back as 302,018 bytes in one run, so in a script hand on anything over about 18 s instead of returning it.
  music.compose: Pass `prompt` or `compositionPlan`; `musicLengthMs` only works with `prompt`. Defaults to music_v2_5, because the API's own default, music_v1, is removed on 2027-01-31. No `characterCost` header; `account.usageStats` has the cost.
  music.plan: The API's schema allows `chunks` or `sections` in a plan; music_v2_5 answered with `chunks` in our test. Pass the plan back to `music.compose` as `compositionPlan`.
  music.separateStems: Returns a zip with one file per stem. No `characterCost` header; `account.usageStats` has the cost.
  soundEffects.generate: Defaults to eleven_text_to_sound_v3, because the API's own default, eleven_text_to_sound_v2, is removed on 2027-03-01.
  voices.delete: Works on your own voices and library copies. It can't be undone.
  voiceDesign.create: Needs a free voice slot; over `voice_limit` (see `account.subscription`) ElevenLabs answers 400.
  voiceDesign.design: Cost follows the preview text, at about a credit a character in our tests (101 credits with a 101-character `text`, 200 with `autoGenerateText`). Audio doesn't come back here. Previews are always made for streaming, which is what lets `voiceDesign.getPreview` read them, and `duration_secs` reads -1 for them.
  voiceDesign.getPreview: Reading a preview spent no credits in our test, read twice. `outputFormat` on the design or remix sets its format. We didn't test how long a preview stays readable.
  voiceDesign.remix: Only works on your own custom voices. It makes previews, read with `voiceDesign.getPreview`, and leaves the source voice as it is. In our tests it cost 101 credits with a 101-character `text` and 350 with `autoGenerateText`.
  dubbing.create: Returns at once. Follow `dubbing_id` with `dubbing.get` until `status` is `dubbed` or `failed`. By default dubbing clones the speakers it hears; set `disableVoiceCloning` true to use library voices instead.
  dubbing.getAudio: Audio or video, per `contentType`. Subject to `maxBytes`, so raise it for anything long.
  history.list: Deleted items still count toward a page, so a page can be short or even empty while `has_more` is true. Keep going with `last_history_item_id` until `has_more` is false.
  history.getAudio: Subject to `maxBytes` (default 700000 bytes), so raise it for anything long. A new item can take a few seconds to appear, and reading it before then answers 400.
  account.user: The API reports the key (or part of it) here, and those fields are removed from the result.
  account.usageStats: For workspaces billed in credits. One billed by cost gets a 400 naming a different report.
  agents.create: "`conversationConfig` keeps the API's field names and is passed through as sent. An empty agent is fine; `agent.prompt.prompt` and `agent.first_message` are the usual place to start."
  agents.signedUrl: The URL lets a client talk to the agent, and that conversation spends credits. Treat it as a secret. This plugin doesn't hold the conversation itself.
  singleUseTokens.create: Works once and expires after 15 minutes. Treat it as a secret until it's used.
apiExamples:
  textToSpeech.convert:
    call: "{ voiceId: 'FGY2WhTYpPnrIDTdsKH5', text: 'Your order has shipped.', modelId: 'eleven_flash_v2_5', outputFormat: 'mp3_22050_32' }"
  textToSpeech.convertWithTimestamps:
    call: "{ voiceId: 'FGY2WhTYpPnrIDTdsKH5', text: 'Hi there.', modelId: 'eleven_flash_v2_5' }"
  textToDialogue.convert:
    call: "{ inputs: [{ text: 'Are you ready?', voiceId: 'FGY2WhTYpPnrIDTdsKH5' }, { text: 'Always.', voiceId: 'JBFqnCBsd6RMkjVDRZzb' }], outputFormat: 'mp3_22050_32' }"
  speechToText.convert:
    call: "{ sourceUrl: 'https://example.com/call.mp3', diarize: true }"
  speechToText.getTranscript:
    call: "{ transcriptionId: '<transcription id>' }"
  speechToText.deleteTranscript:
    call: "{ transcriptionId: '<transcription id>' }"
  forcedAlignment.create:
    call: "{ fileBase64: '<base64 audio>', fileName: 'line.mp3', contentType: 'audio/mpeg', text: 'Hello from Corsair.' }"
  soundEffects.generate:
    call: "{ text: 'a door creaking open', durationSeconds: 2, outputFormat: 'mp3_22050_32' }"
  music.compose:
    call: "{ prompt: 'a calm piano loop', musicLengthMs: 10000, forceInstrumental: true, outputFormat: 'mp3_22050_32' }"
  music.plan:
    call: "{ prompt: 'an upbeat jingle', musicLengthMs: 15000 }"
  music.separateStems:
    call: "{ fileBase64: '<base64 song>', fileName: 'song.mp3', stemVariationId: 'two_stems_v1' }"
  audioIsolation.isolate:
    call: "{ fileBase64: '<base64 audio>', fileName: 'noisy.mp3', contentType: 'audio/mpeg' }"
  voiceChanger.convert:
    call: "{ voiceId: 'JBFqnCBsd6RMkjVDRZzb', fileBase64: '<base64 audio>', modelId: 'eleven_multilingual_sts_v2' }"
  voices.list:
    call: "{ search: 'narrator', pageSize: 10 }"
  voices.get:
    call: "{ voiceId: 'FGY2WhTYpPnrIDTdsKH5' }"
  voices.searchLibrary:
    call: "{ search: 'calm narrator', language: 'en', pageSize: 10 }"
  voices.addFromLibrary:
    call: "{ publicUserId: '<public_owner_id>', voiceId: '<voice id>', newName: 'Narrator' }"
  voices.edit:
    call: "{ voiceId: '<voice id>', name: 'Narrator', description: 'For product videos' }"
  voices.delete:
    call: "{ voiceId: '<voice id>' }"
  voices.getSettings:
    call: "{ voiceId: 'FGY2WhTYpPnrIDTdsKH5' }"
  voices.editSettings:
    call: "{ voiceId: '<voice id>', settings: { stability: 0.4, similarity_boost: 0.7 } }"
  voices.defaultSettings:
    call: "{}"
  voiceDesign.design:
    call: "{ voiceDescription: 'A calm middle-aged narrator with a warm low voice.', autoGenerateText: true, outputFormat: 'mp3_22050_32' }"
  voiceDesign.getPreview:
    call: "{ generatedVoiceId: '<generated_voice_id>', maxBytes: 2000000 }"
  voiceDesign.create:
    call: "{ voiceName: 'Narrator', voiceDescription: 'A calm middle-aged narrator with a warm low voice.', generatedVoiceId: '<generated_voice_id>' }"
  voiceDesign.remix:
    call: "{ voiceId: '<your voice id>', voiceDescription: 'A little brighter.', autoGenerateText: true }"
  dubbing.create:
    call: "{ sourceUrl: 'https://example.com/clip.mp4', targetLang: 'es', watermark: true }"
  dubbing.get:
    call: "{ dubbingId: '<dubbing id>' }"
  dubbing.list:
    call: "{ pageSize: 20, dubbingStatus: 'dubbed' }"
  dubbing.delete:
    call: "{ dubbingId: '<dubbing id>' }"
  dubbing.getAudio:
    call: "{ dubbingId: '<dubbing id>', languageCode: 'es', maxBytes: 10000000 }"
  dubbing.getTranscript:
    call: "{ dubbingId: '<dubbing id>', languageCode: 'es', formatType: 'srt' }"
  history.list:
    call: "{ pageSize: 20, source: 'TTS' }"
  history.get:
    call: "{ historyItemId: '<history item id>' }"
  history.getAudio:
    call: "{ historyItemId: '<history item id>', maxBytes: 5000000 }"
  history.delete:
    call: "{ historyItemId: '<history item id>' }"
  models.list:
    call: "{}"
  account.user:
    call: "{}"
  account.subscription:
    call: "{}"
  account.usageStats:
    call: "{ startTime: 1793750400000, endTime: 1794355200000, groupBy: ['product_type'] }"
  agents.list:
    call: "{ pageSize: 20, search: 'support' }"
  agents.get:
    call: "{ agentId: '<agent id>' }"
  agents.create:
    call: "{ name: 'Support', conversationConfig: { agent: { first_message: 'Hi, how can I help?', prompt: { prompt: 'You answer questions about orders.' } } } }"
  agents.update:
    call: "{ agentId: '<agent id>', name: 'Support v2', tags: ['support'] }"
  agents.delete:
    call: "{ agentId: '<agent id>' }"
  agents.conversationsList:
    call: "{ agentId: '<agent id>', pageSize: 20 }"
  agents.conversationGet:
    call: "{ conversationId: '<conversation id>' }"
  agents.conversationDelete:
    call: "{ conversationId: '<conversation id>' }"
  agents.signedUrl:
    call: "{ agentId: '<agent id>' }"
  singleUseTokens.create:
    call: "{ tokenType: 'tts_websocket' }"
