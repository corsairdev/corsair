displayName: Google Sheets
description: Web-based spreadsheets for managing, visualizing, and analyzing data collaboratively online.
examples:
  read:
    path: sheets.getRows
    title: Get rows
    args:
      spreadsheetId: 1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms
      sheetName: Class Data
  write:
    path: sheets.appendRow
    title: Append a row
    args:
      spreadsheetId: 1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms
      sheetName: Class Data
      values:
        - Hello
        - from Corsair
dbExample:
  entity: rows
  note: Search synced rows without hitting Sheets.
  data:
    spreadsheetId: 1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms
  limit: 50
exampleWebhook:
  path: rangeUpdated
  note: Fires when a range of cells is updated.
  after: |
    console.log('Sheet range updated:', result.data?.spreadsheetId, result.data?.sheetName, result.data?.range);
