overviewNote: >-
  Authenticated calls require an API key in the X-ListenAPI-Key header. Playlist mutations apply only to playlists owned by the API admin account. Confirm destructive requests before using them; the podcast-delete example uses the provider's `reason: testing` safeguard.
apiNotes:
  search.search: >-
    Pass `next_offset` from a response as `offset` for pagination. Search results are limited by plan: FREE up to offset 30, PRO up to 300, and ENTERPRISE up to 10,000. `interviews_only` and `sponsored_only` are PRO/ENTERPRISE filters.
  search.searchEpisodeTitles: >-
    The response may contain `next_offset`, but the official OpenAPI request parameter list for this operation includes only `q`, `podcast_id`, and `podcast_id_type`; it does not document `offset`. The field is returned as provider metadata, not as a supported pagination cursor. Source: https://listen-api.listennotes.com/api/v2/openapi.json#/paths/~1search_episode_titles/get.
  search.relatedSearches: >-
    This endpoint is available only on Listen Notes PRO and ENTERPRISE plans.
  search.spellcheck: >-
    This endpoint is available only on Listen Notes PRO and ENTERPRISE plans.
  podcasts.get: >-
    The response includes up to 10 episodes. Use `next_episode_pub_date` from the response to paginate; an empty `episodes` array means there are no more.
  podcasts.getEpisodes: >-
    This convenience operation uses the documented `GET /podcasts/{id}` route and its `next_episode_pub_date` cursor; it is not a separate `/episodes` sub-route.
  podcasts.getBest: >-
    Pass `next_page_number` as `page` for pagination. `sort` accepts recent_added_first, oldest_added_first, recent_published_first, oldest_published_first, and listen_score.
  podcasts.getBatch: >-
    POSTs form-encoded selectors and supports up to 10 podcasts. This endpoint is available only on PRO and ENTERPRISE plans; supply at least one selector (`ids`, `rsses`, `itunes_ids`, or `spotify_ids`). With `show_latest_episodes: 1`, pass `next_episode_pub_date` from the response to paginate the latest episodes.
  podcasts.delete: >-
    This submits a podcast deletion request, which Listen Notes reviews within 12 hours. The provider documents `reason: testing` as a way to test without deleting; otherwise confirm the request before use.
  podcasts.submit: >-
    Submissions may be found, reviewed, or rejected by Listen Notes. An email is optional and is used only for the provider's acceptance notification.
  podcasts.refreshRss: >-
    Available on PRO and ENTERPRISE plans; each podcast can be refreshed at most once per hour and processing may take several minutes.
  podcasts.getAudience: >-
    Audience estimates are available only for some podcasts; an empty response is valid when the provider has no regional data.
  podcasts.getByDomain: >-
    Returns up to 10 podcasts per page. Pass `next_page_number` as `page` to continue.
  episodes.get: >-
    `show_transcript: 1` requests a transcript when available; transcript data requires a PRO or ENTERPRISE plan.
  episodes.getBatch: >-
    Supports up to 10 episode IDs and is available only on PRO and ENTERPRISE plans.
  playlists.list: >-
    `sort` supports `name_a_to_z` and `name_z_to_a`; `page` paginates through playlists.
  playlists.get: >-
    A playlist can hold both episodes and podcasts. Use `type` to choose the view and `last_timestamp_ms` from the response to paginate.
  playlists.create: >-
    Creates an empty playlist owned by the API admin. Playlist changes require ownership by that admin account; contributor membership is not sufficient.
  playlists.update: >-
    Updates at least one of name, description, visibility, or type. Switching to private rotates the playlist RSS secret.
  playlists.delete: >-
    Permanently deletes an owned playlist and its saved references. This cannot be undone; require an explicit confirmation before calling it.
  playlists.addItem: >-
    Supply exactly one 32-character episode ID or podcast ID. Existing active items are reused; the operation can restore deleted items.
  playlists.updateItem: >-
    Replaces item notes; an empty string clears them. Only playlists owned by the API admin can be modified.
  playlists.deleteItem: >-
    Removes the playlist reference (not the episode or podcast). Only playlists owned by the API admin can be modified.
