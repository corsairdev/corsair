displayName: Listen Notes
description: Podcast search, directory, playlist, and audience insights API for exploring and managing podcast data.
examples:
  read:
    path: search.search
    title: Search podcast episodes
    args:
      q: startup
  write:
    path: playlists.create
    title: Create a podcast playlist
    args:
      name: Research queue
