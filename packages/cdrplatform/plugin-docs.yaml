displayName: CDR Platform
description: API for purchasing carbon dioxide removal services from Climacrux.
overviewNote: |
  Official HTTP API at `https://api.cdrplatform.com`. Every request uses
  `Authorization: Api-Key <key>` — not Bearer. Costs are in the currency's
  smallest unit (cents for USD). Keys prefixed `test_` are not charged.
  Docs: https://docs.cdrplatform.com/docs/getting-started
examples:
  read:
    path: cdr.price
    title: Get CDR price
  write:
    path: cdr.purchase
    title: Purchase CDR
