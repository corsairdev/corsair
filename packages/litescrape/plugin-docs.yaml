displayName: LiteScrape
description: "Web data API with 200 read operations across 70 sites: Google, Bing, Brave, Yahoo, Baidu, Naver and Yandex search; Google, Apple, Bing and DuckDuckGo maps and reviews; Amazon, Walmart, eBay and other shops; TikTok, Instagram, X, YouTube, LinkedIn and Reddit; job boards; real estate; and web page fetch and screenshots."
overviewNote: "Every operation is a read that spends one prepaid Litescrape call; failed calls are not billed. Pass `timeout` (seconds, up to 90) to bound a slow scrape. `keys.status` shows the calls left."
examples:
  read:
    path: google.search
    title: Search Google
    args: {"q": "python documentation", "num": 3, "fast_mode": true}
  write:
    path: amazon.product
    title: Look up an Amazon product
    args: {"asin": "B072MQ5BRX"}
