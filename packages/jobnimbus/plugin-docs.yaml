displayName: JobNimbus
description: Cloud-based CRM and job management software for contractors — manage contacts, jobs, work orders, estimates, invoices, material orders, payments, tasks, and files.
overviewNote: Generate a JobNimbus API key from your JobNimbus account under Settings > API > New API key. Select the desired Access Profile and save. Pass the token as the API key to authenticate requests.
examples:
  read:
    path: contacts.list
    title: List contacts
    args:
      size: 10
  write:
    path: contacts.create
    title: Create a new contact
    args:
      first_name: John
      last_name: Doe
      record_type_name: Customer
      status_name: Lead
