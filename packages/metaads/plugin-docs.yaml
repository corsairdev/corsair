displayName: Meta Ads
description: Read ad accounts and activity, manage campaign and delivery objects, labels, budget schedules, ad studies, custom-audience memberships and sharing, previews, and synchronous or asynchronous Ads Insights through Meta Marketing API v27.0.
overviewNote: "Supply an OAuth access token with ads_read for reporting or ads_management for management; the token must also have access to the target ad account."
examples:
  read:
    path: accounts.list
    title: List ad accounts
  write:
    path: labels.create
    title: Create an ad label
    args:
      accountId: "1234567890"
      name: "Spring promotion"
apiNotes:
  accounts.list: "Meta requires access_token as a request parameter. Use a user or system-user access token stored in Corsair's encrypted credential store."
  accounts.usersList: "Lists the documented app-scoped ad-account users and tasks. This edge does not create, update, or remove permissions."
  accounts.activitiesList: "Reads the recent account activity feed; the reference documents no query parameters on this edge."
  accounts.impactingAdStudiesList: "Lists documented ad studies affecting the account or descendant ad objects."
  accounts.adRulesLibraryList: "Lists account ad rules only; rule creation and editing are not exposed by this operation."
  accounts.activeAdRulesList: "Requires selectedIds and accepts an optional passEvaluation filter; it does not execute or change rules."
  accounts.generatePreviews: "Accepts only an object_story_spec with a documented link_data or other supported single content type, plus a bounded placement enum; returns expiring HTML as inert text."
  accounts.broadTargetingCategoriesList: "Lists the documented broad-targeting category fields; this is separate from the unified targeting browse/search edges whose node contract is pending."
  images.upload: "Accepts base64 bytes or copies an image by source account and hash. The adapter removes upload form data from propagated core errors."
  images.delete: "Only images not currently used by an ad creative can be deleted from the account library."
  campaigns.list: "Pass returned paging.cursors.after to continue and use paging.hasNextPage to detect continuation; the adapter never returns or follows Meta's paging.next URL because it may contain credentials."
  campaigns.adSetsList: "Lists the documented ad sets edge for one campaign; use the cursor fields to continue through results."
  campaigns.adsList: "Lists the documented ads edge for one campaign; use the cursor fields to continue through results."
  campaigns.copiesList: "Lists the documented campaign copies edge and supports Graph cursor pagination."
  campaigns.copy: "Creates a shallow campaign copy with status_option fixed to PAUSED. Deep-copying child ads and arbitrary campaign parameter overrides are not exposed, and the non-idempotent write is not retried."
  campaigns.labelsAdd: "Associates documented label IDs or names with a campaign. The Ad Set association endpoint is not exposed because its route-specific reference could not be verified."
  campaigns.budgetSchedulesList: "Supports the documented timeStart/timeStop filters and Graph cursor paging."
  campaigns.budgetScheduleCreate: "Schedules a high-demand budget period. The daily-budget, 3-hour minimum, 8x ceiling, and account capability constraints remain provider-enforced; this write is not retried."
  campaigns.adStudiesList: "Lists ad studies associated with this campaign."
  campaigns.adRulesGovernedList: "Lists rules that govern the campaign; passEvaluation is an optional documented filter."
  highDemandPeriods.get: "Reads a single high-demand period by its Graph object ID."
  campaigns.create: "Campaign creation requires objective (for example OUTCOME_TRAFFIC) and specialAdCategories (use [] when no special category applies). Meta v27's campaign-create example uses OUTCOME_TRAFFIC with an empty special_ad_categories array. This consequential write is destructive and isn't automatically retried. Budget values are integer smallest-currency units."
  campaigns.update: "Budget and spend-cap edits are consequential writes and aren't automatically retried."
  adSets.list: "Pass returned paging.cursors.after to continue and use paging.hasNextPage to detect continuation; the adapter never returns or follows Meta's paging.next URL because it may contain credentials."
  adSets.adsList: "Lists the documented ads edge for one ad set; use the cursor fields to continue through results."
  adSets.adCreativesList: "Lists creatives associated with the ad set; Graph returns cursor paging but documents no edge query parameters."
  adSets.copiesList: "Lists the documented ad-set copies edge and supports Graph cursor pagination."
  adSets.copy: "Creates a copy with status_option fixed to PAUSED. Deep-copying child ads is not exposed and the non-idempotent write is not retried. EU-targeted copies may require DSA payor and beneficiary settings."
  adSets.activitiesList: "Reads ad-set activity history; businessId may be required by Meta for accounts associated with a business."
  adSets.adStudiesList: "Lists ad studies associated with this ad set."
  adSets.adRulesGovernedList: "Lists rules that govern the ad set; passEvaluation is an optional documented filter."
  ads.adRulesGovernedList: "Lists rules that govern the ad; passEvaluation is an optional documented filter."
  adSets.create: "Supply optimizationGoal (REACH) and billingEvent (IMPRESSIONS), a documented Meta v27 ad-set example. This consequential write is destructive and isn't automatically retried. Budgets use integer smallest-currency units; initial status defaults to PAUSED. Meta v27 can enable cross-device expansion for eligible Sales ad sets unless the documented targeting automation setting is set to 0; EU targeting needs beneficiary/payer account defaults or explicit values."
  ads.create: "Use an existing creative ID or an inline creative with object_story_spec. New ads enter review and can deliver after approval; this consequential write isn't automatically retried."
  ads.adCreativesList: "Lists creatives attached to the ad; Graph returns cursor paging but documents no edge query parameters."
  ads.adStudiesList: "Lists ad studies containing this ad."
  ads.previewsList: "Returns provider HTML in the body field. Only seven common formats are accepted here; treat preview HTML as untrusted text and note Meta says the iframe is valid for 24 hours."
  ads.copiesList: "Lists the documented ad copies edge and supports Graph cursor pagination."
  ads.copy: "Creates a copy with status_option fixed to PAUSED. Creative overrides are not exposed; optionally pass adSetId to choose a parent ad set. The non-idempotent write is not retried."
  creatives.create: "Use either an existing Page post ID or object_story_spec with page_id and exactly one documented content type: link_data, photo_data, video_data, text_data, or template_data. Political issue/election creatives need the documented authorizationCategory."
  creatives.insightsList: "Reads the documented aesthetics quality metric; it does not expose a generalized performance-report surface."
  creatives.previewsList: "Returns provider HTML in the body field. Only seven common formats are accepted here; treat preview HTML as untrusted text and note Meta says the iframe is valid for 24 hours."
  audiences.create: "Creates a blank CUSTOM audience. Pass customerFileSource (USER_PROVIDED_ONLY, PARTNER_PROVIDED_ONLY, or BOTH_USER_AND_PARTNER_PROVIDED) for customer-file uploads; the field is optional in the general create reference, though Meta's Customer File guide says to specify it for that workflow. Add or remove members later with usersAdd/usersRemove; only single-key SHA-256 email or phone hashes are accepted, up to 10000 per request. Adds also require upload-session and batch metadata. Raw identifiers and multi-key matching are not exposed. Request payloads are omitted from propagated error metadata and echoed invalid-entry samples are stripped from successful results."
  audiences.adsList: "Lists ads associated with the custom audience; this is a read-only edge and requires permission to read the audience and its ads."
  audiences.adAccountsList: "Lists shared ad-account IDs and can filter by targeting or targeting_and_insights permission."
  audiences.delete: "Deletion is permanent and ads using the audience stop; they cannot be restarted."
  audiences.sessionsList: "Reads documented upload session status fields; it does not upload audience members."
  audiences.usersAdd: "Set schema to EMAIL_SHA256 or PHONE_SHA256; only single-key SHA-256 hashes are accepted, up to 10000 per batch. Use a unique ad-account session ID and sequential batch numbers; input payloads are omitted from propagated error metadata and invalid-entry samples are stripped from results."
  audiences.usersRemove: "Set schema to EMAIL_SHA256 or PHONE_SHA256; removes up to 10000 single-key SHA-256 hashes. Input payloads are omitted from propagated error metadata."
  audiences.usersReplace: "Replaces audience members in a unique upload session using only single-key SHA-256 email or phone hashes. This is a destructive membership operation; request values and echoed samples are redacted."
  audiences.adAccountsShare: "Requires a business to claim both the owner and recipient accounts. Sharing grants cross-account access and is a destructive operation; use explicit recipient IDs."
  audiences.adAccountsUnshare: "Revoking access may stop recipient ads using the audience, and Meta says those ads cannot be restarted."
  studies.create: "Creates only a simple SPLIT_TEST using ad-set cells. Each cell needs at least 10% treatment, treatment percentages must total at most 100%, and each cell must include an ad set. This non-idempotent operation is not automatically retried."
  studies.update: "Only name, description, and endTime are exposed. Meta limits changes after the study starts; extending the end time changes the experiment."
  studies.get: "Reads a single documented ad study by ID."
  studies.relatedAccountsList: "Lists ad accounts related to the study."
  studies.viewersList: "Lists users who can view the study."
  videos.delete: "Dissociates the specified video from the ad-account library; it does not delete the source video."
  insights.list: "Synchronous metrics with allow-listed fields, breakdowns, filters, attribution windows, sorting, summary, and time increments. Meta may reject unsupported field/breakdown combinations."
  insights.listForCampaign: "Reads the same typed synchronous Insights fields directly from a campaign node."
  insights.listForAdSet: "Reads the same typed synchronous Insights fields directly from an ad-set node."
  insights.listForAd: "Reads the same typed synchronous Insights fields directly from an ad node."
  insights.createAsync: "Starts a non-idempotent Insights report job. Poll insights.getAsyncReport until completion, then call insights.getAsyncResults; report IDs expire after 30 days."
  insights.getAsyncReport: "Poll async_status and async_percent_completion. Failed jobs include documented error details on v25 and later."
  insights.getAsyncResults: "Fetch cursor-paginated results only after the report job completes."
  insights.listFeatures: "Lists documented account Insights features, including breakdown features."
  insights.listEnabledFeatures: "Lists enabled features; a missing feature is equivalent to disabled."
  insights.enableFeature: "Pass a documented featureName: comscore, impression_device, time_of_day_viewer_tz, or frequency_value. This is a one-way enable operation; Meta documents no API to disable a feature. New breakdown data can take about 24 hours to become available."
