displayName: Placid
description: Creative automation with Placid - render templates to images, PDFs and videos, plus the template, collection, media and font operations behind them.
domain: placid.app
recommendedAuth: api_key
overviewNote: |
  Create an API project in Placid, open the project, then click API Tokens in the left menu. Tokens are project-scoped: a token only reaches the templates of the project that owns it, and a token from another project returns 401.

  - **Renders are queued.** `images.create`, `pdfs.create`, `videos.create` and `pdfs.merge` reply with `status: 'queued'` almost every time. Poll the reply's `polling_url` with the matching `get`, or pass `webhook_success` and let Placid call you. The file URL is null until `status` is `finished`.
  - **Failures are reported after the fact.** A render that fails still returns a 200 from the create call. Read the `status: 'error'` reply for `error_code`, `error_message` and `error_details`. Branch on `error_code`, which does not change; `error_message` can be reworded.
  - **Deleting a generated file keeps its record.** `images.delete`, `pdfs.delete` and `videos.delete` answer 204 and empty the file URL, but a later `get` still returns 200 with an empty `image_url` rather than a 404. Do not poll for a 404 to confirm a delete.
  - **`collections` returns `templates`.** Placid's docs name the member list `template_uuids`, but the API answers `templates`, a plain array of UUID strings. Both are read, so either spelling works.
  - **Credits.** One image is one credit, one PDF page is two, and a video is ten credits per ten seconds. `create_now: true` renders immediately instead of queueing, and Placid allows 10 simultaneous calls that way.
  - **Rate limit.** 60 requests per minute. A 429 is retried up to three times with backoff. A 5xx is only retried on reads, because repeating a create would render and bill a second file.
  - **Layers.** `layers` is keyed by the layer name set in the template editor, and every property a layer type supports is accepted. Omitted properties keep the template default. `templates.list` and `templates.get` return each dynamic layer's name and type, which is how to discover the keys.
  - **Uploads take URLs.** `media.upload` and `fonts.create` accept a public `file_url`; the plugin downloads it and forwards the bytes as multipart. The bytes cannot come from a local path.
  - **Fonts.** A font upload requires `terms_accepted: true`. The returned `uuid` is the value to set as the `font` property on a text layer.
  - **Uploads are checked.** `media.upload` and `fonts.create` fetch a public HTTP(S) `file_url`. Private, loopback and cloud-metadata addresses are rejected, the connection is pinned to a checked address so a changing DNS answer cannot swap in a private one, each redirect hop is checked, and the download has a 30 second deadline and a 25 MB cap.
  - **Webhooks.** The plugin does not receive webhooks. Placid calls the `webhook_success` URL you supply on a create.
examples:
  read:
    path: templates.list
    title: List templates by tag
    args:
      tag: social
  write:
    path: images.create
    title: Render an image from a template
    args:
      template_uuid: ospo24ysn
      layers:
        title:
          text: Meet Singh
        img:
          image: https://faywoodwildlife.com/images/lion-singh.jpg
apiExamples:
  images.create:
    call: "{ template_uuid: 'ospo24ysn', layers: { title: { text: 'Meet Singh' } }, create_now: true }"
  images.get:
    call: "{ id: 1 }"
  images.delete:
    call: "{ id: 1 }"
  pdfs.create:
    call: "{ pages: [{ template_uuid: 'cover', layers: { title: { text: 'Certificate' } } }] }"
  pdfs.merge:
    call: "{ urls: ['https://example.com/a.pdf', 'https://example.com/b.pdf'] }"
  pdfs.get:
    call: "{ id: 2 }"
  pdfs.delete:
    call: "{ id: 2 }"
  videos.create:
    call: "{ clips: [{ template_uuid: 'illcmemnt', layers: { title: { text: '@username' } } }], modifications: { fps: 25 } }"
  videos.get:
    call: "{ id: 3 }"
  videos.delete:
    call: "{ id: 3 }"
  templates.list:
    call: "{ tag: 'social', order_by: 'title-asc' }"
  templates.create:
    call: "{ title: 'Employee of the month', width: 1080, height: 1080, tags: ['social'] }"
  templates.get:
    call: "{ template_uuid: 'ospo24ysn' }"
  templates.update:
    call: "{ template_uuid: 'ospo24ysn', title: 'Renamed' }"
  templates.delete:
    call: "{ template_uuid: 'ospo24ysn' }"
  collections.list:
    call: "{ per_page: 20 }"
  collections.create:
    call: "{ title: 'Acme onboarding', template_uuids: ['ospo24ysn'] }"
  collections.get:
    call: "{ collection_id: 'col_1234' }"
  collections.update:
    call: "{ collection_id: 'col_1234', add_template_uuids: ['new_one'] }"
  collections.delete:
    call: "{ collection_id: 'col_1234' }"
  media.upload:
    call: "{ file_url: 'https://example.com/assets/logo.jpg' }"
  fonts.list:
    call: "{ include_legacy: true }"
  fonts.get:
    call: "{ uuid: 'f1abc123def456' }"
  fonts.create:
    call: "{ file_url: 'https://example.com/HelveticaNeue-Regular.ttf', title: 'Helvetica Neue', terms_accepted: true }"
  fonts.update:
    call: "{ uuid: 'f1abc123def456', title: 'Helvetica Neue Bold' }"
  fonts.delete:
    call: "{ uuid: 'f1abc123def456' }"
