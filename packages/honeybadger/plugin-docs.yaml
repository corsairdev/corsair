    call: "{ project_id: 'Xk9mZp', site_id: '9f8b6d2e-4c1a-4b7f-9e35-2a6c8d0f1b47' }"
  sites.checks:
    call: "{ project_id: 'Xk9mZp', site_id: '9f8b6d2e-4c1a-4b7f-9e35-2a6c8d0f1b47', limit: 25 }"
  sites.outages:
    call: "{ project_id: 'Xk9mZp', site_id: '9f8b6d2e-4c1a-4b7f-9e35-2a6c8d0f1b47' }"
  streams.list:
    call: "{ project_id: 'Xk9mZp' }"
  insights.query:
    call: "{ project_id: 'Xk9mZp', query: '@size > 0 | limit 10', ts: '1h' }"
  account.get:
    call: "{}"
  account.usage:
    call: "{}"
  token.get:
    call: "{}"
apiNotes:
  projects.list: 'Returns `data` and `pagination`. `name` is an exact match, not a search.'
  faults.list: '`q` uses the web UI error search syntax. `occurred_after` also narrows the occurrence counts each fault reports.'
  faults.resolve: 'Answers the number changed, which counts what changed rather than what matched: resolving a hundred faults of which ninety were already resolved reports ten.'
  faults.merge: 'Answers 202 with a `batch_id`; the merge runs in the background. Until it finishes the old fault is readable, then reads redirect.'
  faults.snooze: 'Send exactly one of `time` or `count`. `count` is one of 10, 100 or 1000.'
  notices.list: 'The first page is the newest notices. Follow `links.older` for earlier ones; `links.newer` is always null here.'
  checkIns.create: 'A `simple` schedule needs `report_period`. A `cron` schedule needs `cron_schedule` and takes the web app timezone name, not an IANA identifier.'
  checkIns.replace: 'This replaces the whole set: every check-in the list does not name is deleted.'
  sites.create: '`match` is required for every match type except `success`, which refuses it. `timeout` must be less than the frequency in seconds.'
  insights.query: 'A POST that changes nothing, so it is a read and safe to replay. The `data` columns depend on the query.'
  token.get: 'Needs no scope, so it is the cheapest way to check that a token works and which region it belongs to.'
