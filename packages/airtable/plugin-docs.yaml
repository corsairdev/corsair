displayName: Airtable
description: Spreadsheet-database hybrid for organizing records, workflows, and collaborative project data.
recommendedAuth: api_key
examples:
  read:
    path: bases.getMany
    title: List accessible bases
  write:
    path: records.create
    title: Create a record
    args:
      baseId: appXXXXXXXXXXXXXX
      tableIdOrName: tblXXXXXXXXXXXXXX
      fields:
        Name: Ada Lovelace
dbExample:
  entity: records
  note: Search synced Airtable records without calling the API again.
  data:
    tableId: tblXXXXXXXXXXXXXX
  limit: 20
exampleWebhook:
  path: events.event
  note: React when an Airtable base sends a change notification.
  after: |
    console.log('Airtable event:', result.data);
