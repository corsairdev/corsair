# Display copy for the docs, the catalog, corsair.dev and Hub.
# `pnpm validate:plugins` fails until the TODO is replaced.
displayName: "Payhip"
description: "Payhip is a digital products storefront. This plugin creates and manages discount coupons with the account API key, and verifies, enables, disables and counts software license keys with the per-product secret key. Coupon bodies are form-encoded as the API requires."
domain: payhip.com
recommendedAuth: api_key
overviewNote: >
  Two credentials are involved, both stored on the account. Coupon
  operations authenticate with the account API key (Developer Settings in
  the Payhip account) in the payhip-api-key header. License-key operations
  authenticate with a per-product secret key in the product-secret-key
  header; store that secret on the account (product_secret_key) or pass
  productSecret in the plugin options. You can find a product's secret key
  in the Payhip product settings.

  Bodies are form-encoded, as the API requires; the plugin builds them for
  you. Payhip's purchase-event webhooks exist but their signature scheme is
  not documented in the API reference, so this plugin does not receive
  them.

  Note on license.decreaseUsage: the reference's endpoint list names
  /api/v2/license/decrease while its curl example reuses the /usage URL;
  this plugin follows the endpoint list. If the API answers 404 for a
  decrease, tell us and we will switch the route.

  Every operation is described in the official reference:
  https://payhip.com/api-reference
examples:
  read:
    path: license.verify
    title: Verify a license key
    args:
      license_key: WTKP4-66NL5-HMKQW-GFSCZ
  write:
    path: coupons.create
    title: Create a coupon for one product
    args:
      code: example123
      coupon_type: single
      product_key: PtRJw
      percent_off: 25
apiExamples:
  coupons.create:
    call: '{ code: "example123", coupon_type: "multi", percent_off: 20, usage_limit: 100 }'
  coupons.list:
    call: '{ limit: 10, offset: 0 }'
  coupons.get:
    call: '{ couponId: 1495522137 }'
  license.verify:
    call: '{ license_key: "WTKP4-66NL5-HMKQW-GFSCZ" }'
  license.disable:
    call: '{ license_key: "WTKP4-66NL5-HMKQW-GFSCZ" }'
  license.enable:
    call: '{ license_key: "WTKP4-66NL5-HMKQW-GFSCZ" }'
  license.increaseUsage:
    call: '{ license_key: "WTKP4-66NL5-HMKQW-GFSCZ" }'
  license.decreaseUsage:
    call: '{ license_key: "WTKP4-66NL5-HMKQW-GFSCZ" }'
apiNotes:
  coupons.create: 'Exactly one of percent_off (0-100) or amount_off (cents) is required; coupon_type single needs product_key, collection needs collection_id. Subscriptions priced with a recurring amount cannot be discounted through the API yet.'
  coupons.list: 'Paged with limit and offset.'
  license.verify: 'Answers the license key with enabled, uses, buyer_email and product fields.'
  license.disable: 'Payhip disables a license key automatically when a purchase is refunded.'
  license.increaseUsage: 'Increments the uses counter (an activation).'
  license.decreaseUsage: 'Decrements the uses counter (a deactivation). The docs'' endpoint list names /license/decrease while the example reuses /license/usage; see the overview note.'
