displayName: ScrapingAnt
description: Web scraping with ScrapingAnt - fetch a page as rendered HTML, as Markdown or as structured AI-extracted JSON, read the extended page data (cookies, headers, XHRs, iframes), and check credit usage.
domain: scrapingant.com
recommendedAuth: api_key
overviewNote: |
  Create an API token at https://app.scrapingant.com/dashboard. An existing token keeps working; reset it from the Profile page if it leaks.

  Things to know before you scrape:

  - **Every call spends credits.** A request costs 1 credit with neither browser nor rendering, 2 with the browser but no JavaScript, 10 with full JavaScript rendering, and 25, 50 or 125 with the residential proxy. A Google domain costs 10 even without the browser. Each result carries `credits_cost` from the `Ant-credits-cost` header. `account.usage` costs nothing.
  - **The API answers 200 whatever the target page did.** Read `page_status` (from `Ant-page-status-code`) on `scrape.html`, or `status_code` on `scrape.extended`, before trusting the content. Only those two expose it: `scrape.markdown` and `extract.data` convert a target 404 as if it were a page.
  - **The provider's defaults are not the cheapest ones.** `browser` defaults to true at 10 credits. Send `browser: false` for a plain HTTP fetch at 1.
  - **Browser-only options are rejected here, not ignored.** `return_page_source`, `js_snippet`, `wait_for_selector` and `block_resource` do nothing without the browser, so sending one with `browser: false` fails before the request instead of silently applying nothing.
  - **`js_snippet` is base64.** ScrapingAnt runs the decoded JavaScript; sending raw source is a `422`. `Buffer.from('window.scrollTo(0,0)').toString('base64')` is the shape expected.
  - **A 403 has three meanings.** The token is wrong, the plan's credits are exhausted, or the caller's IP is not on the account allowlist. The message tells them apart and the error exposes `isAuthError`, `isQuotaExhausted` and `isIpBlocked`, so a failure does not send you to re-enter a working key.
  - **Retries.** A 423 (the target detected the browser), a 404 (the site was unreachable or a worker timed out) and a 500 are retried a bounded number of times; a 409 on the free plan waits and retries; an exhausted balance, a bad token, an IP block and a `422` are not retried. ScrapingAnt sends no `Retry-After`, so the delays are fixed rather than header-driven.
  - **`extract.data` is free-form.** `extract_properties` is the prompt, and the answer is an object keyed by camelCased property names. A property the model cannot find comes back as `null` rather than failing the call.
  - **Chaining a session.** `scrape.extended` returns the page cookies in `cookies`; pass that string to the next call's `cookies` to keep the session.
  - **No webhooks.** ScrapingAnt does not send them.
examples:
  read:
    path: scrape.markdown
    title: Convert a page to Markdown for an LLM
    args:
      url: https://example.com/
      browser: false
  write:
    path: extract.data
    title: Extract a product title and price
    args:
      url: https://example.com/product
      extract_properties: 'product title, price(number)'
apiExamples:
  scrape.html:
    call: "{ url: 'https://example.com/', browser: false }"
  scrape.markdown:
    call: "{ url: 'https://example.com/', browser: true, proxy_country: 'DE' }"
  scrape.extended:
    call: "{ url: 'https://example.com/', wait_for_selector: 'h1' }"
  extract.data:
    call: "{ url: 'https://example.com/product', extract_properties: 'product title, price(number), reviews(list: review title, review content)' }"
  account.usage: {}
apiNotes:
  scrape.html: 'Answers the page itself as text, plus `page_status` and `credits_cost` from the response headers. The published OpenAPI document labels this body `application/json`; the body is HTML.'
  scrape.markdown: 'Converts the whole page with html2text: `script` and `noscript` are dropped and everything else, including navigation, footers, cookie banners and ads, stays in. To drop parts of a page, remove them with a base64 `js_snippet` before conversion.'
  scrape.extended: 'The only operation that returns the target status code as a JSON field (`status_code`), along with `cookies`, `headers`, `xhrs` and `iframes`. `xhrs` and `iframes` need the browser.'
  extract.data: '`extract_properties` is a free-form description of the data, not a schema: append `(number)`, `(list: ...)` and so on to steer the JSON types. The cost is the scrape cost plus 1 credit per 30 characters of page and output text.'
  account.usage: 'Returns `plan_name`, the period start and end, `plan_total_credits` and `remained_credits`. The dates arrive without a time zone, so they are strings rather than parsed dates.'
