displayName: Linkup
description: Web search for AI agents with Linkup - search results with page text, sourced answers, structured JSON, page fetch, and async research tasks.
domain: linkup.so
recommendedAuth: api_key
overviewNote: |
  Create an API key under API keys in the Linkup app; it is sent as a Bearer token. New accounts get $20 of credit each month. Every call except `credits.get`, `research.get/list` and `tasks.get/list` is billed per call: searches $0.005 to $0.055 by depth, page fetches $0.001 to $0.011, research $0.25 to $2.50 by `reasoningDepth`.
  `search.run`, `answers.get`, `search.structured` and `pages.fetch` are metered lookups (read). `responses.create`, `research.create` and `tasks.create` are paid generation jobs and are destructive.
  `depth`: flash, fast (default here) and standard cost the same; deep runs several searches and costs 10x. `fromDate`/`toDate` take YYYY-MM-DD and the domain filters take bare domains such as example.com.
  Research and batch tasks run in the background: create them, then poll `research.get` or `tasks.get` until `status` is `completed` (or `failed`); `output` holds the answer, results or data.
  Only the credit balance, source URLs with name, type and date, and response ids are stored. Page text, generated text and queries are not stored or put in events.
references:
  - title: Linkup API docs
    url: https://docs.linkup.so/
examples:
  read:
    path: search.run
    title: Search recent news on a domain
    args:
      q: Corsair integrations for AI agents
      includeDomains:
        - corsair.dev
  write:
    path: research.create
    title: Start a short research task
    args:
      q: When did the Oslo Opera House open, and who designed it?
apiNotes:
  credits.get: |
    `GET /v1/credits/balance`. Stores the balance.
  search.run: |
    `POST /v1/search` with outputType searchResults. Stores name, url, type, and date of each result.
  search.structured: |
    `POST /v1/search` with outputType structured. The schema is sent as a JSON string.
  answers.get: |
    `POST /v1/search` with outputType sourcedAnswer. Source text is not stored.
  pages.fetch: |
    `POST /v1/fetch`. Returns markdown and does not store the page.
  responses.create: |
    `POST /v1/responses` (OpenAI Responses format). Stores id, model, and object.
  research.create: |
    `POST /v1/research`. Returns the task; poll research.get.
  research.get: |
    `GET /v1/research/{id}`.
  research.list: |
    `GET /v1/research`, paged.
  tasks.create: |
    `POST /v1/tasks` with an array of up to 100 search, fetch or research inputs.
  tasks.get: |
    `GET /v1/tasks/{id}`.
  tasks.list: |
    `GET /v1/tasks`, filtered by type and status, paged.
apiExamples:
  credits.get:
    call: "{}"
  search.run:
    call: "{ q: 'Corsair integrations for AI agents', depth: 'fast', maxResults: 5, fromDate: '2026-01-01' }"
  search.structured:
    call: "{ q: 'Population of Oslo', schema: { type: 'object', properties: { city: { type: 'string' }, population: { type: 'number' } } }, includeSources: true }"
  answers.get:
    call: "{ q: 'What is the capital of Norway?' }"
  pages.fetch:
    call: "{ url: 'https://example.com' }"
  responses.create:
    call: "{ input: 'What changed in the latest Node.js release?', model: 'linkup-standard' }"
  research.create:
    call: "{ q: 'When did the Oslo Opera House open?', reasoningDepth: 'S' }"
  research.get:
    call: "{ id: '4b26323e-c449-45ec-bf92-cd969ae98f7b' }"
  research.list:
    call: "{ pageSize: 10, sortBy: 'createdAt', sortDirection: 'desc' }"
  tasks.create:
    call: "{ tasks: [{ type: 'fetch', input: { url: 'https://example.com' } }, { type: 'search', input: { q: 'Oslo weather', depth: 'fast', outputType: 'searchResults' } }] }"
  tasks.get:
    call: "{ id: '74eb77e1-4eb7-4429-843b-86d61b504791' }"
  tasks.list:
    call: "{ type: ['research'], status: ['completed'] }"
