displayName: Heyy
description: Customer messaging over WhatsApp, SMS and Instagram from Heyy - search and create contacts, define custom attributes and labels, and manage the webhook endpoints that deliver message events.
domain: heyy.io
recommendedAuth: api_key
overviewNote: |
  Create a key in the Heyy app under Settings, API keys, then send it as a bearer token. This plugin targets API v3 at `https://api.heyy.io/v3`.

  Things that shape the calls:

  - **Search replaces the old list calls.** v2's `GET` lists became `POST .../search` with a body in v3, and v2 was sunset on 1 November 2026. Every read here is a search.
  - **`query` is a filter expression, not keywords.** Use `equals(status, 'active')`, `contains(name, 'Acme')`, `and(...)`, `or(...)`, `not(...)`. For free-text matching use the separate `search` field. The two filter differently, so passing both is rejected before the request.
  - **Sorting uses function syntax.** `sortBy` is `desc(createdAt)` or `asc(name)`, optionally with `'nulls last'`.
  - **Paging is zero-based.** `pagination.page` starts at 0, `limit` is 1 to 100, and the default is 10. Replies carry `pagination.total` so a caller knows how many rows matched.
  - **Deletes report partial success.** A delete answers 200 with `deletedIds` and `notFoundIds`; an id that did not exist is not an error, so check `notFoundIds` rather than treating the call as failed.
  - **Select attributes need options.** A `single_select` or `multi_select` attribute without options is rejected, and options on a text attribute are rejected too.
  - **Webhook URLs must be https.** Heyy only delivers to `https://`, so a plain http URL is refused before the request.
  - **Rate limits are per minute per tenant**: 100 on Hobby, 500 on Pro, 1,000 on Ultra. A 429 carries `X-RateLimit-Reset`, which this plugin turns into a delay, and retries are capped at three.
examples:
  read:
    path: contacts.search
    title: Find a contact by email
    args:
      query: "equals(email, 'jordan@acme.com')"
  write:
    path: labels.create
    title: Create a label
    args:
      name: Priority
      color: '#EF4444'
apiExamples:
  contacts.search:
    call: "{ query: \"contains(fullName, 'Jordan')\", pagination: { page: 0, limit: 25 } }"
  contacts.create:
    call: "{ firstName: 'Jordan', lastName: 'Reyes', email: 'jordan@acme.com' }"
  attributes.search: {}
  attributes.create:
    call: "{ type: 'single_select', displayName: 'Plan', visibility: { inbox: true, contacts: true, create: true }, details: { options: [{ value: 'pro', color: '#3B82F6' }] } }"
  attributes.remove:
    call: "{ attributeId: 'b1a2c3d4-0000-4000-8000-000000000000' }"
  labels.search: {}
  labels.create:
    call: "{ name: 'Priority', color: '#EF4444' }"
  labels.remove:
    call: "{ labelId: 'b1a2c3d4-0000-4000-8000-000000000000' }"
  apiWebhooks.create:
    call: "{ url: 'https://example.com/heyy/events', events: [{ type: 'message.received', scopes: [{ type: 'channel', ids: ['b1a2c3d4-0000-4000-8000-000000000000'] }] }] }"
  apiWebhooks.search: {}
  apiWebhooks.update:
    call: "{ webhookId: 'b1a2c3d4-0000-4000-8000-000000000000', status: 'inactive' }"
  apiWebhooks.remove:
    call: "{ webhookId: 'b1a2c3d4-0000-4000-8000-000000000000' }"
  channels.search: {}
  automations.search: {}
  messageTemplates.search: {}
apiNotes:
  contacts.search: '`query` is a structured expression such as `equals(email, ''a@b.com'')`; `search` is free text. Pass one of them, not both.'
  attributes.create: 'A single_select or multi_select attribute needs `details.options`; any other type must omit it.'
  apiWebhooks.create: 'The URL must be https. Events are `message.received`, `message.sent`, `message.updated`, `whatsapp_message_received` or `whatsapp_message_status`, each scoped to at least one channel id from `channels.search`. Heyy then POSTs every matching message, with its content and sender, to that URL.'
