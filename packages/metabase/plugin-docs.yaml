displayName: Metabase
description: Work with Metabase's documented REST API for collections, queries, permissions, people, embedding, and administration.
domain: metabase.com
recommendedAuth: api_key
factory:
  note: >-
    Each account stores its Metabase instance origin as `base_url` (for example https://example.metabaseapp.com) next to
    its API key; `metabase({ baseUrl })` overrides it for a single-instance setup. Use HTTPS, or HTTP only for localhost
    development. Metabase grants each API key the permissions of its assigned group.
overviewNote: >-
  Metabase's REST API is unversioned. The current latest documentation is for Metabase 65, but available routes depend
  on the installed instance. This plugin implements JSON-schema-backed OpenAPI routes compatible with Corsair;
  the custom-viz Server-Sent Events proxy and inbound Slack event receiver are excluded. API keys use the documented X-API-Key
  header and inherit permissions from their assigned group. The instance comes from the account's stored `base_url` or
  metabase({ baseUrl }); agent inputs cannot change the host. Cookies are omitted and redirects are not followed.
  Operations under `ee.` call Pro/Enterprise routes, which an open-source instance answers with 404. Metabase's
  MCP Apps routes (`/api/embed-mcp/*`) are left out: they need an MCP session header that only Metabase's embed sets.
apiNotes:
  "collections.delete": "DELETE /api/collection/{id} permanently removes a collection; the operation is marked destructive."
  "collectionPermissions.graph.update": "The permission-graph update can overwrite supplied entries. force=true persists the supplied graph without a revision check and can overwrite concurrent updates; the operation is marked destructive."
  "collections.items.list": "Collection item rows are heterogeneous and the OpenAPI schema intentionally leaves their item fields open. The plugin preserves JSON-compatible fields instead of claiming a fixed model."
  "collections.root.items.list": "Root item rows are heterogeneous and the OpenAPI schema intentionally leaves their item fields open. The plugin preserves JSON-compatible fields instead of claiming a fixed model."
  "metabot.postFeedback": "The OpenAPI models a JSON response wrapper with status 204, but HTTP 204 responses have no body. The adapter returns and validates null for the successful empty response."
  "metabot.postSourceFeedback": "The OpenAPI models a JSON response wrapper with status 204, but HTTP 204 responses have no body. The adapter returns and validates null for the successful empty response."
  "apiKey.putByIdRegenerate": "The OpenAPI pattern `^mb_.*{4}\\*+$` is invalid ECMAScript. Metabase's schema description says masked values start with `mb_` and end in asterisks; the plugin validates that documented shape."
  "dashboard.postByIdPdf": "The route description specifies a PDF download while the OpenAPI success media/schema is JSON with an unconstrained body. The adapter returns a bounded binary artifact and preserves documented response headers."
  "dataset.postByExportFormat": "The route description specifies a file download while the OpenAPI success schema references a JSON query result. The adapter follows the explicit file-download description and returns a bounded binary artifact."
  "ee.postAuditAppAnalyticsDevExport": "The route description specifies a tar.gz file while the OpenAPI response schema describes a JSON body envelope. The adapter follows the explicit tarball description and returns a bounded binary artifact."
  "ee.getAppsSandboxHost": "The HTML sandbox document is returned as a bounded binary artifact; the Content-Security-Policy header is preserved and the HTML is never executed by the plugin."
  "ee.getAppsBySlugBundle": "The JavaScript bundle is returned as a bounded binary artifact with the response content type and selected cache headers preserved."
  "ee.getCustomVizPluginSandboxHost": "The HTML sandbox document is returned as a bounded binary artifact; the Content-Security-Policy header is preserved and the HTML is never executed by the plugin."
  "ee.getCustomVizPluginByIdAsset": "The manifest icon is returned as a bounded binary artifact with its content type preserved."
  "ee.getCustomVizPluginByIdBundle": "The JavaScript bundle is returned as a bounded binary artifact with the response content type and selected cache headers preserved."
  "ee.getSessionManagement": "The official route description documents optional `status=ended` and `status=all` filters; omitting it lists live sessions."
  "ee.postCustomVizPlugin": "Metabase multipart file input maps to a Corsair Blob-backed file. The default local upload cap is 20 MiB (configurable to 100 MiB); this is a plugin safety cap, not a provider limit."
  "ee.putCustomVizPluginByIdBundle": "Replaces a custom-visualization tar.gz bundle using a multipart file part; the output is the documented plugin record."
  "evalTrace.getBySessionId": "The JSONL response is returned as a bounded binary artifact rather than passed through JSON decoding."
  "exploration.getQueryById": "`format=api` and `format=json` return the declared JSON response; `format=csv` and `format=xlsx` return bounded binary artifacts."
  "session.getIllustrationByKey": "The uploaded illustration is returned as a bounded binary artifact with its content type preserved."
