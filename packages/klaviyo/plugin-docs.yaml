displayName: Klaviyo
description: Email and SMS marketing from Klaviyo - manage profiles, marketing lists, segments, events and metrics, and configure the webhooks that deliver them.
domain: klaviyo.com
recommendedAuth: api_key
overviewNote: |
  Create a private API key in Klaviyo under Settings, API keys, and copy it. It goes in the `Authorization` header as `Klaviyo-API-Key <key>`, which is not a bearer token. Klaviyo scopes a private key at creation and will not widen it later, so give it the read and write scopes you need up front.

  Things that shape the calls:

  - **Every request carries a `revision` header.** Klaviyo versions the API by date and this plugin sends the revision it was built against.
  - **Bodies are JSON:API.** A write is `{ data: { type, attributes } }`. This plugin takes flat fields and builds that envelope; reads answer `data` plus `links`.
  - **Filters are expressions.** `filter` is a string such as `equals(email,"a@b.com")`, combined with `and()` and `or()`. Field names and operators differ per resource.
  - **Paging is cursor-based.** Pass the `nextCursor` from one response as `cursor` to read the next page. Klaviyo returns the cursor inside `links.next` as a full URL, and this plugin parses it out for you. The largest `pageSize` differs per route: 10 for lists and segments, 25 for tag groups, 50 for tags, 100 for profiles and 1000 for events. Metrics and webhooks take no page size.
  - **Subscription is a job.** `profiles.subscribe` grants marketing consent, so Klaviyo queues it and answers 202 with no body. The result confirms the request was accepted, not that the profile is subscribed yet.
  - **Events are recorded by metric name**, and Klaviyo creates the metric on first use. The event then counts towards any flow listening for it.
  - **Segments evaluate server-side.** A new segment is not populated immediately, and its `definition` is a condition group rather than a filter string.
  - **Webhooks need a secret, and Corsair does not receive the deliveries.** Klaviyo signs every delivery with the `secretKey` you set at creation. This plugin manages the webhook registrations; you host the endpoint that receives them and verify the signature there.
  - **Rate limits** run a burst and a steady window per account, and a 429 carries `Retry-After`.
examples:
  read:
    path: profiles.list
    title: Find a profile by email
    args:
      filter: 'equals(email,"jordan@acme.com")'
  write:
    path: tags.create
    title: Create a tag
    args:
      name: priority
apiExamples:
  events.create:
    call: "{ metric: 'Placed Order', email: 'jordan@acme.com', properties: { Total: 129.5 } }"
  events.get:
    call: "{ id: 'Ev123' }"
  events.list:
    call: "{ pageSize: 20 }"
  lists.addProfiles:
    call: "{ id: 'R7QkZp', profileIds: ['01H8XYZABC123'] }"
  lists.create:
    call: "{ name: 'Newsletter' }"
  lists.get:
    call: "{ id: 'R7QkZp' }"
  lists.list:
    call: "{ pageSize: 10 }"
  lists.profiles:
    call: "{ id: 'R7QkZp', pageSize: 20 }"
  lists.remove:
    call: "{ id: 'R7QkZp' }"
  lists.removeProfiles:
    call: "{ id: 'R7QkZp', profileIds: ['01H8XYZABC123'] }"
  lists.update:
    call: "{ id: 'R7QkZp', name: 'Newsletter 2027' }"
  metrics.aggregate:
    call: "{ metricId: 'Mt123', measurements: ['count'], interval: 'day', filter: ['greater-or-equal(datetime,2026-01-01T00:00:00)', 'less-than(datetime,2026-02-01T00:00:00)'] }"
  metrics.get:
    call: "{ id: 'Mt123' }"
  metrics.list:
    call: "{}"
  profiles.create:
    call: "{ email: 'jordan@acme.com', first_name: 'Jordan', last_name: 'Reyes' }"
  profiles.get:
    call: "{ id: '01H8XYZABC123' }"
  profiles.list:
    call: "{ pageSize: 20, filter: 'equals(email,\"jordan@acme.com\")' }"
  profiles.subscribe:
    call: "{ listId: 'R7QkZp', email: 'jordan@acme.com', channels: ['email'] }"
  profiles.update:
    call: "{ id: '01H8XYZABC123', first_name: 'Jordan' }"
  segments.create:
    call: "{ name: 'Engaged 30 days', definition: { condition_groups: [] } }"
  segments.get:
    call: "{ id: 'SgXy12' }"
  segments.list:
    call: "{ pageSize: 10 }"
  segments.profiles:
    call: "{ id: 'SgXy12', pageSize: 20 }"
  segments.remove:
    call: "{ id: 'SgXy12' }"
  segments.update:
    call: "{ id: 'SgXy12', name: 'Engaged 60 days' }"
  tagGroups.create:
    call: "{ name: 'Campaign type' }"
  tagGroups.list:
    call: "{}"
  tagGroups.remove:
    call: "{ id: 'TgG123' }"
  tags.create:
    call: "{ name: 'priority' }"
  tags.get:
    call: "{ id: 'Tg123' }"
  tags.list:
    call: "{ pageSize: 20 }"
  tags.remove:
    call: "{ id: 'Tg123' }"
  tags.update:
    call: "{ id: 'Tg123', name: 'urgent' }"
  webhookTopics.list:
    call: "{}"
  webhooks.create:
    call: "{ name: 'Order events', endpointUrl: 'https://example.com/klaviyo/events', secretKey: 'a-long-shared-secret', topicIds: ['Placed Order'] }"
  webhooks.get:
    call: "{ id: 'Wh123' }"
  webhooks.list:
    call: "{}"
  webhooks.remove:
    call: "{ id: 'Wh123' }"
  webhooks.update:
    call: "{ id: 'Wh123', enabled: false }"
apiNotes:
  profiles.subscribe: 'This grants marketing consent, so Klaviyo queues a bulk job and answers 202 with no body. The consent is not immediate, and there is no job id to poll.'
  tags.update: 'Klaviyo answers 204 with no body, so this returns `{ success: true }` rather than the renamed tag.'
  events.create: '`metric` is a name, not an id: Klaviyo creates the metric if it is new. `properties` is required by the spec, and the profile must be given by id or email.'
  metrics.aggregate: '`filter` must carry a date range, and Klaviyo rejects the call without one. `dates` in the response are the bucket start times, and each row of `data` holds its measurement arrays in the same order.'
  segments.create: '`definition` is a JSON:API condition group, not the filter string the list routes take. Klaviyo evaluates it asynchronously.'
  webhooks.create: 'The spec marks a secret key and at least one topic required. Klaviyo signs each delivery with `secretKey`, so keep it and verify on your side.'
