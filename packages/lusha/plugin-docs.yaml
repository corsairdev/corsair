displayName: Lusha
description: B2B contact and company data with Lusha - search, enrich and prospect contacts and companies, find lookalikes, recommendations and buying groups, read signals, signal and ICP fit scores and website visits, manage contact and company tables and signal webhooks, search call conversations and read account credit usage.
domain: lusha.com
recommendedAuth: api_key
overviewNote: |
  Create an API key at https://dashboard.lusha.com/api/manage-api-keys (sign up at https://auth.lusha.com/signup first). The plugin sends it in Lusha's `api_key` header; a different spelling is rejected.

  The plugin covers Lusha's whole public V3 API (68 operations): search, enrich and search-and-enrich, prospecting with filters, lookalikes, recommendations, buying groups, contact and company signals, signal scores, ICP fit scores, website visits, contact and company tables, webhook subscriptions and their audit logs, call conversations, and account usage. The two operations that return the account's webhook signing secret are left out: set the secret in Lusha and store it in Corsair as the webhook signature.

  Things to know before you call:

  - **Most reads cost credits.** Searches, enrichment, prospecting, lookalikes, recommendations, buying groups, signals, scores, website visits, table exports and conversation exports charge credits from your account pool per result, per revealed field or per row; each operation's description says how. They only spend credits, so they are marked `read`, like the free reads. Operations that start a paid job or charge as they add data (`contactTables.runColumn`, `companyTables.runColumn`, `companyTables.addEntities`, `subscriptions.create`) and operations that can't be undone (deletes and removes) are marked `destructive`, so Corsair asks before running them. Filter lists, signal types, table setup, subscription reads, audit logs, `account.getAccountUsage` and the job poll are free. When the account runs out, Lusha answers HTTP 402 `Insufficient credits for this operation`; the plugin does not retry it. Lusha's free plan includes a small monthly credit allowance; useful volume needs a paid plan.
  - **Search first, enrich second.** `person.searchContacts` and `company.searchCompanies` match records by email, LinkedIn URL, name plus company, or domain, and return previews that say which data points exist (`has`) and what revealing them costs (`canReveal`). `person.enrichContacts` and `company.enrichCompanies` take ids from those previews and return the full records with emails or phones (contacts) and premium firmographics (companies).
  - **Enrichment can continue in the background.** A contact enrich call may answer with `status: 'partial'` and a `job`; poll `jobs.getContactsEnrichJob` with that job id until it reports `complete` (its `contacts` merge into the ones you already have, by `id`), `expired` or `failed`. The poll is free.
  - **Rate limits are per account.** The default window is 25 requests per second, `account.getAccountUsage` is capped at 5 requests per minute and the webhook API at 100 per minute. A 429 is retried three times with backoff; Lusha sends no `Retry-After` header. A 5xx or dropped connection is retried only on free reads, because a charged call may already have run.
  - **Ids are Lusha's own strings** (for example `4389064654`), returned as `id` on every search result.
  - **Webhooks.** `subscriptions.create` subscribes contacts or companies to signals (each delivered signal is charged); `subscriptions.createOptOut` sends contact opt-outs. Point them at your Corsair webhook URL. Deliveries arrive as `signals.received` and `optOuts.received`, are checked against `X-Lusha-Signature` (HMAC-SHA256 of `timestamp.body` with the account webhook secret) and answered with the `{ received, timestamp, webhookId }` acknowledgement Lusha requires. An opt-out lists the emails and phone numbers you must remove from your own systems.
examples:
  read:
    path: account.getAccountUsage
    title: Read remaining credits and plan limits
    args: {}
apiExamples:
  person.searchContacts:
    call: "{ contacts: [{ email: 'someone@lusha.com' }, { firstName: 'Orit', lastName: 'Shilvock', companyName: 'Lusha' }] }"
  person.enrichContacts:
    call: "{ ids: ['4389064654'], reveal: ['emails', 'phones'] }"
  person.searchAndEnrichContacts:
    call: "{ contacts: [{ linkedinUrl: 'https://www.linkedin.com/in/someone' }], reveal: ['emails'] }"
  company.searchCompanies:
    call: "{ companies: [{ domain: 'lusha.com' }] }"
  company.enrichCompanies:
    call: "{ ids: ['16303253'], reveal: ['employeesByDepartment', 'competitors'] }"
  company.searchAndEnrichCompanies:
    call: "{ companies: [{ domain: 'lusha.com' }], reveal: ['directParent', 'ultimateParent'] }"
  account.getAccountUsage: {}
  jobs.getContactsEnrichJob:
    call: "{ jobId: 'wf_3f2b9c1e-4a7d-4f3b-9c2e-1d6a5b8c7e90' }"
  person.prospectContacts:
    call: "{ pagination: { page: 0, size: 25 }, filters: { contacts: { include: { departments: ['Sales'], locations: [{ country: 'United States' }] } } } }"
  person.getContactFilterValues:
    call: "{ filterType: 'departments' }"
  contactTables.list:
    call: "{ owner: { email: 'user@example.com' }, page: 0, size: 10, status: 'active' }"
  subscriptions.list:
    call: "{ limit: 10, offset: 0 }"
apiNotes:
  person.searchContacts: |
    Takes `contacts` (1 to 100 entries, each with exactly one identifier: `id`, `linkedinUrl`, `email`, or `firstName` plus `lastName` with `companyName` or `companyDomain`) and optional `options.includePartialProfiles` and contact `signals`. Returns previews with `has`, `canReveal` (each with its credit cost) and `signalTypes`, plus `billing` with the credits charged. Metered: charged per matched result.
  person.enrichContacts: |
    Takes `ids` (1 to 100 from search results), optional `reveal` (`emails`, `phones`), `waterfallEnabled` and `tableId`. Returns enriched contacts with `emails` and `phones` arrays, plus `billing`. May answer `status: 'partial'` with a `job`: poll `jobs.getContactsEnrichJob` until it reports `complete`, `expired` or `failed`, and merge its `contacts` into the results by `id`. Charged per revealed data point; a data point is billed once, so re-enriching data already revealed for the account is free.
  person.searchAndEnrichContacts: |
    Combines both steps: `contacts` search entries plus `reveal`. Returns full contacts in one call. Metered.
  company.searchCompanies: |
    Takes `companies` (1 to 100 entries, each with `id`, `name` or `domain`) and optional company `signals`. Returns firmographic previews plus `billing`. Metered per result.
  company.enrichCompanies: |
    Takes `ids` and optional `reveal` tokens (employeesByDepartment, employeesByLocation, employeesBySeniority, competitors, estimatedAnnualItSpend, monthlyWebsiteTraffic, openJobsTotal, openJobsByDepartment, openJobsByLocation, openJobsBySeniority, directParent, ultimateParent). Omitting `reveal` returns base firmographics only. Each reveal field is charged separately per result.
  company.searchAndEnrichCompanies: |
    Combines both steps: `companies` search entries plus `reveal` tokens. Metered per result and per reveal field.
  account.getAccountUsage: |
    Free. Returns `credits` (`total`, `used`, `remaining`), `rateLimits` for the daily, hourly and minute windows (a window may be null), `plan` and a `pricing` map of action name to `{ credits, perQuantity }`. Lusha caps this endpoint at 5 requests per minute.
  jobs.getContactsEnrichJob: |
    Free. Takes the `jobId` from a partial enrich response. `processing` carries `retryAfter` (seconds) and `covers`; `complete` carries `contacts` and `creditsCharged`; `expired` and `failed` (with `reason`) are terminal and keep what enrich already returned.
