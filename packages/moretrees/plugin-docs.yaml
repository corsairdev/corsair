displayName: More Trees
description: Climate action with More Trees - read the account credit balance, forest stats and planting projects, and plant trees for yourself or as gifts.
domain: moretrees.eco
recommendedAuth: api_key
overviewNote: |
  Create an API key in More Trees under Settings > Account Settings. The
  account code lives on the same page; the plugin stores it as an account
  field and needs it for `account.get` and `trees.plant`.

  - **Planting spends credits.** `trees.plant` defaults to `test: false`,
    which plants real trees and uses the payment account's credits. Pass
    `test: true` for a dry run that only evaluates the request. A planting
    that may have reached More Trees is never replayed after a failure.
  - **One key, three services.** More Trees routes each operation to a
    different service host (`user-management`, `project-management`,
    `transaction-management`), all authenticated with the same `X-API-KEY`
    header. The plugin picks the host per operation.
  - **Projects auth is ambiguous.** The projects section of More Trees' API
    guide mentions a separate "public validation key" (Integration > API)
    without naming its header. The plugin sends the standard `X-API-KEY`
    everywhere; if `projects.list` answers 401 or 406, check that section.
  - **Forest lookup.** `forest.get` accepts either the forest slug or the
    account code.
  - **Rate limits.** More Trees documents 429 without a window. The plugin
    retries a 429 up to three times with exponential backoff and honours a
    `Retry-After` header when one is sent. Reads also retry a 5xx or a
    transport failure; writes never do.
examples:
  read:
    path: projects.list
    title: List planting projects
    args: {}
  write:
    path: trees.plant
    title: Dry-run a planting
    args:
      payment_account_code: A1AB2B
      test: true
      plant_for_others: false
      quantity: 2
apiExamples:
  account.get:
    call: "{ accountCode: 'AC1C2C' }"
  forest.get:
    call: "{ forestSlugOrAccountCode: 'beachy' }"
  projects.list: {}
  trees.plant:
    call: "{ payment_account_code: 'AC1C2C', test: true, plant_for_others: false, quantity: 2 }"
apiNotes:
  projects.list: |
    `GET /projects` on the project-management service. The guide's projects
    section mentions a "public validation key" without naming a header; the
    plugin authenticates with the standard `X-API-KEY`.
  trees.plant: |
    `POST /plant` on the transaction-management service. With
    `plant_for_others: true`, send `recipients` (each needs an
    `account_code` or an `email`, plus `name` and `quantity`) and omit
    `quantity`; with `plant_for_others: false`, send `quantity` and omit
    `recipients`. `project_id` and `tree_id` default to More Trees' default
    project and tree when omitted.
