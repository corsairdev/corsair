# Display copy for the docs, the catalog, corsair.dev and Hub.
displayName: Higgsfield
description: Generative media API with image and video models from Higgsfield, Kling, Seedance, Wan, MiniMax and others; find models, price and run generations, follow or cancel requests, upload input files and read usage.
domain: higgsfield.ai
overviewNote: |
  The key is one string, `<key id>:<key secret>`, from the API keys page of the [Higgsfield Console](https://console.higgsfield.ai).

  Every model takes its own input fields. Find a model with `models.list({ search: 'kling' })`, read its fields with `models.get({ modelPath })`, and price the exact call with `generations.estimate` before spending anything. `input_schema` drives the Console's playground, so its defaults can differ from what the API applies when a field is left out; pass the fields you care about. `models.list` and `models.get` read an API route Higgsfield's docs don't cover yet, and the model pages at [docs.higgsfield.ai](https://docs.higgsfield.ai/docs/models) stay the reference for each model's behaviour.

  Generations run in the background and often outlast the wait: when measured, a soul/v2 image took about 18 seconds and a two-second video about seven minutes. After submitting, `generations.run` waits up to 10 seconds (at most 15) and answers with the same fields as `requests.status`. `completed`, `failed`, `nsfw` and `canceled` are final; `queued` or `in_progress` is a request to follow with `requests.status({ requestId })` or a `webhookUrl`, and `queued` also covers a read that failed, so the request may have moved on. On Corsair's cloud, `get_job` and the job card do the following for you. `failed` and `nsfw` requests are not charged.

  Every submit carries an `Idempotency-Key`, and repeating a request with the same key returns the original with no second charge. Pass your own as `idempotencyKey`, or the plugin generates one for that call and its retries. Either way it comes back as `idempotency_key`, and a failed submit carries it on the error. A generated key only covers retries inside one call: a caller that replays a step or starts a new script gets a new key each time, so it must pass its own to be safe across attempts. Pass a new key, or none, when you do want another generation.

  Output URLs stop working at `expires_at`, 7 days after the request finished unless you set `expiresAfter`. Copy anything you want to keep.
examples:
  read:
    path: models.get
    title: Read a model's input fields
    args:
      modelPath: higgsfield-ai/soul/v2/standard
  write:
    path: generations.run
    title: Generate an image
    args:
      modelPath: higgsfield-ai/soul/v2/standard
      input:
        prompt: A quiet alpine lake at sunrise, editorial photography
exampleWebhook:
  path: requests.completed
  note: "Pass `webhookUrl` to `generations.submit` and Higgsfield POSTs the result there when the request reaches completed, failed or nsfw. Only signed deliveries are accepted. Higgsfield signs for an account only once its secret has been revealed under Settings in the Higgsfield Console, and sends unsigned deliveries until then, so reveal it and store it with `keys.set_webhook_signature` (or `higgsfield({ webhookSecret })`) before relying on webhooks. Hand `processWebhook` the raw body text (`await request.text()`): a parsed body cannot verify. A delivery that fails verification makes `processWebhook` report a failure, so an HTTP handler that answers 5xx gets it retried for up to two hours. Higgsfield treats a 4xx as final and doesn't retry it. Duplicates are possible, so deduplicate by `webhook_id`. Nothing in a delivery names the account, so a multi-tenant app passes `?tenantId=` on the webhookUrl and its HTTP handler passes `Object.fromEntries(new URL(request.url).searchParams)` to `processWebhook` as the fourth argument. The signature covers the body but not the URL, so `?tenantId=` only picks which tenant's secret checks a delivery. When tenants share a secret, because they use one Higgsfield account or the `webhookSecret` option, anyone holding a signed delivery under 5 minutes old can resend it with another `tenantId`, and that tenant's hooks run on it. Higgsfield signs with one secret per account, so tenants on one account must all store that account's secret. Give each tenant its own Higgsfield account, or check in an `after` hook that the `request_id` is one that tenant submitted before acting on it. By then the plugin has logged the event under that tenant. A `before` hook runs ahead of the signature check, so it can receive an unsigned or forged delivery. Keep side effects in `after`."
  after: "if (result.data?.status === 'completed') console.log(result.data.request_id, result.data.payload);"
apiNotes:
  generations.submit: Spends account balance when the request completes. `status` here is an acceptance receipt, and a repeat with the same key can say `queued` for a request that has since finished, so read `requests.status` for where it stands. Reusing a key with a different `modelPath`, `input`, `webhookUrl` or `expiresAfter` is a 422. A workflow step that can replay, or a script that can start again, must pass its own `idempotencyKey`, because a generated key only covers retries inside one call.
  generations.run: Spends account balance when the request completes. The wait counts from the start of the submit. Once Higgsfield has accepted the request, this never throws. A status read that fails or runs late answers the request as it last stood. As with `generations.submit`, a caller that replays a step or starts a new script must pass its own `idempotencyKey` to be safe across attempts.
  generations.estimate: Free. Takes the same `input` as a generation, so the price reflects the duration, resolution and batch size you ask for.
  requests.status: A request ended by moderation says `nsfw`, not `failed`. Some video and 3D operations add artifacts such as `zip`, `mov`, `jsx`, `fbx` or `ply`, which come through as extra fields.
  requests.cancel: Only works while the request is queued, and a canceled request is refunded. Once it has started, or after it has finished, Higgsfield answers 400 and this throws.
  requests.delete: Deletes the request's files, prompt and parameters for good, and billing records stay. A request still queued or running gets a 409. Deleting one that is already gone still answers `deleted`.
  files.createUploadUrl: The upload URL is good for one hour. PUT the file there with every `upload_headers` entry and no Higgsfield credentials.
  files.upload: Up to 100 MB, as base64. A file already at a public https URL needs no upload, since model inputs take public URLs. Uploaded files are deleted within seven days.
  models.list: Reads `GET /models`, which answers with the API key but isn't in Higgsfield's docs. `search` is free text. A model on Higgsfield's docs site can still answer even if it isn't listed, and the other way round.
  models.get: Fetches the whole list with schemas, since the route has no single-model form.
  usage.get: Estimated cost of completed generations, grouped by time bucket and model. Data can lag and may not include every request, so it is not a billing record. The range is at most 31 days.
apiExamples:
  generations.submit:
    call: "{ modelPath: 'kling-video/v2.5-turbo/pro/text-to-video', input: { prompt: 'A red kite over a beach at sunset', duration: 5 }, webhookUrl: 'https://example.com/webhooks/higgsfield' }"
  generations.run:
    call: "{ modelPath: 'higgsfield-ai/soul/v2/standard', input: { prompt: 'A paper boat on a calm pond' }, waitSeconds: 15 }"
  generations.estimate:
    call: "{ modelPath: 'higgsfield-ai/soul/v2/standard', input: { prompt: 'A paper boat on a calm pond' } }"
  requests.status:
    call: "{ requestId: '<request id>' }"
  requests.cancel:
    call: "{ requestId: '<request id>' }"
  requests.delete:
    call: "{ requestId: '<request id>' }"
  files.createUploadUrl:
    call: "{ contentType: 'image/png' }"
  files.upload:
    call: "{ contentBase64: '<base64 bytes>', contentType: 'image/png' }"
  models.list:
    call: "{ search: 'kling', outputType: 'video' }"
  models.get:
    call: "{ modelPath: 'higgsfield-ai/soul/v2/standard' }"
  usage.get:
    call: "{ start: '2026-11-01T00:00:00Z', end: '2026-11-08T00:00:00Z', timeframe: 'day' }"
