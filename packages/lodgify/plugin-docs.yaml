displayName: Lodgify
description: Manage vacation rental properties, rooms, rates, availability, bookings, enquiries, guest details, and messages through Lodgify's documented REST API.
domain: lodgify.com
overviewNote: >-
  Lodgify API endpoints require an account API key passed in the `X-ApiKey`
  header. API access is available on Lodgify Pro and Enterprise tiers. If a key
  is missing, Corsair throws `AuthMissingError` with a connect link for the
  caller to display. Guest records are embedded in booking and enquiry
  operations; Lodgify does not document a standalone guest collection. Webhook
  payloads are documented, but webhook support is outside this PR's requested
  scope.
examples:
  read:
    path: properties.list
    title: List properties
    args:
      page: 1
      size: 10
  write:
    path: reservations.create
    title: Create a booking
    args:
      property_id: 101
      arrival: '2026-06-01T00:00:00Z'
      departure: '2026-06-07T00:00:00Z'
      rooms:
        - room_type_id: 201
          guest_breakdown:
            adults: 2
      guest:
        guest_name:
          first_name: Jane
          last_name: Doe
        email: jane@example.com
