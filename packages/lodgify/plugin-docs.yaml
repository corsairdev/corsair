apiNotes:
  properties.list: >-
    Returns a page of properties using Lodgify v2 pagination parameters. Optional
    `wid`, `updatedSince`, `includeCount`, and `includeInOut` parameters are forwarded.
  properties.get: >-
    Returns property details. Optional `wid` and `includeInOut` parameters are
    forwarded to Lodgify.
  properties.getRooms: >-
    Returns room-type details for the property. Optional website-localized `wid`
    is forwarded to Lodgify.
  properties.listV1: >-
    Returns the legacy v1 completed-property list. The API does not document
    pagination for this operation.
  properties.getV1: >-
    Returns the legacy v1 property model. `maxDate` and `wid` are optional query
    parameters.
  properties.getRoomV1: >-
    Returns one legacy room record. The room path parameter is named `rid` in
    the v1 contract; optional `wid` is forwarded. The amenities value schema is
    absent from OpenAPI and is therefore preserved as an opaque map.
  channels.inventory: >-
    The route is named `/v1/channel/xml`, and Lodgify's OpenAPI defines a
    ChannelIndexDto JSON representation as well as XML. The client requests JSON.
  properties.getDeleted: >-
    Returns integer property IDs deleted since the optional `deletedSince` date.
  properties.getAddons: >-
    Returns available add-ons for the property. Optional stay dates and room type
    narrow the add-ons returned.
  properties.getPayments: >-
    Returns the payment settings available to bookings for the specified property.
  reservations.list: >-
    V2 booking pagination uses `page` and `size`; supported filters include
    `stayFilter`, `stayFilterDate`, `updatedSince`, `trash`, and response detail
    flags. Lodgify's OpenAPI Money values are empty closed objects and are
    validated as documented.
  reservations.listInbox: >-
    The v1 inbox returns a paged result with `offset`, `limit` (maximum 50),
    `total`, `next`, and `previous`. Results may include bookings and enquiries.
  reservations.get: >-
    Returns the strict v2 BookingDto, including embedded guest, room, quote,
    transaction, and check-in/out information. Money values use the documented
    empty closed object schema.
  reservations.getBookingV1: >-
    Returns full legacy v1 booking details, including guest and check-in/out
    fields. Key-code values are returned to the caller but never logged.
  reservations.getEnquiry: >-
    Returns v1 enquiry details and its embedded guest record.
  reservations.create: >-
    Creates a v1 booking and returns its integer ID. Optional `from` upgrades an
    existing enquiry and is sent as a query parameter. Lodgify documents at
    least one room; each provided room requires `guest_breakdown`. A provided
    guest object requires `guest_name`.
  reservations.createEnquiry: >-
    Creates a v1 enquiry and returns its integer ID. Lodgify requires
    `guest_breakdown`; guest details are nested in the documented `guest` model.
  reservations.unreadCount: >-
    Returns the integer count from the v1 `/reservation/not_read` endpoint.
  reservations.updateBooking: >-
    Sends only fields present in the strict `booking` object. Lodgify notes that
    not every booking field can be updated through this endpoint.
  reservations.deleteBooking: >-
    Moves a booking to the trash; use `recoverBooking` to restore it.
  reservations.deleteEnquiry: >-
    Moves an enquiry to the trash; use `recoverEnquiry` to restore it.
  reservations.createCallMeBack: >-
    Creates an enquiry and emails the owner. The scheduled hour uses a 0–23
    integer, and `guest_breakdown` is required.
  reservations.createQuote: >-
    Creates a quote and returns its integer ID. The optional `custom_fee_amount`
    Money1 field is not exposed because Lodgify's OpenAPI schema has no fields.
  reservations.getQuote: >-
    Returns the current v1 booking quote. Lodgify defines Money amounts as empty
    closed objects in OpenAPI; the output validates that exact documented shape.
  reservations.getPaymentLinkV1: >-
    Returns the current v1 quote payment link. The URL is not included in logs.
  reservations.getPaymentLink: >-
    Returns the next v2 booking payment link. The URL is not included in logs.
  reservations.recoverBooking: >-
    Restores a booking previously moved to the trash.
  reservations.recoverEnquiry: >-
    Restores an enquiry previously moved to the trash.
  reservations.reopenBooking: >-
    Reopens the booking and may make previously reserved availability bookable.
  reservations.declineBooking: >-
    Sets a booking status to Declined.
  reservations.tentativeBooking: >-
    Sets a booking status to Tentative. Optional `requestPayment` is sent as a
    query parameter.
  reservations.bookBooking: >-
    Sets a booking to Booked and updates availability. Optional `requestPayment`
    is sent as a query parameter.
  reservations.declineEnquiry: >-
    Sets an enquiry status to Declined.
  reservations.reopenEnquiry: >-
    Sets an enquiry status to Open.
  reservations.deleteMany: >-
    Accepts an array of booking/enquiry `{ id, type }` entries and moves them to
    the trash.
  reservations.requestPayment: >-
    Requests payment and triggers an email to the guest.
  reservations.checkInV1: >-
    Sends `{ time }` to the legacy v1 route. The time is interpreted in the
    property's local timezone.
  reservations.checkOutV1: >-
    Sends `{ time }` to the legacy v1 route. The time is interpreted in the
    property's local timezone.
  reservations.markManyReplied: >-
    Accepts an array of booking/enquiry `{ id, type }` entries and marks them
    replied.
  reservations.markManyNotReplied: >-
    Accepts an array of booking/enquiry `{ id, type }` entries and marks them
    not replied.
  reservations.markBookingReplied: >-
    Marks one booking as replied.
  reservations.markEnquiryReplied: >-
    Marks one enquiry as replied.
  reservations.markBookingNotReplied: >-
    Marks one booking as not replied.
  reservations.markEnquiryNotReplied: >-
    Marks one enquiry as not replied.
  reservations.checkIn: >-
    Sends `{ time }` to the v2 route. The time is interpreted in the property's
    local timezone.
  reservations.checkOut: >-
    Sends `{ time }` to the v2 route. The time is interpreted in the property's
    local timezone.
  reservations.getExternalBookings: >-
    Returns external-channel records for the booking; provider content is not
    logged.
  reservations.updateKeyCodes: >-
    Updates access key codes by room type. Returned or submitted codes are not
    included in event logs.
  availability.get: >-
    Reads all room-type calendars for one property. Input `from` and `to` map to
    the documented `start` and `end` query parameters; both are required.
  availability.getAll: >-
    Reads calendars for all properties with required `start` and `end` query
    parameters. `includeDetails` is optional.
  availability.getRoomType: >-
    Reads one room-type calendar for a property. Input `from` and `to` map to
    the documented `start` and `end` query parameters.
  availability.set: >-
    Updates the number of available units for a room type via the documented v1
    `POST /availability/{propertyId}/{roomTypeId}/set` body.
  availability.getLegacyAll: >-
    Reads the v1 availability period list for all properties. Required dates are
    `periodStart` and `periodEnd`; other documented filters use Lodgify's exact
    query casing.
  availability.getLegacyProperty: >-
    Reads v1 availability for all room types in a property using the same
    required date range and optional filters.
  availability.getLegacyRoomType: >-
    Reads v1 availability for one room type using the same required date range
    and optional filters.
  rates.calendar: >-
    Requires house, room-type, start-date, and end-date query parameters; the end
    date is inclusive in Lodgify's documented contract. Price fields use the
    provider's Money type, which is an empty closed object in OpenAPI; the plugin
    validates that shape rather than inventing amount/currency fields.
  rates.calendarSimple: >-
    Returns the simplified v1 nightly calendar. Use `rates.calendar` for the
    v2 response, which also includes rate settings and additional pricing fields.
  rates.settings: >-
    Returns documented booking, fee, tax, and promotion settings. The API's
    `houseId` query parameter is optional.
  rates.update: >-
    Posts v1 ranged-rate data to `/rates/savewithoutavailability`; default rates
    cannot include date bounds and date ranges use an exclusive end date.
  quotes.calculate: >-
    Uses v2 `GET /quote/{propertyId}`. Room and add-on lists are encoded as
    zero-indexed bracket query fields; at least one room type is required.
  quotes.calculateV1: >-
    Uses v1 `GET /quote/{propertyId}` with the same documented zero-indexed room
    and add-on query convention. At least one room type is required.
  messages.list: >-
    Retrieves a single v2 messaging thread by UUID. The provider does not
    document a `/v2/messages` collection route.
  messages.send: >-
    Sends one v1 message to either a booking or an enquiry. The required
    `inboxType` selects the documented path; the request body is a one-element
    array. The API documents a 200 response without a body.
  countries.list: >-
    Returns the v1 country-code collection. Lodgify documents no pagination
    parameters for this reference list.
  countries.get: >-
    Looks up one v1 country by its path code.
  currencies.list: >-
    Returns the v1 currency collection, including the documented decimal_places
    field. Lodgify documents no pagination parameters for this reference list.
  currencies.get: >-
    Looks up one v1 currency by its path code.
