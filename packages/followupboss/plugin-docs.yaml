displayName: Follow Up Boss
description: Real-estate CRM with Follow Up Boss - manage people, deals, appointments, calls, texts, notes and tasks, push lead events into its routing, read smart lists and automations data, and manage webhook subscriptions.
domain: followupboss.com
recommendedAuth: api_key
overviewNote: |
  Create a key in Follow Up Boss under Admin, API. Things to know before you call:

  - **Basic auth, not Bearer.** The API key is the username and the password is empty; the plugin builds the documented `Authorization: Basic` header. Bearer is only for OAuth integrations.
  - **Lead intake runs through `events.create`.** FUB's docs advise pushing leads via `POST /events`: it creates or matches the person and runs their action plans. `people.create` only writes the contact without routing.
  - **Identification headers.** Every request carries `X-System` (defaults to `corsair`) and, when you set `systemKey`, `X-System-Key` from your system registration. Registered systems get the higher rate limits (global 250 per 10s instead of 125).
  - **Rate limits are per 10-second window** per context (events GET 20, notes 10, PUT /people 25, global 250). FUB answers 429 with `Retry-After`; the plugin waits that long and retries up to five times.
  - **Paging.** Lists take `limit` (max 100) and `offset`; responses carry a `_metadata` block whose `next` keyset cursor FUB enforces for deep pagination.
  - **Deleting.** Most deletes answer 200 (the plugin returns the echoed resource when FUB sends one). `appointments.delete` and `people.ignoreUnclaimed` answer 204. Deleting an appointment type requires `assignTypeId`: the type its existing appointments move to.
  - **`people.claim` and `people.ignoreUnclaimed`** work on unclaimed leads only, and a claim of a lead that is no longer unclaimed answers 409.
  - **Text messages are logged, not sent.** `textMessages.create` records a message on a person; FUB does not send SMS through the API.
  - **Webhooks.** The plugin manages webhook subscriptions (`/webhooks`) and reads webhook event types; it does not receive webhook deliveries.
examples:
  read:
    path: people.list
    title: List the newest people
    args:
      limit: 10
  write:
    path: events.create
    title: Push a registration lead into FUB routing
    args:
      source: Zillow
      system: corsair
      type: Registration
      person:
        firstName: Jordan
        lastName: Rivera
        emails:
          - value: jordan@acme-logistics.com
            type: home
        phones:
          - value: 888-555-0123
            type: mobile
apiExamples:
  people.list:
    call: "{ limit: 10, stage: 'Lead' }"
  people.get:
    call: "{ id: 123 }"
  people.create:
    call: "{ firstName: 'Jordan', lastName: 'Rivera', emails: [{ value: 'jordan@acme-logistics.com', type: 'home' }], tags: ['Zillow'] }"
  people.update:
    call: "{ id: 123, stage: 'Working', mergeTags: true, tags: ['Hot'] }"
  people.delete:
    call: "{ id: 123 }"
  people.checkDuplicate:
    call: "{ email: 'jordan@acme-logistics.com' }"
  people.unclaimed:
    call: "{ limit: 25 }"
  people.claim:
    call: "{ personId: 123 }"
  people.ignoreUnclaimed:
    call: "{ personId: 123 }"
  personAttachments.create:
    call: "{ personId: 123, uri: 'https://files.example.com/contract.pdf', fileName: 'contract.pdf' }"
  personAttachments.get:
    call: "{ id: 45 }"
  personAttachments.update:
    call: "{ id: 45, personId: 123, uri: 'https://files.example.com/contract-v2.pdf', fileName: 'contract-v2.pdf' }"
  personAttachments.delete:
    call: "{ id: 45 }"
  peopleRelationships.list:
    call: "{ personId: 123 }"
  peopleRelationships.create:
    call: "{ personId: 123, firstName: 'Sam', lastName: 'Rivera', type: 'Spouse', emails: [{ value: 'sam@acme-logistics.com' }] }"
  peopleRelationships.get:
    call: "{ id: 67 }"
  peopleRelationships.update:
    call: "{ id: 67, type: 'Partner' }"
  peopleRelationships.delete:
    call: "{ id: 67 }"
  calls.list:
    call: "{ personId: 123, limit: 50 }"
  calls.create:
    call: "{ personId: 123, phone: '888-555-0123', isIncoming: false, outcome: 'Interested', duration: 320 }"
  calls.get:
    call: "{ id: 89 }"
  calls.update:
    call: "{ id: 89, note: 'Left a voicemail' }"
  textMessages.list:
    call: "{ personId: 123 }"
  textMessages.create:
    call: "{ personId: 123, message: 'Tour confirmed for Friday', toNumber: '888-555-0123', fromNumber: '888-555-0199' }"
  textMessages.get:
    call: "{ id: 32 }"
  notes.create:
    call: "{ personId: 123, subject: 'Tour follow-up', body: 'Sent the listing packet.' }"
  notes.get:
    call: "{ id: 21, includeThreadedReplies: true }"
  notes.update:
    call: "{ id: 21, body: 'Sent the listing packet and comps.' }"
  notes.delete:
    call: "{ id: 21 }"
  events.list:
    call: "{ personId: 123, limit: 50 }"
  events.get:
    call: "{ id: 1001 }"
  events.create:
    call: "{ source: 'Zillow', type: 'Registration', person: { firstName: 'Jordan', lastName: 'Rivera', emails: [{ value: 'jordan@acme-logistics.com' }] } }"
  tasks.list:
    call: "{ due: 'today' }"
  tasks.create:
    call: "{ personId: 123, name: 'Send listing packet', type: 'Email', dueDate: '2026-05-22' }"
  tasks.get:
    call: "{ id: 14 }"
  tasks.update:
    call: "{ id: 14, isCompleted: true }"
  tasks.delete:
    call: "{ id: 14 }"
  appointments.list:
    call: "{ personId: 123, start: '2026-05-21T00:00:00+00:00', end: '2026-05-28T00:00:00+00:00' }"
  appointments.create:
    call: "{ title: 'Property tour', start: '2026-05-21T17:00:00+00:00', end: '2026-05-21T17:30:00+00:00', invitees: [{ id: 123, type: 'person' }] }"
  appointments.get:
    call: "{ id: 8 }"
  appointments.update:
    call: "{ id: 8, start: '2026-05-22T17:00:00+00:00', end: '2026-05-22T17:30:00+00:00' }"
  appointments.delete:
    call: "{ id: 8 }"
  appointmentTypes.list:
    call: "{}"
  appointmentTypes.create:
    call: "{ name: 'Buyer consultation', orderWeight: 1 }"
  appointmentTypes.get:
    call: "{ id: 3 }"
  appointmentTypes.update:
    call: "{ id: 3, name: 'Buyer consult' }"
  appointmentTypes.delete:
    call: "{ id: 3, assignTypeId: 4 }"
  timeframes.list:
    call: "{}"
  smartLists.list:
    call: "{ limit: 50 }"
  smartLists.get:
    call: "{ id: 2 }"
  account.me:
    call: "{}"
  account.identity:
    call: "{}"
