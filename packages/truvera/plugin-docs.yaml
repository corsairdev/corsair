displayName: Truvera
description: 'Create DIDs, issue and revoke verifiable credentials, manage schemas and revocation registries, and verify credentials.'
domain: truvera.io
recommendedAuth: api_key
overviewNote: |
  Create an API key in Truvera Workspace. The key travels as a Bearer token. A production key works against `https://api.truvera.io`, the default. A test-mode key only works against the sandbox host `https://api-testnet.truvera.io`, which uses test data: pass `sandbox: true` when you create the plugin (`truvera({ sandbox: true })`) to send every call there.

  Things to know:

  - **Issuing signs a real credential.** A credential cannot be edited after it is issued, only revoked and replaced. Issue onto the testnet until the schema, the subject fields and the revocation link are right.
  - **The issuer must be a DID you control.** Truvera rejects a signing request whose `credential.issuer` belongs to another account, which the input schema cannot know, so it surfaces as a 400 with the field path in the error.
  - **Persisting needs a password.** `persist: true` stores an encrypted copy and requires `password`; the plugin checks this before sending. Persisting a credential holding personal data has regulatory consequences.
  - **Distribution needs a recipient.** `distribute: true` needs `recipient_email`, `recipient_did`, or the holder DID in `credential.subject.id`, which the plugin also checks first. Email distribution sends the holder an email.
  - **Issuing and revoking are destructive.** `credentials.issue` signs a permanent credential and can email the holder; `credentials.revoke`, `credentials.unrevoke` and `registries.revoke` change what every verifier sees.
  - **Lists page by offset.** `dids.list`, `profiles.list`, `schemas.list` and `registries.list` take `offset` and `limit` (at most 64).
  - **Errors.** HTTP failures are core's `ApiError`. `truveraErrorDetails(error)` reads the field errors, and an API key Truvera echoes back in a 401 is masked.
  - **Revoking is not deleting.** `credentials.revoke` makes every verification of that credential fail. `credentials.delete` only removes the metadata record and leaves the credential valid, so revoke before deleting.
  - **Deleting a registry is permanent.** `registries.delete` removes the status of every credential in it, so revocations recorded there are lost.
  - **A 402 is the plan limit.** The account's transaction allowance is used up; nothing is charged and no retry helps.
  - **Not included.** Trust registries, teams, sub-accounts, OpenID issuers, DIDComm messaging, webhooks and proof templates have their own routes and are not part of this plugin.
examples:
  read:
    path: credentials.list
    title: List your credential metadata
    args:
      limit: 25
  write:
    path: credentials.issue
    title: Issue a credential into a holder wallet
    args:
      credential:
        issuer: did:cheqd:mainnet:ac2b9027-ec1a-4ee2-aad1-1e316e7d6f59
        name: Basic Credential
        type:
          - BasicCredential
        subject:
          id: did:key:z6MkqBcwvYurNSSqyBkxavv4fkaq2iu3v3YGMbdyfa4bVNxD
          name: A. Holder
      distribute: true
      revocable: true
apiExamples:
  dids.list: {}
  dids.create:
    call: "{ type: 'cheqd', key_type: 'ed25519' }"
  dids.get:
    call: "{ did: 'did:cheqd:mainnet:ac2b9027-ec1a-4ee2-aad1-1e316e7d6f59', name: 'Acme Issuer' }"
  dids.getMetadata:
    call: "{ did: 'did:cheqd:mainnet:ac2b9027-ec1a-4ee2-aad1-1e316e7d6f59', name: 'Acme Issuer' }"
  dids.delete:
    call: "{ did: 'did:cheqd:mainnet:ac2b9027-ec1a-4ee2-aad1-1e316e7d6f59', name: 'Acme Issuer' }"
  profiles.list: {}
  profiles.create:
    call: "{ did: 'did:cheqd:mainnet:ac2b9027-ec1a-4ee2-aad1-1e316e7d6f59', name: 'Acme Issuer' }"
  profiles.get:
    call: "{ did: 'did:cheqd:mainnet:ac2b9027-ec1a-4ee2-aad1-1e316e7d6f59', name: 'Acme Issuer' }"
  profiles.update:
    call: "{ did: 'did:cheqd:mainnet:ac2b9027-ec1a-4ee2-aad1-1e316e7d6f59', name: 'Truvera Issuer' }"
  profiles.delete:
    call: "{ did: 'did:cheqd:mainnet:ac2b9027-ec1a-4ee2-aad1-1e316e7d6f59', name: 'Acme Issuer' }"
  credentials.issue:
    call: "{ credential: { issuer: 'did:cheqd:mainnet:ac2b9027-ec1a-4ee2-aad1-1e316e7d6f59', type: ['BasicCredential'], subject: { id: 'did:key:z6Mkq...', name: 'A. Holder' } }, revocable: true }"
  credentials.list:
    call: "{ limit: 25 }"
  credentials.get:
    call: "{ credential_id: 'https://creds.truvera.io/1234' }"
  credentials.delete:
    call: "{ credential_id: 'https://creds.truvera.io/1234' }"
  credentials.revoke:
    call: "{ credential_id: 'https://creds.truvera.io/1234' }"
  credentials.unrevoke:
    call: "{ credential_id: 'https://creds.truvera.io/1234' }"
  schemas.create:
    call: "{ name: 'Basic Credential', type: 'object', properties: { name: { type: 'string' } }, required: ['name'] }"
  schemas.list: {}
  schemas.get:
    call: "{ schema_id: 'https://acme.com/schemas/basic-credential.json' }"
  schemas.delete:
    call: "{ schema_id: 'https://acme.com/schemas/basic-credential.json' }"
  registries.create:
    call: "{ type: 'dock', add_only: false }"
  registries.list: {}
  registries.get:
    call: "{ registry_id: 'e6d3...59d1' }"
  registries.delete:
    call: "{ registry_id: 'e6d3...59d1' }"
  registries.revoke:
    call: "{ registry_id: 'e6d3...59d1', credential_ids: ['1004'], action: 'revoke' }"
  registries.revocationStatus:
    call: "{ registry_id: 'e6d3...59d1', revocation_id: '1004' }"
  verify.verify:
    call: "{ credential: { '@context': ['https://www.w3.org/2018/credentials/v1'], type: ['VerifiableCredential'], issuer: 'did:cheqd:mainnet:ac2b9027-ec1a-4ee2-aad1-1e316e7d6f59', issuanceDate: '2026-05-02T00:00:00Z', credentialSubject: { id: 'did:key:z6Mkq...' }, proof: {} } }"
  jobs.get:
    call: "{ job_id: 'job-123' }"
apiNotes:
  dids.create: 'A DID with a DIDComm service endpoint needs `didcomm_service_url`. Deleting a DID leaves credentials signed with it unverifiable against that DID.'
  credentials.issue: 'The issuer must be a DID the account controls. `persist` needs `password`, and `distribute` needs a recipient; both are checked before the request.'
  credentials.delete: 'Deletes the metadata record only. The credential itself stays valid, so use `credentials.revoke` first.'
  credentials.revoke: 'Makes every verification of the credential fail. This can be undone with `credentials.unrevoke`.'
  schemas.delete: 'Credentials already issued against the schema stay valid; only the schema entry is removed.'
  registries.delete: 'Removes the status of every credential in the registry, so revocations recorded there are lost.'
  registries.revoke: 'Applies one action to several credentials in one call. `credential_ids` are the registry indices.'
  verify.verify: 'A failed verification answers 200 with `verified: false` and the reasons in `errors`; it is not an error.'
