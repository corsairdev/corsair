# Display copy for the generated docs and the catalog, plus one call
# example per operation. Generated with the plugin from Azure DevOps's OpenAPI spec;
# docs-examples.test.ts parses every example with its input schema.
displayName: Azure DevOps
domain: dev.azure.com
description: "Azure DevOps Services: repositories, pull requests, work items, builds, pipelines, releases, artifacts, test plans, wikis, users and permissions (1002 operations)."
recommendedAuth: api_key
overviewNote: |
  Create a personal access token in Azure DevOps (User settings > Personal access tokens) with the scopes you need, and connect it with the organization name (`fabrikam` for `dev.azure.com/fabrikam`). Things to know before you write:

  - **Hosts.** Most routes live on `dev.azure.com/<organization>`. Releases are on `vsrm.dev.azure.com`, artifact feeds on `feeds.` and `pkgs.dev.azure.com`, users and groups on `vssps.` and `vsaex.dev.azure.com`, audit on `auditservice.`, search on `almsearch.`, test results on `vstmr.dev.azure.com`. The plugin picks the host per operation.
  - **API versions.** Each operation sends the api-version Microsoft documents it at (7.1, or 7.1-preview.N for preview APIs).
  - **Work items** are created and updated with a JSON Patch list in `body`: `[{ "op": "add", "path": "/fields/System.Title", "value": "..." }]`.
  - **Paging.** List routes that page with a continuation token return `{ items, nextCursor }`; pass `nextCursor` back as `continuationToken`. Others take `$top` and `$skip`.
  - **What costs money or acts.** Queuing builds and running pipelines use pipeline minutes; adding users or raising access levels can add paid licences; completing a pull request merges it; service connections hold credentials. These and every delete are `destructive`.
  - **New organizations.** Creating an organization now asks for an Azure subscription (seen 2026-11-28), and an Azure free account needs a card and a phone number.
examples:
  read:
    path: core.projects.list
    title: List projects
    args: {"$top": 20}
  write:
    path: wit.workItems.create
    title: Create a work item
    args: {"project": "Fabrikam-Fiber", "type": "Task", "body": [{"op": "add", "path": "/fields/System.Title", "value": "Write the release notes"}]}
