displayName: Raisely
description: Charity fundraising with Raisely - read campaigns, donations, fundraising profiles and designations, record a donation, and update a fundraising profile through the Raisely API.
domain: raisely.com
recommendedAuth: api_key
overviewNote: |
  Generate an API key in Raisely under **Settings → API**. Send it as `Authorization: Bearer <key>`. Things to know before you call:

  - **Auth is optional per route, not per account.** Raisely's routes accept an anonymous caller where the record is public, so a request can succeed without a key. With a key it returns the private fields too; without one, `private` is ignored.
  - **Three routes are not on the plain REST shape.** `/donations` POST takes its record under `data`, and `/profiles` requires a `campaign` query parameter. Both are enforced by the schemas here rather than left to a 422.
  - **Offsets, not pages.** Every collection answers `{ data, pagination }` with `total`, `offset` and `limit`, and the plugin returns `next_offset` for the next call. Do not add `limit` to the offset: the response already reports both.
  - **A sort without an order is ignored.** Raisely applies `sort` only when `order` is also present, so the plugin sends the pair together or neither.
  - **Donation types.** `type` takes `ONLINE` for a donation taken through a gateway or `OFFLINE` for one recorded by hand; `mode` takes `LIVE` or `TEST`. An unknown value is rejected before the request is sent.
  - **Amounts are integers in the smallest currency unit.** A `$25.00` donation arrives as `2500`, and `donations.create` expects the same.
  - **Errors are RFC 7807 problem documents.** `detail` is the summary, `errors` names each field at fault, and `code` is the machine-readable reason. `instance` is the id Raisely support asks for; all four are exposed on `RaiselyAPIError`.
  - **`410 Gone` is not a 404.** A soft-deleted campaign or donation answers `410`; both are reported as not-found, since no retry recovers either.
  - **Retries.** A 429 is retried three times and honours the documented `Retry-After`. A `5xx` is retried only for a call the plugin declared read-only, never for a donation.
examples:
  read:
    path: campaigns.list
    title: List active campaigns
    args:
      status: active
      limit: 100
  write:
    path: donations.create
    title: Record an offline donation
    args:
      amount: 2500
      currency: USD
      email: jordan@example.com
      method: CREDIT_CARD
apiExamples:
  campaigns.list:
    call: "{ status: 'active', limit: 100, sort: 'createdAt', order: 'desc' }"
  campaigns.get:
    call: "{ campaign: 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa' }"
  donations.list:
    call: "{ campaign: 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', mode: 'LIVE', limit: 100 }"
  donations.get:
    call: "{ donation_uuid: 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb' }"
  donations.create:
    call: "{ amount: 2500, currency: 'USD', email: 'jordan@example.com', method: 'CREDIT_CARD', type: 'ONLINE', campaignUuid: 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa' }"
  profiles.list:
    call: "{ campaign: 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', limit: 50 }"
  profiles.get:
    call: "{ profile_path: 'jordan-lee' }"
  profiles.update:
    call: "{ profile_path: 'jordan-lee', goal: 6000 }"
  designations.list:
    call: "{ campaign: 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', status: 'active' }"
apiNotes:
  'campaigns.list': '`order` is only sent when `sort` is also set, because Raisely ignores it alone.'
  'donations.create': 'The record is sent under `data`; amounts are integers in the smallest currency unit.'
  'profiles.list': 'Raisely requires `campaign` on this route, so the schema makes it mandatory.'
  'profiles.update': 'The body is sent under `data`, and the path identifies the record rather than the body.'
  'designations.list': 'A designation is what a donation is attributed to; `publicName` is the label shown to donors.'
