displayName: Twilio
description: "Twilio plugin for Corsair — SMS, calls, and message events."
examples:
  read:
    path: messages.list
    title: List messages
  write:
    path: messages.send
    title: Send a message
    args:
      To: "+15555550100"
      From: "+15555550101"
      Body: Hello from Corsair
dbExample:
  entity: messages
  note: "Search synced messages without hitting Twilio."
  limit: 50
exampleWebhook:
  path: message.received
  note: "Fires when an inbound SMS arrives."
  after: |
    console.log('Twilio message:', result.data);
