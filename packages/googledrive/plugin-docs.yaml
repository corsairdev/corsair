displayName: Google Drive
description: Cloud file storage for uploading, organizing, sharing, and syncing documents online.

examples:
  read:
    path: files.list
    title: List files
  write:
    path: files.createFromText
    title: Create a file
    args:
      name: hello.txt
      content: Hello from Corsair

dbExample:
  entity: files
  note: 'Search synced files without hitting Drive.'
  data:
    trashed: false
  limit: 50

exampleWebhook:
  path: driveChanged
  note: 'Fires when a file or folder is created, updated, or deleted.'
  after: |
    console.log('Drive change:', result.data?.changeType, result.data?.fileId ?? result.data?.folderId);
