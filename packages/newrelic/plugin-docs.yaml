displayName: New Relic
description: Read New Relic applications with their health and reporting status, pull metric timeslices, manage alert policies and list their conditions, and run NRQL queries through NerdGraph.
domain: newrelic.com
recommendedAuth: api_key
overviewNote: |
  Use a **user key**, not a license key. Create one at https://one.newrelic.com/api-keys under **Create a key**, choosing **User** as the key type. A license key only ingests data and cannot read any of this.

  The plugin talks to two surfaces, both under the same key:

  - **REST v2** for applications, metrics and alerts, at `api.newrelic.com/v2`.
  - **NerdGraph**, the GraphQL API, for NRQL, at `api.newrelic.com/graphql`.

  An EU account uses `api.eu.newrelic.com` for both, and **a key is only valid in its own region**. Pass `region: 'eu'` on any call from an EU account; the default is `us`.

  What to know:

  - **`health_status` is a colour**, one of `green`, `orange`, `red` or `unknown`. The REST API says `orange` where the UI shows yellow, and `unknown` means the app has no alert policy attached.
  - **`reporting` goes false after ten quiet minutes**, and `last_reported_at` is then an empty string rather than a timestamp, so a missing time is not an error.
  - **A metric window defaults to the last 30 minutes** when `from` is omitted. `summarize: true` collapses the window into one value per metric, which is what most dashboards want.
  - **REST v2 pages through a `Link` header**, which this plugin cannot read, so `page` is an input. A long list needs an explicit page walk.
  - **`alerts.conditions` covers APM, browser and mobile conditions only.** External service, synthetic and NRQL conditions live behind separate endpoints that are not wrapped here.
  - **A NRQL query is a NerdGraph call.** `accountId` is required, and the answer carries the time window New Relic actually ran over, which can differ from the `SINCE` clause.
  - **A bad NRQL query answers 200 with an `errors` array.** The plugin turns that into a thrown error rather than returning rows that are silently empty.
  - **Deleting a policy deletes its conditions**, and New Relic has no restore call.
  - **`incident_preference` is one of `PER_POLICY`, `PER_CONDITION` or `PER_CONDITION_AND_TARGET`** and decides whether alerts roll up per policy, per condition, or per condition and signal. It defaults to `PER_POLICY`.
examples:
  read:
    path: applications.list
    title: List applications with their health
    args: {}
  write:
    path: alerts.createPolicy
    title: Create an alert policy
    args:
      name: EMEA API alerts
apiExamples:
  applications.list:
    call: "{ name: 'Web', page: 1 }"
  applications.get:
    call: "{ applicationId: 1129082 }"
  metrics.get:
    call: "{ applicationId: 1129082, names: ['Apdex', 'Errors/all'], summarize: true }"
  alerts.policies:
    call: "{ name: 'Browser Agent Alert Policy' }"
  alerts.createPolicy:
    call: "{ name: 'EMEA API alerts', incident_preference: 'PER_CONDITION' }"
  alerts.deletePolicy:
    call: "{ policyId: 41534 }"
  alerts.conditions:
    call: "{ policyId: 41534 }"
  query.nrql:
    call: "{ accountId: 1234567, query: 'SELECT count(*) FROM Transaction SINCE 1 hour ago' }"
apiNotes:
  applications.list: 'health_status is green, orange, red or unknown; orange is the REST spelling of the UI yellow.'
  metrics.get: 'Without from, New Relic returns the last 30 minutes. summarize collapses the window into one value per metric.'
  alerts.deletePolicy: 'Deleting a policy also deletes its conditions, and there is no restore call.'
  alerts.conditions: 'Only APM, browser and mobile conditions; external service, synthetic and NRQL conditions are separate endpoints.'
  query.nrql: 'Runs through NerdGraph, so accountId is required. A bad query answers 200 with an errors array, which the plugin throws.'
