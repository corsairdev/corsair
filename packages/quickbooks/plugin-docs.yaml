# Display copy for the docs, the catalog, corsair.dev and Hub.
displayName: "QuickBooks"
description: "QuickBooks Online Accounting operations for all catalogued resources, including reports, transactions, attachments, batch, and change-data capture."
overviewNote: >-
  This plugin registers 236 of the 237 operations in Intuit’s first-party Accounting route catalog, plus item.deleteCategory, which the catalog lacks but QuickBooks requires to remove a category. The remaining Entitlements.READ operation requires an XML response contract that the package cannot validate; details are in the package README. Every resource family was run against a QuickBooks sandbox company on 2026-11-23. Pass the company's realmId to each operation: Intuit sends it on the OAuth redirect, and a company admin can read it in QuickBooks under Settings > Account and settings > Billing & subscription (Company ID). Hub does not save it on connect yet. Operations named update are QuickBooks full updates: QuickBooks clears the writable fields a body leaves out, so read the record with get, change it, and send all of it back (the examples show the minimum shape only), or use sparseUpdate where it exists. The default minor version is 75.
apiNotes:
  accounts.create: >-
    POST /v3/company/{realmId}/account. Name must be unique, at most 100
    characters, and cannot contain a double quote or colon. Supply accountType
    or accountSubType. Source:
    https://developer.intuit.com/app/developer/qbo/docs/api/accounting/all-entities/account
  accounts.get: >-
    GET /v3/company/{realmId}/account/{accountId}. Account IDs are strings.
    Source:
    https://developer.intuit.com/app/developer/qbo/docs/api/accounting/all-entities/account
  accounts.list: >-
    GET /v3/company/{realmId}/query with SELECT * FROM Account. Pagination uses
    STARTPOSITION and MAXRESULTS (1–1000; default 100). Source:
    https://static.developer.intuit.com/output_html/qbo/docs/learn/explore-the-quickbooks-online-api/data-queries.html
  company.get: >-
    GET /v3/company/{realmId}/companyinfo/{realmId}. The realmId is required
    twice in the provider path. Source:
    https://developer.intuit.com/app/developer/qbo/docs/api/accounting/all-entities/companyinfo
  company.list: >-
    GET /v3/company/{realmId}/query with SELECT * FROM CompanyInfo. Source:
    https://developer.intuit.com/app/developer/qbo/docs/api/accounting/all-entities/companyinfo
  accounts.update: >-
    This is Intuit's full update operation, not a patch. Include the latest Id
    and SyncToken and every writable field that should be preserved; writable
    fields omitted from the request are set to null. Source:
    https://developer.intuit.com/app/developer/qbo/docs/api/accounting/all-entities/account
  company.update: >-
    Full update: omitted writable CompanyInfo fields are set to null. Use
    company.sparseUpdate for documented sparse semantics. Source:
    https://developer.intuit.com/app/developer/qbo/docs/api/accounting/all-entities/companyinfo
  batch.execute: >-
    Submit 1–30 strictly modelled create, update, delete, or Query batch items.
    Use optionsData: void with update for supported void transactions. Execution
    order is not guaranteed. Source:
    https://developer.intuit.com/app/developer/qbo/docs/api/accounting/all-entities/batch
  changeDataCapture.changes: >-
    changedSince must be within the previous 30 days. JournalCode, TaxAgency,
    TimeActivity, TaxCode, and TaxRate are not supported. Source:
    https://static.developer.intuit.com/output_html/qbo/docs/learn/explore-the-quickbooks-online-api/change-data-capture.html
  trialBalance.list: >-
    Select locale FR for the TrialBalanceFR route; other locales use TrialBalance.
    Parameters follow the first-party trialbalancequery model. Source:
    https://developer.intuit.com/app/developer/qbo/docs/api/accounting/all-entities/trialbalance
  attachable.upload: >-
    Upload one base64-encoded file as multipart form data; a request is limited
    to 100 MB total. Source:
    https://developer.intuit.com/docs/0100_quickbooks_online/0200_dev_guides/accounting/0050_attach_images_and_notes
  attachable.download: >-
    Returns the temporary download URL as text/plain. Intuit states that it
    expires after 15 minutes. Source:
    https://developer.intuit.com/docs/0100_quickbooks_online/0200_dev_guides/accounting/0050_attach_images_and_notes
  item.deleteCategory: >-
    POST /v3/company/{realmId}/item?operation=delete with the category's Id
    and SyncToken. Categories can't be made inactive (QuickBooks answers fault
    1020 to Active=false); other item types can't be deleted, only made
    inactive with item.update.
  taxCode.get: >-
    Only numeric tax code IDs can be read. The TAX, NON and CustomSalesTax
    codes that US companies list are pseudo codes; reading them by ID answers
    fault 2030 (Invalid ID).
  taxPayment.list: >-
    TaxPayment is not available for US companies (fault 5030, "not supported
    for this region").
  deposit.sparseUpdate: >-
    QuickBooks still requires DepositToAccountRef and Line in a sparse
    Deposit update (fault 2020 otherwise).
  transfer.sparseUpdate: >-
    QuickBooks still requires FromAccountRef, ToAccountRef and Amount in a
    sparse Transfer update (fault 2020 otherwise).
  creditCardPayment.sparseUpdate: >-
    QuickBooks still requires CreditCardAccountRef, BankAccountRef and Amount
    in a sparse update (fault 2020 otherwise).
  companyCurrency.create: >-
    Needs multicurrency turned on for the company (fault 9029 otherwise).
    Turning multicurrency on in QuickBooks can't be undone.
  exchangerate.update: >-
    Needs multicurrency turned on for the company. Without it, exchangerate.get
    still returns Intuit's daily rate, but that record has no SyncToken and
    can't be updated.
  preferences.update: >-
    Send Id, SyncToken, sparse: true and only the sections to change.
    QuickBooks reads settings missing from a full update as turned off.
examples:
  read:
    path: accounts.list
    title: List accounts
    args:
      realmId: "12345678"
      startPosition: 1
      maxResults: 10
  write:
    path: accounts.create
    title: Create a receivables account
    args:
      realmId: "12345678"
      name: Operating Receivables
      accountSubType: "AccountsReceivable"
