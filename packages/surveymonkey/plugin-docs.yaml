    call: "{ survey_id: '1234', title: 'Customer feedback 2026' }"
  surveys.replace:
    call: "{ survey_id: '1234', title: 'Customer feedback' }"
  surveys.delete:
    call: "{ survey_id: '1234' }"
  surveys.listCategories:
    call: "{ language: 'en' }"
  surveys.listTemplates:
    call: "{ language: 'en', category: 'business' }"
  surveys.listLanguages:
    call: "{ per_page: 100 }"
  pages.list:
