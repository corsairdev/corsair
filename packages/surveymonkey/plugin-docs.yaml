    call: "{ collector_id: '1234' }"
  collectors.update:
    call: "{ collector_id: '1234', status: 'closed' }"
  collectors.delete:
    call: "{ collector_id: '1234' }"
  messages.list:
    call: "{ collector_id: '1234' }"
