apiNotes:
  surveys.list: |
    Answers `{ data, page, per_page, total, links }`. `sort_by` takes `title`, `date_modified` or `date_created`, and `sort_order` is `ASC` or `DESC`. `include` takes a comma-separated list such as `response_count,date_created` to add those fields, and `folder_id`, `title` and the two modification dates narrow the list.
  surveys.create: |
    Answers the survey with an empty page list. `from_template_id` copies a template, and `from_survey_id` copies an existing survey; without either the survey is empty and needs a page and a question before it can record a response.
  surveys.get: |
    Answers one survey. `response_count` is present only when the list route was asked for it with `include`.
  surveys.getDetails: |
    Answers the survey with every page and question, including each choice's id and text. This is the call to make before reading answers, because a response carries choice ids rather than choice text.
  surveys.update: |
    Sends PATCH with only the fields you pass, so everything else stays. `buttons_text` sets the four button labels, and `custom_variables` is a map of name to label.
  surveys.replace: |
    Sends PUT, which replaces the survey. **A field you leave out resets to its default**, so use `surveys.update` for a single change.
  surveys.delete: |
    Answers 200 with an empty body, so the plugin reports `{ survey_id, deleted: true }`. The pages, questions and responses go with it.
  surveys.listCategories: |
    Answers `{ data }`, the categories a survey can be filed under for `language`.
  surveys.listTemplates: |
    Answers `{ data }` of surveys, each a template. `language` and `category` narrow the list.
  surveys.listLanguages: |
    Answers `{ data }`, the languages a survey can be written in.
  pages.list: |
    Answers `{ data }` in page order. A survey always has at least one page once it has questions.
  pages.create: |
    Answers the created page. `position` is 1-based; omitting it appends the page.
  pages.get: |
    Answers one page with its `question_count`.
  pages.update: |
    Sends PATCH, so only the fields you pass change. SurveyMonkey rejects a patch without `object_ids`, so when you leave them out the plugin reads the webhook first and resends its current ones. `position` reorders the page within the survey.
  pages.delete: |
    Answers 200 with an empty body and reports `{ survey_id, page_id, deleted: true }`. The questions on the page go with it.
  questions.list: |
    Answers `{ data }` in question order. Each question carries its `family`, `subtype`, headings and, for a choice question, its choices.
  questions.create: |
    Answers the created question. **`family` and `subtype` are required** and decide the question type, for example `single_choice` with `vertical`. At least one heading is required and it is the question text. `answers.choices` carries the options for a choice question.
  questions.get: |
    Answers one question with its choices, required rule and validity settings.
  questions.update: |
    Sends PATCH, so only the fields you pass change. SurveyMonkey rejects a patch without `object_ids`, so when you leave them out the plugin reads the webhook first and resends its current ones. `visible: false` hides the question without deleting it, and the answers already recorded stay.
  questions.delete: |
    Answers 200 with an empty body and reports the three ids. The answers recorded for the question go with it.
  responses.list: |
    Answers `{ data }` where each entry is **only an id and a link**. Use `responses.listBulk` for the answers. `status` takes `completed`, `partial`, `overquota` or `disqualified`.
  responses.listBulk: |
    Answers `{ data }` with each response's pages, questions and answers. `per_page` goes up to 100. `simple: true` adds the question and answer text alongside the ids. `collector_ids`, `page_ids` and `question_ids` narrow what comes back.
  responses.get: |
    Answers one response with its pages, questions and answers. Each answer carries a `choice_id`, `row_id`, `col_id` or `other_id`, which you map to text with `surveys.getDetails`.
  responses.getDetails: |
    Answers one response with the same structure as `responses.get` plus the question detail. `responses.get` is enough when you already cached the survey details.
  responses.create: |
    Posts to `/collectors/{id}/responses`, because a collector owns the response link. `response_status` sets whether it counts as `completed`. `recipient_id` is required for an email collector. Nothing is mailed to a respondent.
  responses.delete: |
    Answers 200 with an empty body and reports `{ survey_id, response_id, deleted: true }`. The survey's counts change.
  responses.deleteAll: |
    Deletes every response the collector gathered and reports `{ collector_id, deleted: true }`. **There is no undo**, and the collector stays open so it can gather more.
  collectors.list: |
    Answers `{ data }` of collectors. `include` adds their messages, `name` filters by name, and `start_date` plus `end_date` filter by creation.
  collectors.create: |
    Answers the created collector. `type` is `weblink` or `email`; `sms` exists in the API but cannot be created here. A weblink collector answers a public `url`, and an email collector needs messages and recipients before it sends anything.
  collectors.get: |
    Answers one collector with its link, status and settings.
  collectors.update: |
    Sends PATCH, so only the fields you pass change. SurveyMonkey rejects a patch without `object_ids`, so when you leave them out the plugin reads the webhook first and resends its current ones. **`status` is the field that opens or closes it**, and `type` cannot be changed.
  collectors.delete: |
    Answers 200 with an empty body and reports `{ collector_id, deleted: true }`. Its link stops working; the responses it gathered stay on the survey.
  messages.list: |
    Answers `{ data }` of the collector's messages.
  messages.create: |
    Answers the drafted message. `type` is `invite` for the first send, `reminder` to chase non-responders, and `thank_you` for the follow-up note. **Nothing is sent**: a message needs recipients and then `messages.send`. The body goes in `body_text` (or `body_html`, which wins) and must include `[SurveyLink]`, `[OptOutLink]`, `[PrivacyLink]` and `[FooterLink]`.
  messages.get: |
    Answers one message subject and body.
  messages.update: |
    Sends PATCH. A change is only possible before the message is sent.
  messages.send: |
    Sends the message to every recipient on it. **This mails real people**, so list the recipients first. `scheduled_date` defers the send instead of sending now. The answer is the scheduled message (`is_scheduled`, `recipients`, `type`), which has no `id`.
  recipients.list: |
    Answers `{ data }` with each recipient's `mail_status` and `survey_response_status`, which is how you tell who has answered.
  recipients.create: |
    Answers the created recipient. The email has to look valid, and the message must not have been sent yet.
  recipients.bulkCreate: |
    Wraps the list in `contacts` and answers `{ succeeded, invalids, existing }`. A recipient already on the message comes back under `existing`, as its email address, rather than failing the call.
  contactLists.list: |
    Answers `{ data }` of contact lists on the account, 50 a page by default.
  contactLists.create: |
    Answers the created list. A list starts empty; contacts are on the account and adding them is a separate resource.
  contactLists.get: |
    Answers one contact list.
  contactLists.update: |
    Sends PATCH with `name`, which renames the list.
  contactLists.delete: |
    Answers 200 with an empty body and reports `{ contact_list_id, deleted: true }`. The contacts on it stay on the account.
  contactLists.copy: |
    Answers the new list. `name` defaults to a copy of the original name.
  contactLists.merge: |
    Copies every contact from `list_id` into the list in the URL (`contact_list_id`) and answers that list, `{ id, name, href }`. The plugin adds `source_list_id` and `target_list_id`. `list_id` keeps its contacts.
  contacts.list: |
    Answers `{ data }`. `status` takes `active`, `optout` or `bounced`. `sort_by` and `search_by` take a field name, or a custom field number as `1` through `6`.
  contacts.create: |
    Answers the created contact. **Both names are required**, and so is an email or a phone number. This creates the contact on the account; a contact list is a separate resource.
  contacts.bulkCreate: |
    Wraps the list in `contacts` and answers `{ succeeded, invalids, existing }`. `update_existing: true` beside `contacts` (or on an entry) updates the contact when its email is already known instead of adding it to `existing`.
  contacts.get: |
    Answers one contact with its `custom_fields` and status.
  contacts.update: |
    Sends PATCH, so only the fields you pass change. SurveyMonkey rejects a patch without `object_ids`, so when you leave them out the plugin reads the webhook first and resends its current ones. `custom_fields` replaces the whole map.
  contacts.delete: |
    Answers 200 with an empty body and reports `{ contact_id, deleted: true }`. The contact leaves every list and stops receiving invites.
  contacts.listFields: |
    Answers `{ data }` of the custom contact fields, with the label to show and the id to use as a key in `custom_fields`.
  contacts.updateField: |
    Sends PATCH with `label`, which renames the field. The id never changes, so a rename does not break a stored `custom_fields` key.
  webhooks.list: |
    Answers `{ data }` of webhooks and what each subscribes to.
  webhooks.create: |
    Answers the created webhook. `event_type` is one of the twelve documented events. `object_ids` lists the surveys or collectors to watch, and is omitted for `survey_created`, which fires on a survey that does not exist yet. `authorization` is a value SurveyMonkey sends back as a header on every delivery.
  webhooks.get: |
    Answers one webhook subscription.
  webhooks.update: |
    Sends PATCH, so only the fields you pass change. SurveyMonkey rejects a patch without `object_ids`, so when you leave them out the plugin reads the webhook first and resends its current ones.
  webhooks.delete: |
    Answers 200 with an empty body and reports `{ webhook_id, deleted: true }`. The URL stops receiving events.
  users.getMe: |
    Answers the account the token belongs to, with its `account_type`. This is the cheapest way to confirm a connection works. The plan decides how many responses the API returns.
  folders.list: |
    Answers `{ data }` of survey folders.
  folders.create: |
    Sends the title as a lowercase **`title`** and answers the folder. The reference's example uses `Title`, which the API ignores (the folder comes back as "New Folder").
