  questions.list:
    call: "{ survey_id: '1234', page_id: '5678' }"
  questions.create:
    call: "{ survey_id: '1234', page_id: '5678', family: 'single_choice', subtype: 'vertical', headings: [{ heading: 'How did you hear about us?' }], answers: { choices: [{ text: 'Search' }, { text: 'A friend' }] } }"
  questions.get:
    call: "{ survey_id: '1234', page_id: '5678', question_id: '9012' }"
  questions.update:
    call: "{ survey_id: '1234', page_id: '5678', question_id: '9012', headings: [{ heading: 'Where did you hear about us?' }] }"
