displayName: Mopinion
description: Feedback analytics with Mopinion - read account data, datasets, deployments, reports, fields and collected feedback with filters and paging.
domain: mopinion.com
recommendedAuth: api_key
overviewNote: |
  Create a Feedback API credential set in Mopinion under Settings > Feedback
  API (classic interface) or Integrations > Feedback API (Raspberry
  interface); the package must include API access (the 14-day trial does).
  Connect with the signature token as the API key and the public key as the
  account's `public_key` field. Every request is signed with an HMAC-based
  `x-auth-token` header computed over the resource path and body.

  - **Pinned to the 2.5 API.** The client sends `version: 2.5.0`, which
  Mopinion serves as its current stable release (2.5.5 on 2026-11-24). The
  3.0.0 line is an alpha: on 2026-11-24 it answered 500 for every feedback
  route and for a deployment read.
  - **Read-only.** The data API only exposes GET endpoints, so every
  operation here is a read; there is nothing to send or delete.
  - **Response shapes.** A single resource (account, dataset, report,
  deployment) comes back as its fields next to `_meta`. Lists (fields,
  feedback, deployments) and a single feedback item come back as
  `{ data: [...], _meta }`.
  - **Paging and metadata.** Lists take `page` (default 1) and `limit`
  (default 10, max 1000); feedback lists also take `sort` (created |
  datetime) and `order` (asc | desc). `_meta` carries has_more, next,
  previous, count and total.
  - **Filters.** Feedback lists accept Mopinion filter expressions as a
  `filters` record, e.g. `{"<<nps": 5}` or `{"date_from": "2026-01-01"}`;
  keys are date, rating, nps, ces, ces_inverse, gcr and tags, with the
  modifiers !, <, <<, > and >>. Ignored filters are reported in
  `_meta.warnings`.
  - **Errors.** Failures are RFC 7807 problem documents
  (`{status, error_code, title, type}`); the error message carries the
  status, the `error_code` (18 is invalid credentials) and the title.
  - **Known server issue.** `GET /deployments` answered Mopinion's own 500
  "Server error" on every API version for the trial account on 2026-11-24;
  reading one deployment by its key works.
examples:
  read:
    path: account.get
    title: Read the account data
    args: {}
apiExamples:
  account.get: {}
  datasets.get:
    call: "{ datasetId: '12345' }"
  datasets.fields:
    call: "{ datasetId: '12345' }"
  datasets.feedback:
    call: "{ datasetId: '12345', page: 1, limit: 100, filters: { '<<nps': 5, date_from: '2026-01-01' } }"
  datasets.feedbackItem:
    call: "{ datasetId: '12345', feedbackId: '987654' }"
  deployments.list:
    call: "{ page: 1, limit: 20 }"
  deployments.get:
    call: "{ deploymentId: 'a1B2c3D4e5f6' }"
  reports.get:
    call: "{ reportId: '42' }"
  reports.fields:
    call: "{ reportId: '42' }"
  reports.feedback:
    call: "{ reportId: '42', page: 1, limit: 100, sort: 'datetime', order: 'desc' }"
  reports.feedbackItem:
    call: "{ reportId: '42', feedbackId: '987654' }"
apiNotes:
  account.get: |
    `GET /account`. Returns the account data behind the signed credentials.
  datasets.feedback: |
    `GET /datasets/{datasetId}/feedback` with page, limit (max 1000), sort
    (created | datetime), order (asc | desc) and `filters`. Pagination state
    arrives in `_meta` (has_more, next, previous, count, total).
  reports.feedback: |
    `GET /reports/{reportId}/feedback`. Same paging and filtering behaviour
    as the dataset feedback list.
  deployments.list: |
    `GET /deployments` with page and limit. A deployment is the container
    that publishes feedback forms on a website or in an app.
  datasets.feedbackItem: |
    `GET /datasets/{datasetId}/feedback/{feedbackId}`. Mopinion answers with
    the same `{ data: [item], _meta }` envelope as the list.
