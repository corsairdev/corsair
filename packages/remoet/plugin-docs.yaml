displayName: Remoet
description: Read and manage a Remoet user's career profile (work experience, projects, education, visibility) and feed, look up what Remoet knows about a job page, search jobs and companies, and star or save jobs. Remoet is an AI-agent-first tech job platform for tracking tech jobs from companies you love.
examples:
  read:
    path: jobs.search
    title: Search open jobs
    args:
      searchQuery: typescript
      remotePolicy:
        - remote
      pageSize: 5
  write:
    path: workExperience.create
    title: Add a work experience entry
    args:
      title: Senior Engineer
      companyName: Acme
      startDate: '2023-04-01'
      technologies:
        - TypeScript
        - Go
