displayName: Proofly
description: Read Proofly campaigns, their notifications and stats, the leads a notification collected, the signed-in user and activity logs, and turn campaigns on or off.
domain: proofly.io
recommendedAuth: api_key
overviewNote: |
  Auth is the X-Api-Key header on https://proofly.io/api; copy the key from proofly.io/developers while logged in. Free accounts get 10 requests a minute; core retries a 429. Proofly answers a failure with `{ ok: false, error }`, which the plugin throws.

  Proofly's API has six routes and the plugin covers all of them:

  - **Campaigns.** `campaigns.list` lists them (stored locally). `campaigns.setEnabled` turns one on or off. Proofly's own call is a flip, so the plugin reads the current state first and sends nothing when it already matches (`changed: false`).
  - **Notifications.** `notifications.list` returns a campaign's notifications with their settings and impressions, hovers, clicks and leads. `notifications.getData` returns what a notification collected: what visitors typed (often an email), their IP, page and location. That data is not stored, and events log only counts.
  - **Account.** `user.get` returns the user (stored without the pixel key) and `activity.list` the login activity (not stored; IPs are not logged).
examples:
  read:
    path: campaigns.list
    title: List campaigns
    args: {}
apiNotes:
  campaigns.setEnabled: |
    PUT /campaign/{campaign_id} flips the campaign. The plugin first reads GET /campaigns and sends the PUT only when the current state differs from `enabled`.
  notifications.list: |
    GET /campaign/{campaign_id}. One entry per notification, with settings and stats.
  notifications.getData: |
    GET /data/{notification_id}. Leads and conversions with visitor input, IP and location. Returned, not stored.
  campaigns.list: |
    Official campaign fields are id, name, domain.domain, domain.subdomains, enabled, and created. id is stored as a decimal string.
  user.get: |
    Official user fields are name, email, meta, impressions, and pixel. The call returns and stores email, name, meta, and impressions. pixel is removed.
  activity.list: |
    Official activity fields are type, ip, and date. The call returns them and stores nothing.
apiExamples:
  campaigns.setEnabled:
    call: "{ campaign_id: 464014, enabled: false }"
  notifications.list:
    call: "{ campaign_id: 464014 }"
  notifications.getData:
    call: "{ notification_id: 745613007 }"
  campaigns.list:
    call: "{}"
  user.get:
    call: "{}"
  activity.list:
    call: "{}"
