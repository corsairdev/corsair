    path: machines.list
    title: List machines
    args: {"limit": 20}
  write:
    path: machines.exec
    title: Run a command in a machine
    args: {"id": "m_k3m7q2abx5wr4hj6zpcnfa2etd", "cmd": "uname -a && nproc", "timeoutSeconds": 60}
