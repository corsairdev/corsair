# Display copy for the docs, the catalog, corsair.dev and Hub, and one call
# example per operation. Generated with the plugin from MongoDB's Atlas Admin API v2 spec;
# docs-examples.test.ts parses every example with its input schema.
displayName: MongoDB Atlas
domain: mongodb.com
description: "The Atlas Administration API v2 (489 operations): organizations, projects, clusters and flex clusters, database users and custom roles, IP access lists, backups, snapshots and restores, Atlas Search indexes and nodes, Stream Processing, Data Federation, online archive, private endpoints and peering, monitoring, logs, performance advisor, alerts, teams, users, service accounts and API keys, invoices and more."
recommendedAuth: api_key
overviewNote: |
  Connect with a service account (Organization > Access Manager >
  Applications > Service Accounts): store it as `clientId:clientSecret`
  (`mdb_sa_id_...:mdb_sa_sk_...`) or as the JSON
  `{ "clientId": "mdb_sa_id_...", "clientSecret": "mdb_sa_sk_..." }`. The plugin trades it at `/api/oauth/token` for a bearer
  token (cached until a minute before it expires). A programmatic API key
  works too, as `publicKey:privateKey`; Atlas wants those with HTTP Digest
  authentication, which the plugin does. Add the IP addresses the calls come
  from to the credential's API access list if your organization requires
  one, and give it the roles the calls need (Organization Owner or Project
  Owner covers most).

  - **Ids.** Atlas calls a project a group: `groupId` is the project id
  (`projects.listGroups`), `orgId` the organization's
  (`organizations.listOrgs`). Clusters, users and indexes go by name.
  - **Versions.** Every Atlas route is versioned by media type; each
  operation is pinned to the newest version the spec offers and sends it as
  `Accept: application/vnd.atlas.<date>+json`.
  - **Lists** page with `pageNum` (1-based) and `itemsPerPage` (the plugin
  sends 100 when it is left out) and return `{ results, totalCount, links }`.
  - **Downloads** (database logs, invoices as CSV) come back as files.
  - **Risk.** Reads are `read`. Deletes, anything that starts billed
  infrastructure (clusters, search nodes, stream workspaces and processors,
  data federation, private endpoints, peering, online archive, snapshots),
  restores, failover and outage tests, invitations, new keys and service
  accounts, and organization-level changes are `destructive`; other writes
  are `write`.
  - Not wrapped: the 53 operations the spec marks deprecated (each has a
  newer replacement in the plugin).
examples:
  read:
    path: clusters.listClusters
    title: List the clusters in a project
    args: {"groupId": "5f43e7f0a1b2c3d4e5f60718"}
  write:
    path: projectIpAccessList.createAccessListEntry
    title: Allow an IP range to reach a project
    args: {"groupId": "5f43e7f0a1b2c3d4e5f60718", "body": [{"cidrBlock": "203.0.113.0/24", "comment": "Office"}]}
