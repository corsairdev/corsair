displayName: Dialpad
description: Manage company calling, users, contacts, messages, routing, reporting, Dialpad Meetings, WFM, and PowerDialer through the documented Dialpad REST APIs.
domain: dialpad.com
recommendedAuth: api_key
overviewNote: |
  Dialpad supports both company API keys and OAuth 2 access tokens. API keys are created by a company admin and sent as Bearer tokens. OAuth applications use Dialpad's authorization-code flow; store the resulting access token with Corsair's `oauth_2` auth type. The OAuth client ID and client secret are application credentials, not an API-key auth method.

  Choose `environment: 'sandbox'` to use Dialpad's documented sandbox host. All operations use HTTPS Bearer authentication. Some operations require additional OAuth scopes or company-admin permissions, as noted in the official API reference.

  List endpoints expose documented cursors as input/output fields; pass the returned cursor to fetch the next page. Async reporting and anonymization operations return request IDs that must be polled with their documented status endpoints. Rate-limit responses preserve Dialpad's `Retry-After` value; the plugin does not automatically retry operations.

  Webhook/event-subscription management, OAuth token lifecycle endpoints, webhook callbacks, and multipart CSV uploads are not exposed. The plugin includes ordinary REST operations that create and manage WebSocket resources, but does not open long-lived event streams.
examples:
  read:
    path: accesscontrolpolicies.assignments
    title: List assignments for an access control policy
    args:
      path:
        id: 1
      query: {}
  write:
    path: accesscontrolpolicies.assign
    title: Assign a user to an access control policy
    args:
      path:
        id: 1
      body:
        user_id: 2
references:
  - title: Dialpad API reference
    url: https://developers.dialpad.com/reference
  - title: API key generation
    url: https://developers.dialpad.com/docs/api-key-generation
  - title: OAuth 2 authentication
    url: https://developers.dialpad.com/docs/oauth
  - title: Rate limits
    url: https://developers.dialpad.com/docs/rate-limits
apiNotes:
  reports.scheduledstats.download: |
    The official Report Download API page does not specify the successful response media type or maximum report size. The plugin returns bytes as `{ kind: 'binary', contentType, base64, sizeBytes }`, with a 25 MiB client safety cap and 20-second timeout. The `t` field currently accepts the only documented report type, `user_voiceline`.
  recordings.call.download: |
    Requires the `recordings_export` scope. The guide documents successful downloads as audio/mpeg; the plugin returns the raw bytes in the same bounded base64 result envelope as report downloads.
  recordings.voicemail.download: |
    Requires the `recordings_export` scope. The guide documents successful downloads as audio/mpeg; the plugin returns the raw bytes in the same bounded base64 result envelope as report downloads.
  recordings.admin_call.download: |
    Admin recordings cannot be downloaded from their browser-only URL. Create a recording share link first and pass its ID here; the plugin returns the bytes in the bounded base64 result envelope.
