displayName: Discord
description: Community chat platform for servers, channels, voice, bots, and real-time group messaging.
examples:
  read:
    path: channels.list
    title: List channels
    args:
      guild_id: "123456789"
  write:
    path: messages.send
    title: Send a message
    args:
      channel_id: "123456789"
      content: Hello from Corsair!
dbExample:
  entity: channels
  note: Search synced channels without hitting Discord.
  limit: 50
exampleWebhook:
  path: interactions.applicationCommand
  note: Fires when a user invokes a slash command or context-menu action.
  after: |
    console.log('Discord application command:', result.data);
