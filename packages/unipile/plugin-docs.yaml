displayName: Unipile
description: LinkedIn outreach through Unipile API v2. Read profiles, send and track invitations, list connections, and run chats on connected LinkedIn accounts, with signed webhooks for accepted invitations, new messages and account status.
domain: unipile.com
recommendedAuth: api_key
overviewNote: |
  Every LinkedIn call takes the `account_id` (acc_…) of a connected account; connect one with `accounts.createAuthLink` (credentials, cookies or the UniLogin extension). LinkedIn limits invitations to roughly 100-200 a week and profile views to about 80-100 a day, and Unipile does not pace sends for you. Sends (`relationRequests.create`, `chats.start`, `messages.send`) are never retried after a timeout or 5xx, so a lost answer cannot cause a duplicate.

  Managing webhook endpoints needs a Unipile **Service API Key**; Account API Keys get `403 api/insufficient_permissions`. Deliveries are verified with the endpoint's signing secret (`unipile-signature` header, HMAC-SHA256 of the raw body), so pass the raw request body to Corsair and set `webhookSecret` (or store the webhook signature) to that secret. Only `webhookEndpoints.create` returns the secret, once; `list`, `get` and `update` report `secret_set` instead, so store it when you create the endpoint.
examples:
  read:
    path: users.getProfile
    title: Look up a LinkedIn profile
    args:
      account_id: acc_9f2c1d7e
      user_id: williamhgates
  write:
    path: relationRequests.create
    title: Send a LinkedIn invitation
    args:
      account_id: acc_9f2c1d7e
      user_id: ACoAAB1cDeFgHiJkLmNoPqRsTuVwXyZ0123456
      message: Hi Maya, I enjoyed your post on field data.
exampleWebhook:
  path: relations.new
  note: Runs when an invitation is accepted. LinkedIn can report it up to 6 hours late.
  after: |
    console.log('New connection', result.data?.payload.user.display_name);
apiExamples:
  accounts.list:
    call: "{ provider: 'linkedin', status: 'running' }"
  accounts.get:
    call: "{ account_id: 'acc_9f2c1d7e' }"
  accounts.remove:
    call: "{ account_id: 'acc_9f2c1d7e' }"
  accounts.createAuthLink:
    call: "{ providers: 'linkedin', redirect_uri: 'https://app.example.com/linkedin/connected', state: 'user_123', config: { linkedin: { allow_methods: ['unilogin', 'credentials'] } } }"
  users.getProfile:
    call: "{ account_id: 'acc_9f2c1d7e', user_id: 'williamhgates', with_sections: ['linkedin_experience'] }"
  users.visitProfile:
    call: "{ account_id: 'acc_9f2c1d7e', token: 'notify-visit-token-from-getProfile' }"
  users.listRelations:
    call: "{ account_id: 'acc_9f2c1d7e', search: 'Maya' }"
  users.getChat:
    call: "{ account_id: 'acc_9f2c1d7e', user_id: 'ACoAAB1cDeFgHiJkLmNoPqRsTuVwXyZ0123456' }"
  users.listReactions:
    call: "{ account_id: 'acc_9f2c1d7e', user_id: 'ACoAAB1cDeFgHiJkLmNoPqRsTuVwXyZ0123456' }"
  users.listComments:
    call: "{ account_id: 'acc_9f2c1d7e', user_id: 'ACoAAB1cDeFgHiJkLmNoPqRsTuVwXyZ0123456' }"
  relationRequests.list:
    call: "{ account_id: 'acc_9f2c1d7e', type: 'received' }"
  relationRequests.create:
    call: "{ account_id: 'acc_9f2c1d7e', user_id: 'ACoAAB1cDeFgHiJkLmNoPqRsTuVwXyZ0123456', message: 'Hi Maya, I enjoyed your post on field data.' }"
  relationRequests.cancel:
    call: "{ account_id: 'acc_9f2c1d7e', request_id: 'inv_7d8e9f' }"
  relationRequests.accept:
    call: "{ account_id: 'acc_9f2c1d7e', request_id: 'inv_7d8e9f' }"
  chats.list:
    call: "{ account_id: 'acc_9f2c1d7e', is_unread: true }"
  chats.get:
    call: "{ account_id: 'acc_9f2c1d7e', chat_id: 'chat_5a6b7c' }"
  chats.start:
    call: "{ account_id: 'acc_9f2c1d7e', users_ids: 'ACoAAB1cDeFgHiJkLmNoPqRsTuVwXyZ0123456', text: 'Thanks for connecting, Maya!' }"
  messages.list:
    call: "{ account_id: 'acc_9f2c1d7e', chat_id: 'chat_5a6b7c' }"
  messages.send:
    call: "{ account_id: 'acc_9f2c1d7e', chat_id: 'chat_5a6b7c', text: 'Does Tuesday at 10 work?' }"
  posts.list:
    call: "{ account_id: 'acc_9f2c1d7e', user_id: 'williamhgates' }"
  posts.listReactions:
    call: "{ account_id: 'acc_9f2c1d7e', post_id: 'urn:li:activity:7250000000000000000' }"
  posts.listComments:
    call: "{ account_id: 'acc_9f2c1d7e', post_id: 'urn:li:activity:7250000000000000000', sort_by: 'MOST_RECENT' }"
  webhookEndpoints.list: {}
  webhookEndpoints.get:
    call: "{ id: 'whe_42' }"
  webhookEndpoints.create:
    call: "{ url: 'https://your-app.example.com/api/webhook', trigger_events: ['relation.new', 'message.new', 'account.status.disconnected'] }"
  webhookEndpoints.update:
    call: "{ id: 'whe_42', enabled: false }"
  webhookEndpoints.delete:
    call: "{ id: 'whe_42' }"
