apiNotes:
  items.filter: "`itemType` is an array of names this organization defines; a bare string is rejected with a 400. Read the valid names with `organization.itemTypes`. Returns external ids only. Use `items.filterDetails` for full records, which caps `limit` at 50."
  items.filterDetails: Returns full item records. OneDesk caps `limit` at 50 on the details variants, against 200 on the id variants.
  items.update: 'Related and assigned lists take a list update object rather than an array: `{ replace: true, newValue: [ids] }` sets the whole list, and `add` or `remove` change it while keeping the rest.'
  timers.start: A timer is identified by the external id you choose, so starting the same id again resumes that timer.
  timers.cancel: Cancels the timer and discards the work recorded in that run; there is no undo.
  attachments.upload: OneDesk takes multipart uploads, so the file is passed as base64 bytes with a filename. There is no import-from-URL endpoint.
  users.create: Creating a user sends them an invitation to the account.
  customers.create: The email is the customer's identity; a second create with the same address fails with ERROR_USER_ALREADY_EXIST.
  projects.update: A lifecycle status name must be one the organization defines; read them with `organization.lifecycleStatus`, which returns objects whose `name` is the value to pass.
  organization.itemTypes: Answers `label` and `externalId` per type, not the `name` field the published spec describes.
  organization.lifecycleStatus: Returns objects with `name`, `externalId` and `state`, not the string array the published spec describes.
