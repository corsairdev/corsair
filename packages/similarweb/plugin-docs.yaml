displayName: Similarweb
description: Digital rank data from Similarweb - a domain's global, country and industry rank, an app's store rank, the top-ranked sites, the category tree, and the account's capabilities and remaining data credits.
domain: similarweb.com
recommendedAuth: api_key
overviewNote: |
  Get an API key from the Similarweb platform under API, then pass it as the plugin's `key` option or store it on the account. Similarweb reads it as the `api_key` query parameter.

  Similarweb has no product called the Digital Rank API; rank data comes from the Website Traffic API (per-domain rank routes), the App Rank route and the Top Sites list. These nine operations are those routes.

  Things to know before you query:

  - **Domains must be bare and lower case.** Send `cnn.com`, not `CNN.COM` and not a URL with a path. Similarweb answers a capitalised domain with a 401 rather than data, so the plugin lower-cases the domain and trims it before sending.
  - **Both dates or neither.** `websites.globalRank` and `websites.countryRank` take `start_date` and `end_date` as `YYYY-MM`. Sending only one is accepted but answered with the default 28-day window, so the schema rejects it instead of returning the wrong months.
  - **Global rank covers desktop and mobile together**, one point per month. There is no desktop-only or mobile-only variant of this route.
  - **Industry rank is a single reading.** It returns the domain's industry and its rank in that industry worldwide, with no date range.
  - **App rank needs a matching store and device.** Use `androidphone` with Google, and `iphone` or `ipad` with Apple. The plugin rejects a mismatched pair, because the API answers it with an empty series rather than an error. Call `apps.describe` for the accepted stores, modes and countries.
  - **Errors are plain text, not JSON.** A 401 is either the literal `invalid API key` (no key or a wrong one) or `Data not found` (a domain it has no data on, or a mistyped one); the plugin treats the second as not-found, not as an auth failure. A 403 means either a bad key or an exhausted credit balance, and Similarweb documents no way to tell them apart. Check `capabilities.get` and `usage.get` before concluding the key is wrong.
  - **Rate limit.** Similarweb allows 10 requests per second per account and answers 429 past it. Core retries those three times with backoff.
  - **Credits.** Most routes cost data credits per result, and `usage.get` itself is free. `usage.get` returns the allowance and what is left; `used` is derived from the two.
examples:
  read:
    path: websites.globalRank
    title: Read a domain's global rank for three months
    args:
      domain: cnn.com
      start_date: '2023-01'
      end_date: '2023-03'
  write:
    path: apps.describe
    title: List the stores and modes app rank accepts
    args: {}
apiExamples:
  websites.globalRank:
    call: "{ domain: 'cnn.com', start_date: '2023-01', end_date: '2023-03' }"
  websites.countryRank:
    call: "{ domain: 'cnn.com', country: 'us', start_date: '2023-01', end_date: '2023-03' }"
  websites.industryRank:
    call: "{ domain: 'amazon.com' }"
  websites.topSites:
    call: "{ limit: 25 }"
  apps.rank:
    call: "{ store: 'Google', app_id: 'com.whatsapp', country: 'us', mode: 'free', device: 'androidphone', duration: 30 }"
  apps.describe: {}
  categories.list: {}
  capabilities.get: {}
  usage.get: {}
apiNotes:
  websites.globalRank: 'Send both start_date and end_date, or neither for the last 28 days. One without the other is answered with the default window.'
  websites.countryRank: 'The country must be one the subscription includes; capabilities.get lists them. Worldwide is not supported here; use websites.globalRank.'
  apps.rank: 'device must match store: androidphone for Google, iphone or ipad for Apple. Call apps.describe for the valid mode values.'
  categories.list: 'Each child maps to the Parent~Child slug the rank routes accept. Some top-level categories have no children.'
  capabilities.get: 'Check this before concluding a 403 means the key is wrong: 403 also means the account is out of data credits.'
  usage.get: 'Costs no credits. Returns allowance and user_remaining; used is derived from the two.'
