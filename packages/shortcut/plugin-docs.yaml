displayName: Shortcut
description: Manage Shortcut stories, epics, projects, workflows, labels, documents, and workspace resources through the REST API v3.
domain: api.app.shortcut.com
recommendedAuth: api_key
overviewNote: >-
  Store a Shortcut API token as the API key. Requests use the Shortcut-Token header; deprecated token query authentication is not used. Shortcut permits 200 requests per minute, and the shared transport honors Retry-After on 429 responses. Webhook receivers and webhook-integration management routes are not included.
apiNotes:
  'createDoc.post': 'Shortcut defaults document content to HTML when `content_format` is omitted; set it to `markdown` when sending Markdown.'
  'getDoc.get': 'Use `content_format: html` to include HTML content; the default response format is Markdown.'
  'updateDoc.put': 'Shortcut defaults document content to HTML when `content_format` is omitted. Set `markdown` when writing Markdown content.'
  'listEpicsPaginated.get': 'This route supports `page` and `page_size`; values are forwarded without local pagination defaults.'
  'search.get': 'Continuation pagination uses the documented `next` query value and `page_size`.'
  'searchDocuments.get': 'Continuation pagination uses the documented `next` query value and `page_size`.'
  'searchEpics.get': 'Continuation pagination uses the documented `next` query value and `page_size`.'
  'searchIterations.get': 'Continuation pagination uses the documented `next` query value and `page_size`.'
  'searchMilestones.get': 'Continuation pagination uses the documented `next` query value and `page_size`.'
  'searchObjectives.get': 'Continuation pagination uses the documented `next` query value and `page_size`.'
  'searchStories.get': 'Continuation pagination uses the documented `next` query value and `page_size`.'
  'listGroupStories.get': 'This route supports `limit` and `offset` pagination.'
  'uploadFiles.post': 'Provide at least `file0`; `file1` through `file3` are optional multipart file fields.'
