  teams.getMaxMetrics:
    call: '{"path":{"teamID":"test"},"query":{"start":0,"end":0,"metric":"concurrent_sandboxes"}}'
  secrets.list:
    call: '{"query":{"nextToken":"test","limit":100}}'
  secrets.create:
    call: '{"body":{"name":"test","value":"test"}}'
  secrets.get:
    call: '{"path":{"secretID":"test"}}'
  secrets.update:
    call: '{"path":{"secretID":"test"},"body":{"value":"test"}}'
  secrets.delete:
    call: '{"path":{"secretID":"test"}}'
  events.listBySandbox:
    call: '{"path":{"sandboxID":"test"},"query":{"offset":0,"limit":10,"orderAsc":false,"types":["test"]}}'
  events.list:
    call: '{"query":{"offset":0,"limit":10,"orderAsc":false,"types":["test"]}}'
apiNotes:
  sandboxes.create: "metadata and envVars are string maps; mcp is an extensible JSON object, as specified by E2B's OpenAPI."
  sandboxes.list: "The v2 list operation accepts state as a comma-separated array and returns `{ items, nextToken?, totalRunning? }`; pass nextToken as query.nextToken to continue."
  sandboxes.listSnapshots: "Returns `{ items, nextToken? }`; pass X-Next-Token as query.nextToken to continue."
  templates.list: "Returns `{ items, nextToken? }`; pass X-Next-Token as query.nextToken to continue."
  templates.get: "Returns the template and its build page, including nextToken from X-Next-Token; pass it as query.nextToken to continue."
  secrets.list: "Returns `{ items, nextToken? }`; pass X-Next-Token as query.nextToken to continue. The response never includes secret values."
  templates.getBuildUploadLink: "Returns an upload URL and headers for a template build file. Treat the response as a short-lived capability; avoid logging it."
  envd.getEnvironmentVariables: "Requires an E2B sandbox access token; the response contains environment values and should be handled as sensitive data."
  secrets.create: "Secret values are accepted only on create/update and are never returned by list/get operations."
  process.sendInput: "stdin and pty bytes use the Connect JSON base64 representation; encode the bytes before passing the string."
  filesystem.createWatcher: "This is the unary watcher-creation operation; streaming WatchDir remains out of scope."
