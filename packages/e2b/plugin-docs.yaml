    call: '{"body":{"name":"test","tags":["test"]}}'
  tags.list:
    call: '{"path":{"templateID":"test"}}'
  tags.listGroups:
    call: '{"path":{"templateID":"test"},"query":{"assignmentLimit":6,"tagsLimit":25,"tagsCursor":"test","search":"test","sort":"latest_desc"}}'
  tags.count:
    call: '{"path":{"templateID":"test"}}'
  tags.exists:
    call: '{"path":{"templateID":"test"},"query":{"tag":"test"}}'
  tags.listAssignments:
    call: '{"path":{"templateID":"test","tag":"test"},"query":{"cursor":"test","limit":50}}'
  volumes.list:
    call: '{}'
