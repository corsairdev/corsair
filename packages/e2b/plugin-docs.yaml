displayName: "E2B"
description: "Run isolated sandboxes and manage E2B sandbox, template, volume, secret, filesystem, process, and event APIs from Corsair."
domain: e2b.dev
recommendedAuth: api_key
examples:
  read:
    path: envd.getEnvironmentVariables
    title: Read the environment of a sandbox
    args:
      headers:
        e2bSandboxId: sandbox-test
        e2bSandboxPort: 49983
        e2bAccessToken: sandbox-access-token
  write:
    path: filesystem.createDir
    title: Create a directory inside a sandbox
    args:
      headers:
        e2bSandboxId: sandbox-test
        e2bSandboxPort: 49983
        e2bAccessToken: sandbox-access-token
      body:
        path: /tmp/corsair-e2b
overviewNote: |
  Platform operations use the project API key in the X-API-Key header. Sandbox envd and unary filesystem/process operations target the shared sandbox host and require e2bSandboxId, e2bSandboxPort (49983 for envd), and an e2bAccessToken where the official OpenAPI security scheme requires it. envd.health is keyless. The documented file upload/download routes are not included because they require raw file bodies or binary responses.

  Four cursor-paginated collection-list operations return `{ items, nextToken? }`; pass the returned token as `query.nextToken` to fetch the next page. `templates.get` returns its build cursor beside the template data. Sandbox listing also returns `totalRunning` when E2B supplies it. Secret values are write-only and are redacted from errors and never included in event logs.
apiExamples:
  sandboxes.create:
    call: '{"headers":{"idempotencyKey":"test"},"body":{"templateID":"test"}}'
  sandboxes.list:
    call: '{"query":{"metadata":"test","state":["running"],"order":"desc","startedAfter":"2026-01-01T00:00:00Z","template":"test","nextToken":"test","limit":100}}'
  sandboxes.listMetrics:
    call: '{"query":{"sandbox_ids":["test"]}}'
  sandboxes.getLogs:
    call: '{"path":{"sandboxID":"test"},"query":{"cursor":0,"limit":1000,"direction":"forward","level":"test","search":"test"}}'
  sandboxes.get:
    call: '{"path":{"sandboxID":"test"}}'
  sandboxes.kill:
    call: '{"path":{"sandboxID":"test"}}'
  sandboxes.getMetrics:
    call: '{"path":{"sandboxID":"test"},"query":{"start":0,"end":0}}'
  sandboxes.pause:
