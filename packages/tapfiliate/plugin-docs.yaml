displayName: Tapfiliate
description: Affiliate and partner program management with Tapfiliate - create and list affiliates, add them to programs and approve them, track conversions and customers, approve or disapprove commissions, and record payments.
domain: tapfiliate.com
recommendedAuth: api_key
overviewNote: |
  Create a key in Tapfiliate under Settings, API. Every request sends it as `X-Api-Key`. A key created for a team member only sees what that member's permissions allow.

  Things to know before you call:

  - **At least one tracking reference.** `conversions.create`, `customers.create` and `clicks.create` attribute a record through a coupon, click ID, referral code, asset ID or tracking ID. The plugin rejects a call with none of them before sending, and rejects `source_id` without `asset_id`.
  - **Ranking when several are sent.** Tapfiliate uses only the highest-precedence reference: coupon, then click ID, then referral code, then asset ID with source ID, then tracking ID.
  - **A conversion creates commissions.** `conversions.create` creates the regular commission and any MLM level commissions. If you pass `commissions`, their `sub_amount`s must add up to `amount`, and you get one commission per entry instead of the program's default.
  - **Converting an amount does not move the commission.** `conversions.update` changes `amount` only. Commission amounts change when the call also sends `recalculate_commissions: true`, which travels as a query flag.
  - **A generated password is shown once.** `affiliates.create` returns `password` when you did not supply one. It is the only way into the new account, so store it.
  - **An incomplete address is dropped silently.** Tapfiliate keeps an address only when `address`, `postal_code`, `city` and `country.code` are all present. The plugin requires them together.
  - **Approval defaults to yes.** `programs.addAffiliate` approves unless you send `approved: false` for disapproved or `approved: null` for pending, and it ignores the program's auto-approve setting.
  - **Coupon updates are three-way.** In `programs.updateAffiliate`, `coupon: null` removes the coupon, a string replaces it, and leaving the field out changes nothing.
  - **Deletes.** A 204 answers with no body, so the delete endpoints report `{ success: true }`. `payments.cancel` is a DELETE route but only cancels the payment, and `customers.cancel` stops recurring commissions; both can be undone, unlike the real deletes.
  - **Paging is by page number.** Lists return 25 items per page and put the next page in the `Link` header, which the plugin cannot read with the body, so pass `page` yourself and keep requesting until a page comes back short.
  - **Rate limits and plans.** Limits range from 10 to 1500 requests per window per key and endpoint. A 429 carries no `Retry-After`; the plugin retries three times with backoff. Click routes need the click-report feature, and affiliate groups need a plan that includes them, or they answer 403.
examples:
  read:
    path: affiliates.list
    title: List the first page of affiliates
    args:
      page: 1
  write:
    path: programs.addAffiliate
    title: Add an affiliate to a program and approve it
    args:
      programId: '1'
      affiliateId: jane-jameson
      coupon: JANE10OFF
apiExamples:
  affiliates.list:
    call: "{ page: 1, email: 'jane@example-blog.inc' }"
  affiliates.get:
    call: "{ affiliateId: 'jane-jameson' }"
  affiliates.create:
    call: "{ email: 'jane@example-blog.inc', firstname: 'Jane', lastname: 'Jameson' }"
  affiliates.delete:
    call: "{ affiliateId: 'jane-jameson' }"
  affiliates.balances:
    call: "{ affiliateId: 'jane-jameson' }"
  affiliates.payments:
    call: "{ affiliateId: 'jane-jameson' }"
  affiliates.programs:
    call: "{ affiliateId: 'jane-jameson' }"
  affiliates.customFields: {}
  programs.list: {}
  programs.get:
    call: "{ programId: '1' }"
  programs.affiliates:
    call: "{ programId: '1', page: 1 }"
  programs.addAffiliate:
    call: "{ programId: '1', affiliateId: 'jane-jameson', coupon: 'JANE10OFF' }"
  programs.getAffiliate:
    call: "{ programId: '1', affiliateId: 'jane-jameson' }"
  programs.updateAffiliate:
    call: "{ programId: '1', affiliateId: 'jane-jameson', coupon: 'JANE20OFF' }"
  programs.approveAffiliate:
    call: "{ programId: '1', affiliateId: 'jane-jameson' }"
  programs.disapproveAffiliate:
    call: "{ programId: '1', affiliateId: 'jane-jameson' }"
  conversions.list:
    call: "{ page: 1, program_id: '1' }"
  conversions.get:
    call: '{ conversionId: 4321 }'
  conversions.create:
    call: "{ click_id: '1-abc', amount: 30.55, currency: 'USD', external_id: 'order-100' }"
  conversions.update:
    call: "{ conversionId: 4321, amount: 40, recalculate_commissions: true }"
  conversions.delete:
    call: '{ conversionId: 4321 }'
  commissions.list:
    call: "{ page: 1, status: 'approved' }"
  commissions.get:
    call: '{ commissionId: 1234 }'
  commissions.update:
    call: "{ commissionId: 1234, amount: 5 }"
  commissions.approve:
    call: '{ commissionId: 1234 }'
  commissions.disapprove:
    call: '{ commissionId: 1234 }'
  customers.list:
    call: "{ page: 1, customer_id: 'cust-1' }"
  customers.get:
    call: "{ customerId: 'cu_123' }"
  customers.create:
    call: "{ customer_id: 'cust-1', referral_code: 'janejameson' }"
  customers.update:
    call: "{ customerId: 'cu_123', customer_id: 'cust-2' }"
  customers.delete:
    call: "{ customerId: 'cu_123' }"
  customers.cancel:
    call: "{ customerId: 'cu_123' }"
  customers.uncancel:
    call: "{ customerId: 'cu_123' }"
  payments.list:
    call: '{ page: 1 }'
  payments.get:
    call: "{ paymentId: 'pa_abc123' }"
  payments.create:
    call: "{ affiliate_id: 'jane-jameson', amount: 30.55, currency: 'USD' }"
  payments.cancel:
    call: "{ paymentId: 'pa_abc123' }"
  balances.list:
    call: '{ page: 1 }'
  clicks.list:
    call: "{ page: 1, program_id: '1' }"
  clicks.create:
    call: "{ referral_code: 'janejameson' }"
  clicks.get:
    call: "{ clickId: '1-abc' }"
apiNotes:
  'conversions.create': 'Send at least one of coupon, click_id, referral_code, asset_id or tracking_id; with commissions, their sub_amount values must add up to amount.'
  'conversions.update': 'recalculate_commissions travels as a query flag and needs a numeric amount; without it the amount changes and the commissions do not.'
  'customers.create': 'customer_id is required and must be unique; at least one tracking reference is required.'
  'clicks.create': 'Returns { id } for use as click_id in conversions.create; ip, user_agent, referrer and landing_page are stored as sent.'
  'affiliates.create': 'A generated password is returned only when you omit password; an address is kept only when address, postal_code, city and country.code are all sent.'
  'programs.addAffiliate': 'approved defaults to true, false disapproves and null leaves the affiliate pending; the program auto-approve setting is not applied.'
  'programs.updateAffiliate': 'coupon null removes the coupon, a string replaces it, and omitting the field changes nothing.'
  'payments.cancel': 'A DELETE route that cancels the payment and raises the affiliate balance again; it does not reverse a payout made outside Tapfiliate.'
  'clicks.list': 'Requires the click-report feature on your plan, otherwise 403.'
