displayName: Hub Planner
description: "Resource scheduling, project planning, timesheet tracking, and team capacity management."
domain: hubplanner.com
recommendedAuth: api_key
overviewNote: |
  Hub Planner API access is available to account administrators. Generate an API key from **Settings → API** in your Hub Planner account.
  Authentication uses an HTTP `Authorization` header containing the raw API key without any prefix (no `Bearer` keyword).
apiNotes:
  projects.create: "Project `name` is required. Optional properties like `budgetHours` and `budgetCashAmount` configure budget limits."
  projects.update: "Bulk update accepts an array of project objects, each requiring `_id` and the attributes to be modified."
  bookings.create: "Requires `resource`, `project`, `start`, and `end` dates (YYYY-MM-DD). Use `allowOverschedule: true` to bypass schedule warning thresholds."
  bookings.patch: "Used for partial updates or for approving/rejecting booking requests with `type: 'APPROVED'` or `'REJECTED'`."
  timeEntries.create: "Requires `resource`, `project`, `date` (YYYY-MM-DD), and `minutes`."
  categories.create: "Requires `groupId` and `name`. Setting `type: 'NON_OPTIONAL'` sets the category as default for that group."
  customFields.create: "`entityType` must be either `'project'` or `'resource'`. Requires `type` (e.g., `'TEXT'`, `'select'`) and `label`."
  milestones.create: "Requires `name`, `date` (YYYY-MM-DD), and `project`."
  events.create: "Requires event `name`. Color and metadata custom fields are optional."
