displayName: CommCare
description: Global health data collection platform with CommCare HQ - list and read submitted forms and cases, manage mobile workers and groups, pull report data and lookup tables, submit XForms and run bulk form actions.
domain: commcarehq.org
recommendedAuth: api_key
overviewNote: |
  Generate an API key in CommCare HQ under Account Settings, API Keys (the key belongs to your CommCare username). Because ApiKey auth is user-scoped, every operation takes the project `domain` and that `username` as inputs. Things to know before you call:

  - **API access needs a plan.** The CommCare APIs require a Standard plan or above.
  - **Every endpoint is scoped to one project.** All requests go to `https://www.commcarehq.org/a/{domain}/...`. There is no plugin-level `domain` or `username` option: pass both on every call.
  - **Two pagination styles.** Most listings use `limit` and `offset` with a `meta.total_count`; `cases.list` pages oldest-to-newest by cursor: pass the `nextCursor` it answers as `cursor` until `nextCursor` is absent.
  - **Async bulk actions.** `forms.bulkAction` accepts up to 5000 form ids for archive, unarchive or permanent delete, and answers a job id; follow with `forms.bulkActionStatus` until status is `complete` or `failed`. `complete` does not mean every form succeeded: compare `succeeded` with `requested` and read `skipped`. A form must be archived before it can be deleted.
  - **Writes.** `submissions.submit` posts OpenRosa XForm XML to the receiver. HQ answers 201 even when it could not process the form; the call fails in that case (nature `submit_error` or `processing_failure`) and otherwise returns the `message` and its `nature`. `users.create` provisions a worker account with an initial password.
  - **Delete is permanent.** `users.delete` removes a worker account, and `forms.bulkAction` with action `delete` permanently removes forms.
  - **OTA restore auth.** `ota.restore` pulls the full case-restore XML. The docs show worker Basic credentials, but HQ also accepts the ApiKey header and restores the account that owns the key, so a web user's key returns that user's restore, not a mobile worker's. HQ puts the owner's password hash in the restore's registration block; the plugin replaces it with `[removed]` before returning the XML.
examples:
  read:
    path: cases.list
    title: List open cases of a type
    args:
      username: jdoe@my-project.commcarehq.org
      domain: my-project
      caseType: patient
      closed: false
  write:
    path: users.create
    title: Add a mobile worker
    args:
      username: jdoe@my-project.commcarehq.org
      domain: my-project
      workerUsername: new.worker@my-project.commcarehq.org
      password: change-me-1
      firstName: Jordan
      lastName: Lee
apiExamples:
  forms.list:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', limit: 100, offset: 0 }"
  forms.get:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', formId: '66d7a362-18a2-4f45-bd84-06f19b408d64' }"
  forms.bulkAction:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', action: 'archive', formIds: ['3a1b...', '9c4d...'] }"
  forms.bulkActionStatus:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', actionId: '0f3a9c' }"
  cases.list:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', caseType: 'patient', closed: false }"
  cases.get:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', caseId: '8f8fd909-684f-402d-a892-f50e607fffef' }"
  cases.bulkFetch:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', caseIds: ['abc123', 'def456'], fields: ['case_id'] }"
  cases.getByExternalId:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', externalId: '1' }"
  users.list:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', limit: 50 }"
  users.get:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', userId: '3c5a623af057e23a32ae4000cf291339' }"
  users.create:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', workerUsername: 'new.worker@my-project.commcarehq.org', password: 'change-me-1', firstName: 'Jordan', lastName: 'Lee' }"
  users.update:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', userId: '3c5a623af057e23a32ae4000cf291339', phoneNumber: '+15551234567' }"
  users.delete:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', userId: '3c5a623af057e23a32ae4000cf291339' }"
  users.sendPasswordReset:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', userId: '3c5a623af057e23a32ae4000cf291339' }"
  groups.list:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project' }"
  groups.get:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', groupId: '91da6b1c78699adfb8679b741caf9f00' }"
  groups.create:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', name: 'Field team A' }"
  groups.update:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', groupId: '91da6b1c78699adfb8679b741caf9f00', reporting: true }"
  webUsers.list:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project' }"
  locations.list:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', locationTypeCode: 'clinic' }"
  locations.get:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', locationId: '68e65fbc2dc840ff8bf03849e57aca88' }"
  locationTypes.list:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project' }"
  locationTypes.get:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', typeId: 1 }"
  fixtures.list:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', fixtureType: 'city' }"
  fixtures.getItem:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', itemId: '1J9NF7B4FT' }"
  lookupTables.list:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project' }"
  lookupTables.get:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', tableId: 'bcf49791f7f04f09bd46262097e107f2' }"
  reports.list:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project' }"
  reports.getData:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', reportId: '9aab0eeb88555a7b4568676883e7379a', offset: 0, limit: 50 }"
  ota.restore:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project' }"
  submissions.submit:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project', appId: '952a0b480c7c10dde777b2485375d2237', xml: '<xform>...</xform>' }"
  detExports.list:
    call: "{ username: 'jdoe@my-project.commcarehq.org', domain: 'my-project' }"
