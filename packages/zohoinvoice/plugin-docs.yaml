displayName: Zoho Invoice
description: Manage invoices, customers, items, payments, and estimates.
overviewNote: |
  Zoho Invoice uses regional datacenters. Pass `region` (`us` default, plus
  `eu`, `in`, `au`, `jp`, `ca`, `cn`, `sa`) so the plugin targets the right
  `accounts.zoho.*` and `www.zohoapis.*` hosts:

  ```ts
  zohoinvoice({ region: 'eu' })
  ```

  Most API calls are organization-scoped. Pass `organization_id` on every
  request. OAuth tenant linking resolves the default organization during
  connection setup; it does not auto-fill endpoint inputs.
