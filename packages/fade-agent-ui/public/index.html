<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fade Agent</title>
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
<!-- ── Sidebar ─────────────────────────────── -->
<aside id="sidebar">
  <div class="sidebar-header">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="4" stroke="#a78bfa" stroke-width="1.8"/><path d="M8 12h8M12 8v8" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Assets</span>
    <button id="btn-refresh-assets" class="icon-btn" title="Refresh">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 018-8 8 8 0 016.93 4M20 12a8 8 0 01-8 8 8 8 0 01-6.93-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 4v4h-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div id="asset-list"></div>

  <div id="drop-zone">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M12 16V8m0 0l-3 3m3-3l3 3" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round"/><rect x="3" y="3" width="18" height="18" rx="4" stroke="#a78bfa" stroke-width="1.4" stroke-dasharray="4 3"/></svg>
    <p>Drop files here<br/><span>or click to upload</span></p>
    <input type="file" id="file-input" multiple accept="video/*,image/*,audio/*" />
  </div>
</aside>

<!-- ── Main chat ───────────────────────────── -->
<main id="main">
  <header id="topbar">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 3l14 9-14 9V3z" fill="#a78bfa"/></svg>
      <span>Fade <em>Agent</em></span>
    </div>
    <div class="topbar-actions">
      <span id="status-dot" class="dot idle"></span>
      <span id="status-text">Idle</span>
      <button id="btn-preview" class="pill-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M10 8l6 4-6 4V8z" fill="currentColor"/></svg>
        Preview
      </button>
      <button id="btn-clear" class="pill-btn ghost">Clear</button>
    </div>
  </header>

  <div id="chat-window">
    <div class="welcome">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><path d="M5 3l14 9-14 9V3z" fill="url(#g1)"/><defs><linearGradient id="g1" x1="5" y1="3" x2="19" y2="21" gradientUnits="userSpaceOnUse"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs></svg>
      <h2>Fade Agent</h2>
      <p>Tell me what video to create, or ask me to edit the timeline.</p>
      <div class="chips">
        <button class="chip" data-prompt="Show me the current timeline state">📋 Timeline state</button>
        <button class="chip" data-prompt="List all assets in the library">🎬 Library assets</button>
        <button class="chip" data-prompt="Add a dissolve transition between all clips">✨ Add transitions</button>
        <button class="chip" data-prompt="Show me a preview of the current project">👁 Preview</button>
      </div>
    </div>
  </div>

  <div id="input-bar">
    <textarea id="msg-input" placeholder="Ask Fade Agent anything…" rows="1"></textarea>
    <button id="btn-send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
