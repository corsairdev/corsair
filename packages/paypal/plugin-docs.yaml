# Display copy for the docs, the catalog, corsair.dev and Hub, and one call
# example per operation. Generated with the plugin from PayPal's OpenAPI specs;
# docs-examples.test.ts parses every example with its input schema.
displayName: PayPal
domain: paypal.com
description: "PayPal REST APIs: Checkout orders (create, authorize, capture, track), payments (authorizations, captures, refunds), invoices and templates, subscriptions and billing plans, catalog products, payouts, disputes, vaulted payment tokens, transaction search and balances, shipment tracking, partner referrals, web experience profiles and webhook management, plus verified webhooks for every event type (114 operations)."
recommendedAuth: api_key
overviewNote: |
  Each account stores a PayPal app's client id as `client_id` and its secret
  as the key (developer.paypal.com → Apps & Credentials). The plugin trades
  them for an access token (OAuth client credentials) and reuses it until it
  nears expiry. Sandbox and live apps are separate: set `environment` to
  `sandbox` or `live`, or leave it empty and the plugin tries live first and
  falls back to sandbox when live doesn't know the client id.

  - **Money moves only in `destructive` operations**: capturing, authorizing,
  reauthorizing and voiding payments, refunds, payouts, subscription
  captures, cancellations, suspensions and revisions, sending and reminding
  invoices, recording payments and refunds, and every dispute action
  (accepting a claim refunds the buyer). Deletes are `destructive` too.
  Creating an order or an invoice draft moves nothing.
  - **Idempotency.** Writes take `paypal_request_id` (the PayPal-Request-Id
  header); repeat a call with the same id and PayPal returns the first
  result instead of acting twice. `prefer: "return=representation"` returns
  the full resource.
  - **Partial updates** (`orders.update`, `plans.update`,
  `subscriptions.update`, `products.update`, `disputes.update`,
  `webProfiles.update`) take `patch`, a JSON Patch list such as
  `[{ "op": "replace", "path": "/description", "value": "..." }]`, and answer
  204 as `{ success: true }`.
  - **Dispute evidence** goes as a multipart form: the `input` field is the
  JSON part (evidences, notes) and the document fields take a file.
  - **Webhooks.** Create one with `webhooks.create` (your Corsair webhook URL
  and the event types) and give the plugin its id as `webhookId` (or store it
  as the account's webhook signature). Each delivery is checked offline
  against PayPal's certificate (PAYPAL-CERT-URL, which must be on paypal.com)
  and that webhook id, then routed by `event_type` to `checkoutOrder`,
  `paymentCapture`, `paymentAuthorization`, `sale`, `subscription`, `plan`,
  `invoice`, `dispute`, `payout`, `vault`, `catalogProduct` or `other`.
  `webhooks.verifySignature` does the same check through PayPal's API.
examples:
  read:
    path: orders.get
    title: Get an order
    args: {"id": "5O190127TN364715T"}
  write:
    path: orders.create
    title: Create an order
    args: {"intent": "CAPTURE", "purchase_units": [{"reference_id": "order-1001", "amount": {"currency_code": "USD", "value": "49.00"}}], "paypal_request_id": "7b92603e-77ed-4896-8e78-5dea2050476a"}
