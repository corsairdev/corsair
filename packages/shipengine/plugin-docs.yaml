displayName: "ShipStation API (formerly ShipEngine)"
description: "Access the ShipEngine REST API, now branded ShipStation API, with strict request and response validation for shipping operations."
overviewNote: "ShipEngine is now branded ShipStation API; the provider explicitly states the ShipEngine endpoints remain unchanged. This Corsair plugin keeps the shipengine slug. Store a server-side API key in the tenant key store (API-Key header), and choose apiRegion eu only for accounts using the official EU service host."
apiNotes:
  "account.deleteAccountImageById": "Delete Account Image By Id deletes, disconnects, cancels, or otherwise changes an account resource in a way that may be difficult to reverse. Verify the target before calling."
  "batches.deleteBatch": "Delete Batch By Id deletes, disconnects, cancels, or otherwise changes an account resource in a way that may be difficult to reverse. Verify the target before calling."
  "batches.processBatch": "Process Batch ID Labels purchases one or more carrier labels and can incur shipping charges. ShipStation wallet-carrier costs are deducted from the account balance; merchant carrier accounts follow carrier billing terms. Verify the rate before using a production key."
  "carriers.disconnectCarrierById": "Disconnect Carrier by ID deletes, disconnects, cancels, or otherwise changes an account resource in a way that may be difficult to reverse. Verify the target before calling."
  "carriers.addFundsToCarrier": "Add Funds To Carrier transfers money into a carrier or Shipsurance balance. Confirm the amount and funding account before using a production key."
  "carrierAccounts.disconnectCarrier": "Disconnect a carrier deletes, disconnects, cancels, or otherwise changes an account resource in a way that may be difficult to reverse. Verify the target before calling."
  "insurance.disconnectInsurer": "Disconnect a Shipsurance Account deletes, disconnects, cancels, or otherwise changes an account resource in a way that may be difficult to reverse. Verify the target before calling."
  "insurance.addFundsToInsurance": "Add Funds To Insurance transfers money into a carrier or Shipsurance balance. Confirm the amount and funding account before using a production key."
  "labels.createLabel": "Purchase Label purchases one or more carrier labels and can incur shipping charges. ShipStation wallet-carrier costs are deducted from the account balance; merchant carrier accounts follow carrier billing terms. Verify the rate before using a production key."
  "labels.createLabelFromRate": "Purchase Label with Rate ID purchases one or more carrier labels and can incur shipping charges. ShipStation wallet-carrier costs are deducted from the account balance; merchant carrier accounts follow carrier billing terms. Verify the rate before using a production key."
  "labels.createLabelFromRateShopper": "Purchase Label from Rate Shopper purchases one or more carrier labels and can incur shipping charges. ShipStation wallet-carrier costs are deducted from the account balance; merchant carrier accounts follow carrier billing terms. Verify the rate before using a production key."
  "labels.createLabelFromShipment": "Purchase Label with Shipment ID purchases one or more carrier labels and can incur shipping charges. ShipStation wallet-carrier costs are deducted from the account balance; merchant carrier accounts follow carrier billing terms. Verify the rate before using a production key."
  "labels.createReturnLabel": "Create a return label purchases one or more carrier labels and can incur shipping charges. ShipStation wallet-carrier costs are deducted from the account balance; merchant carrier accounts follow carrier billing terms. Verify the rate before using a production key."
  "packageTypes.deletePackageType": "Delete A Custom Package By ID deletes, disconnects, cancels, or otherwise changes an account resource in a way that may be difficult to reverse. Verify the target before calling."
  "packagePickups.schedulePickup": "Scheduling a carrier pickup may incur a carrier fee. Confirm pickup details and carrier charges before using a production key."
  "packagePickups.deleteScheduledPickup": "Delete a Scheduled Pickup deletes, disconnects, cancels, or otherwise changes an account resource in a way that may be difficult to reverse. Verify the target before calling."
  "shipments.cancelShipments": "Cancel a Shipment deletes, disconnects, cancels, or otherwise changes an account resource in a way that may be difficult to reverse. Verify the target before calling."
  "shipments.untagShipment": "Remove Tag from Shipment deletes, disconnects, cancels, or otherwise changes an account resource in a way that may be difficult to reverse. Verify the target before calling."
  "tags.deleteTag": "Delete Tag deletes, disconnects, cancels, or otherwise changes an account resource in a way that may be difficult to reverse. Verify the target before calling."
  "warehouses.deleteWarehouse": "Delete Warehouse By ID deletes, disconnects, cancels, or otherwise changes an account resource in a way that may be difficult to reverse. Verify the target before calling."
  "account.createAccountImage": "The provider expects image_data as a Base64-encoded string in a JSON body (PNG or JPEG); this is not a multipart upload."
  "downloads.downloadFile": "Binary download uses a custom byte-preserving transport because the shared Corsair JSON transport decodes binary bodies as text. The validated return value is Base64 with a 50 MiB safety limit."
  "tracking.startTracking": "This starts provider tracking subscriptions. Webhook receiving/management remains out of scope; no incoming callback handler is registered by this plugin."
  "tracking.stopTracking": "This stops provider tracking subscriptions. Webhook receiving/management remains out of scope; no incoming callback handler is registered by this plugin."
  "tags.createTagByName": "This path-based tag creation operation is deprecated by ShipEngine; use POST /v1/tags (tags.createTag) instead."
