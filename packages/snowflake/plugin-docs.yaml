displayName: Snowflake
description: "Run SQL on a Snowflake account: submit a statement, fetch one result partition, or cancel execution."
domain: snowflakecomputing.com
recommendedAuth: api_key
examples:
  read:
    path: statements.get
    title: Fetch a result partition
    args:
      statementHandle: 019c06a4-0000-df4f-0000-00100006589e
      partition: 0
  write:
    path: statements.submit
    title: Submit a SQL statement
    args:
      statement: SELECT 1
      timeout: 10
apiExamples:
  statements.submit:
    args:
      statement: SELECT 1
      timeout: 10
      warehouse: COMPUTE_WH
  statements.get:
    args:
      statementHandle: 019c06a4-0000-df4f-0000-00100006589e
      partition: 0
  statements.cancel:
    args:
      statementHandle: 019c06a4-0000-df4f-0000-00100006589e
