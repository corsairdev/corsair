displayName: "Conversion Tools"
description: "Create and manage Conversion Tools file-conversion tasks, uploads, binary downloads, converter discovery, task status, and retention through its REST API."
overviewNote: >-
  Connect each tenant through the connect-link step below before making
  authenticated API calls. The API-key flow does not prompt for credentials on
  a tenant's first request. Base64 download operations return files up to 10
  MiB; use a temporary download link for larger files.
examples:
  read:
    path: files.downloadById
    title: Download a converted file
    args:
      file_id: 0123456789abcdef0123456789abcdef
  write:
    path: tasks.create
    title: Start a conversion task
    args:
      type: convert.xml_to_json
      options:
        file_id: 0123456789abcdef0123456789abcdef
apiExamples:
  conversions.list:
    call: "{ input: 'xml', output: 'json', ai: false }"
  conversions.get:
    call: "{ type: 'convert.xml_to_json' }"
  files.upload:
    call: "{ file: new Blob(['<root />'], { type: 'application/xml' }) }"
  files.getInfo:
    call: "{ file_id: '0123456789abcdef0123456789abcdef' }"
  files.createDownloadLink:
    call: "{ file_id: '0123456789abcdef0123456789abcdef' }"
  files.downloadById:
    call: "{ file_id: '0123456789abcdef0123456789abcdef' }"
  files.downloadFromLink:
    call: "{ download_id: 'abcdef0123456789abcdef0123456789' }"
  files.createUploadSession:
    call: "{ filename: 'source.xml' }"
  files.uploadToSession:
    call: "{ upload_url: 'https://api.conversiontools.io/v1/upload-sessions/session-id', file: new Blob(['<root />'], { type: 'application/xml' }) }"
  tasks.create:
    call: "{ type: 'convert.xml_to_json', options: { file_id: '0123456789abcdef0123456789abcdef' } }"
  tasks.list:
    call: "{ status: 'RUNNING', limit: 20, page: 1 }"
  tasks.get:
    call: "{ task_id: 'fedcba9876543210fedcba9876543210' }"
  tasks.updateRetention:
    call: "{ task_id: 'fedcba9876543210fedcba9876543210', retentionMode: 'standard_24h' }"
  tasks.remove:
    call: "{ task_id: 'fedcba9876543210fedcba9876543210' }"
apiNotes:
  account.getConfig: >-
    These snippets use a single-tenant client. With `multiTenancy: true`, bind a
    tenant first (`const tenant = corsair.withTenant('acme')`) and replace
    `corsair` with `tenant` in the API calls. The converters sit under `data.conversions`
    in the live response. An option's `type` is `'string'`, `'boolean'`, `'enum'`
    or `'number'` today, and the schema also accepts a type the catalog adds later.
  conversions.get: >-
    An option's `type` is `'string'`, `'boolean'`, `'enum'` or `'number'` today,
    and the schema also accepts a type the catalog adds later.
  conversions.list: >-
    An option's `type` is `'string'`, `'boolean'`, `'enum'` or `'number'` today,
    and the schema also accepts a type the catalog adds later.
  files.downloadById: >-
    The JSON/base64 download response is capped at 10 MiB of raw file bytes.
    For larger files, create a temporary download link and have the consumer
    GET `https://api.conversiontools.io/v1/files/{download_id}/download`
    directly without an Authorization header.
  files.downloadFromLink: >-
    The JSON/base64 download response is capped at 10 MiB of raw file bytes.
    For larger files, create a temporary download link and have the consumer
    GET `https://api.conversiontools.io/v1/files/{download_id}/download`
    directly without an Authorization header.
  tasks.create: >-
    Provide exactly one of `file_id` or `url` inside `options`; the plugin
    rejects requests with both or neither. `callbackUrl` is not accepted because
    this plugin does not implement callbacks. The options type remains
    `Record<string, JsonValue>` so converter-specific options stay open-ended.
