apiNotes:
  market.quote: 'A quote with several comma-separated symbols returns a map keyed by symbol rather than one object.'
  market.timeSeries: '`outputsize` caps the candles and `order` sets newest-first or oldest-first. The free plan caps the history depth.'
  market.exchangeRate: 'The symbol is a pair such as EUR/USD, not a single currency.'
  reference.stocks: 'Filter by symbol, exchange, country or type. This route answers without a key.'
  indicators.rsi: 'Each indicator answers its own field names as decimal strings; `rsi` returns `values[].rsi`.'
  indicators.macd: 'Returns `macd`, `macd_signal` and `macd_hist` per candle, all as strings.'
