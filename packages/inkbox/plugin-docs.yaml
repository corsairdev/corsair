# Display copy for the docs, the catalog, corsair.dev and Hub, and one call
# example per operation. Generated with the plugin from Inkbox's OpenAPI
# spec; docs-examples.test.ts parses every example with its input schema.
displayName: Inkbox
domain: inkbox.ai
description: "Give AI agents their own identities: each agent gets an email inbox, and can add a phone number for SMS, MMS and calls, iMessage, WhatsApp and a Slack bot, plus shared contacts with remembered facts, notes, an encrypted credential vault, a public tunnel URL, agent-to-agent (A2A) tasks and hosted agents. Send and read mail, texts and messages, manage numbers, rules and webhooks, and receive signed events for new mail, texts, calls, iMessage, WhatsApp, Slack and A2A (455 operations)."
overviewNote: "Connect with an Inkbox API key (inkbox.ai/console → API keys). An organization admin key reaches every identity; a key scoped to one identity reaches only that identity (some routes, such as avatars, need the identity key). Phone numbers, more identities and custom domains need a paid Inkbox plan. For webhook events, give the plugin the identity's signing key (identities.signingKey.createOrRotate returns it once) as webhookSecret, and subscribe a URL with webhooks.subscriptions.create. Vault secrets are encrypted on the client with the vault key: the API stores and returns ciphertext only."
examples:
  read:
    path: mail.messages.list
    title: List the latest emails in an agent's inbox
    args: {"email_address": "support-agent@inkboxmail.com", "limit": 20}
  write:
    path: mail.messages.send
    title: Send an email from an agent identity
    args: {"email_address": "support-agent@inkboxmail.com", "recipients": {"to": ["ada@example.com"]}, "subject": "Your order has shipped", "body_text": "Hi Ada, your order shipped today. Tracking: 1Z999AA10123456784."}
