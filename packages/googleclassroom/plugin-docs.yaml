displayName: Google Classroom
description: Manage Google Classroom courses, rosters, classwork, submissions, add-ons, guardian links, and notification registrations.
recommendedAuth: oauth_2
overviewNote: |
  This plugin uses Google OAuth 2.0 access tokens. The default consent request uses the narrowest 10-scope set that covers all stable operations; set the plugin's oauthScopes option to an even smaller supported set when a deployment enables only selected operations. Enable the Google Classroom API in the Google Cloud project and complete Google's OAuth app verification where required.

  The plugin includes Google Pub/Sub notification registration create/delete operations, but does not receive Pub/Sub messages. Configure the topic and message consumer separately. No database migration or inbound webhook handler is needed.
apiNotes:
  courses.courseWork.rubrics.list: The pageSize maximum is 1; Google coerces larger values to 1. Continue with nextPageToken when returned.
  registrations.create: A valid Google Cloud Pub/Sub topic must exist and grant Classroom permission to publish. The plugin manages the registration but does not receive messages.
  userProfiles.get: Profile email and photo fields require their corresponding Google OAuth scopes and may be absent when those scopes are not granted.
references:
  - title: Google Classroom REST API
    url: https://developers.google.com/workspace/classroom/reference/rest
  - title: OAuth scopes
    url: https://developers.google.com/classroom/guides/auth
  - title: Google Classroom Discovery document
    url: https://classroom.googleapis.com/$discovery/rest?version=v1
