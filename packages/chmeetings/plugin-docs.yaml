displayName: ChMeetings
description: Church management platform. Manage people, families, groups, organizations, and events, and read attendance, notes, and settings.
domain: chmeetings.com
examples:
  read:
    path: people.list
    title: List people
  write:
    path: people.create
    title: Add a person
    args:
      first_name: Jane
      last_name: Doe
      email: you@example.com
dbExample:
  entity: people
  note: >-
    This table exists, but ChMeetings calls don't fill it yet. This returns only rows
    you have written yourself.
  limit: 50
