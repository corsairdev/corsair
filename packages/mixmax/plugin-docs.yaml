displayName: Mixmax
description: Email productivity platform for Gmail and Outlook with sequences, templates, and automation.
recommendedAuth: managed
examples:
  read:
    path: messages.list
    title: List messages
  write:
    path: messages.create
    title: Create a draft message
    args:
      to:
        - email: customer@example.com
      subject: Hello from Corsair
      body: <p>This is a test email sent via Mixmax.</p>
dbExample:
  entity: messages
  note: Search synced messages without hitting Mixmax's API.
  data:
    state: draft
  limit: 50
exampleWebhook:
  path: example.example
  note: React to Mixmax webhook events.
  after: |
    const data = result.data?.data;
    console.log('Mixmax event:', data);
