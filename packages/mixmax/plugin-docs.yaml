displayName: Mixmax
description: "Send and manage Mixmax emails, run sequences with recipients and folders, organize templates and template folders, track unsubscribes, and read the live engagement feed."
domain: mixmax.com
recommendedAuth: api_key
examples:
  read:
    path: messages.list
    title: List messages
    args:
      limit: 20
      fields: subject,created
  write:
    path: messages.create
    title: Create a draft message
    args:
      to:
        - email: customer@example.com
          name: Customer Example
      subject: Hello from Corsair
      body: <p>This is a draft created via Mixmax.</p>
      trackingEnabled: true
