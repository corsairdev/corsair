displayName: Postiz
description: Social media scheduling API for publishing, scheduling and managing posts across connected channels.
domain: postiz.com
recommendedAuth: api_key
overviewNote: |
  Postiz schedules and publishes to more than thirty social platforms from one place. Create a key in Developer settings and paste it in; it travels in the `Authorization` header with no scheme prefix. A self-hosted instance uses the same API under `/api/public/v1` on its own domain.

  What to know before you publish:

  - **The UI says channel, the API says integration.** Both mean one connected social account, and this plugin uses the API's word.
  - **Three ways to create a post.** `posts.create` takes `type: 'draft'`, which saves without publishing; `'schedule'`, which queues for `date`; or `'now'`, which publishes as soon as Postiz accepts it. A draft may have no channels attached, and anything that will publish needs at least one, which the plugin enforces before sending.
  - **Each platform has its own settings.** A post carries a `settings` object whose `__type` names the platform, and the rest follows that platform's schema. The plugin passes it through rather than guessing the fields.
  - **Threads.** One post item's `value` is an array, so several entries make a thread, and `inter` sets the minutes between them.
  - **Media must be uploaded first.** Reference a file by its uploaded `id` and `path`; a base64 body over 50 MB is rejected with 413.
  - **Rate limit.** The create-post route allows 90 to 100 requests an hour for the whole instance, and scheduling several posts in one request is the way to stay inside it.
  - **Deleting.** `posts.delete` removes every post in the group. A post already published stays live on the platform, because deleting here only forgets it.
  - **Webhooks.** Postiz can notify another system when it publishes, but this plugin does not handle inbound deliveries.
references:
  - title: Postiz Public API
    url: https://docs.postiz.com/public-api/introduction
  - title: Create a post
    url: https://docs.postiz.com/public-api/posts/create
# `status` is an enum, and the validator renders enum members unquoted while
# requiring a quoted string example, so that call lives in `apiExamples` below
# where the argument string is passed through verbatim.
examples:
  read:
    path: integrations.list
    title: List the connected channels
    args: {}
  write:
    path: posts.delete
    title: Delete a post and everyone in its group
    args:
      id: post-123
apiExamples:
  integrations.list:
    call: '{}'
  integrations.isConnected:
    call: '{}'
  integrations.findSlot:
    call: "{ id: 'cm4ean69r0003w8w1cdomox9n' }"
  posts.list:
    call: "{ startDate: '2024-12-01T00:00:00.000Z', endDate: '2024-12-31T23:59:59.000Z' }"
  posts.create:
    call: "{ type: 'schedule', date: '2024-12-14T10:00:00.000Z', shortLink: false, tags: [], posts: [{ integration: { id: 'cm4ean69r0003w8w1cdomox9n' }, value: [{ content: 'Hello from the Postiz API!' }], settings: { __type: 'x', who_can_reply_post: 'everyone' } }] }"
  posts.delete:
    call: "{ id: 'post-123' }"
  posts.changeStatus:
    call: "{ id: 'post-123', status: 'draft' }"
  media.list:
    call: "{ page: 1 }"
  notifications.list:
    call: "{ page: 1 }"
  analytics.platform:
    call: "{ integration: 'cm4ean69r0003w8w1cdomox9n', date: 'last_30_days' }"
