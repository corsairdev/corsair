displayName: Shippo
description: Multi-carrier shipping with Shippo - quote rates across carriers, buy and refund labels, track parcels, declare customs and manage pickup paperwork.
domain: goshippo.com
recommendedAuth: api_key
overviewNote: |
  Shippo authenticates with a token in an `Authorization: ShippoToken <token>` header — not `Bearer`. Create one at https://goshippo.com/user/apikeys/; a token starting `shippo_test_` acts in test mode, where labels are free and carriers are simulated. Every request this plugin sends also carries `SHIPPO-API-VERSION: 2018-02-08`, so behaviour cannot drift to whatever "latest" means.

  Things to know before you ship:

  - **Weights and dimensions are strings.** Shippo types `weight`, `length`, `width` and `height` as decimal strings (`"12"`, `"5.5"`), and the plugin keeps them that way. A number is rejected rather than silently coerced.
  - **Async is the default.** `shipments.create` and `transactions.create` return before the work is done unless you pass `async: false`. A shipment created that way has `status: QUEUED` and no `rates`; read them with `shipments.rates`. A transaction without `label_url` is still being bought.
  - **A label purchase spends money.** `transactions.create` charges the account's carrier for the chosen rate, and `batches.purchase` charges once per shipment. Neither is retried on a 5xx, since the carrier may already have applied it. `refunds.create` is the way back, and the carrier can refuse.
  - **`label_url` expires.** Its `Expires` query parameter is a Unix timestamp; re-read the transaction with `transactions.get` rather than reusing an old URL.
  - **Rate limits are per endpoint and per verb, per minute**, and much tighter in test mode — a list request allows 10 a minute in test, 50 in live. A 429 is retried with a 60-second wait, since every window is a minute.
  - **Auth is checked before routing.** An unknown path answers 401, not 404, so a 401 always means the token.
  - **A bad country is silently truncated.** Shippo accepted `country: "USA"` and stored `US`, answering 201, so the two-letter rule is enforced here instead — a typo fails before it reaches an address you then ship to.
  - **Webhooks carry the whole object.** The body is `{ event, test, data }`, where `data` is the full track, transaction or batch — not a notification pointing at one. Shippo signs nothing and allows no custom header on the subscription, so keep the receiving URL private.
  - **One webhook per label.** Shippo creates a tracking webhook automatically for every label it sells, so `webhooks.list` grows on its own.
examples:
  read:
    path: shipments.list
    title: List recent shipments
    args:
      results: 10
  write:
    path: transactions.create
    title: Buy a label from a rate, waiting for the result
    args:
      rate: ec9f0d3adc9441449c85d315f0997fd5
      async: false
apiExamples:
  addresses.create:
    call: "{ name: 'Shawn Ippotle', street1: '215 Clayton St.', city: 'San Francisco', state: 'CA', zip: '94117', country: 'US' }"
  addresses.validate:
    call: "{ address_id: 'd799c2679e644279b59fe661ac8fa488' }"
  parcels.create:
    call: "{ length: '5', width: '5', height: '5', distance_unit: 'in', weight: '12', mass_unit: 'lb' }"
  shipments.create:
    call: "{ address_from: 'd799c2679e644279b59fe661ac8fa488', address_to: '7c2b6f1e1d0a4f0d9a3b2c1d0e9f8a7b', parcels: [{ length: '5', width: '5', height: '5', distance_unit: 'in', weight: '12', mass_unit: 'lb' }], async: false }"
  shipments.rates:
    call: "{ shipment_id: 'adcfdddf8ec64b84ad22772bce3ea37a' }"
  shipments.ratesInCurrency:
    call: "{ shipment_id: 'adcfdddf8ec64b84ad22772bce3ea37a', currency_code: 'EUR' }"
  rates.get:
    call: "{ rate_id: 'ec9f0d3adc9441449c85d315f0997fd5' }"
  transactions.create:
    call: "{ rate: 'ec9f0d3adc9441449c85d315f0997fd5', label_file_type: 'PDF_4x6', async: false }"
  transactions.get:
    call: "{ transaction_id: '915d94940ea54c3a80cbfa328722f5a1' }"
  refunds.create:
    call: "{ transaction: '915d94940ea54c3a80cbfa328722f5a1', async: false }"
  tracks.get:
    call: "{ carrier: 'usps', tracking_number: '9205590164917312751089' }"
  tracks.register:
    call: "{ carrier: 'usps', tracking_number: '9205590164917312751089', metadata: 'Order 000123' }"
  customsItems.create:
    call: "{ description: 'T-Shirt', quantity: 2, net_weight: '400', mass_unit: 'g', value_amount: '20', value_currency: 'USD', origin_country: 'US' }"
  customsDeclarations.create:
    call: "{ contents_type: 'MERCHANDISE', non_delivery_option: 'RETURN', certify: true, certify_signer: 'Shawn Ippotle', items: ['d799c2679e644279b59fe661ac8fa488'] }"
  batches.create:
    call: "{ default_carrier_account: '078870331023437cb917f5187429b093', default_servicelevel_token: 'usps_priority', batch_shipments: [{ shipment: 'adcfdddf8ec64b84ad22772bce3ea37a' }] }"
  batches.purchase:
    call: "{ batch_id: '0f1e2d3c4b5a69788796a5b4c3d2e1f0' }"
  orders.create:
    call: "{ order_number: '#1068', placed_at: '2026-01-01T00:00:00Z', currency: 'USD', to_address: { name: 'Recipient', country: 'US' }, line_items: [{ title: 'T-Shirt', quantity: 2, total_price: '12.50', currency: 'USD' }] }"
  pickups.create:
    call: "{ carrier_account: '078870331023437cb917f5187429b093', location: { object_id: 'd799c2679e644279b59fe661ac8fa488' }, transactions: ['915d94940ea54c3a80cbfa328722f5a1'], requested_start_time: '2026-07-21T12:00:00Z', requested_end_time: '2026-07-21T18:00:00Z' }"
  carrierAccounts.list:
    call: "{ }"
  parcelTemplates.listCarrier:
    call: "{ }"
  webhooks.create:
    call: "{ url: 'https://myapp.com/webhooks/shippo', event: 'track_updated' }"
exampleWebhook:
  path: notifications.delivery
  note: |
    The body is the object itself, wrapped as `{ event, test, data }` — not a notification you fetch. `event` tells you which schema `data` follows: a track for `track_updated`, a transaction for `transaction_created` and `transaction_updated`, a batch for the two batch events. Shippo signs nothing and allows no custom header on the subscription, so keep the receiving URL private.
  after: "if (result.data?.event === 'track_updated') console.log('track', result.data.data);"
apiNotes:
  addresses.create: "Only `country` is required by the API, but buying a label needs `name` and a street line. An address with `is_complete: false` still gets rates."
  addresses.validate: "Reads `validation_results`: `is_valid` plus the corrections Shippo applied or the parts it could not match."
  parcels.create: "Weight and dimensions are decimal strings, not numbers. Up to four decimal places."
  shipments.create: "Shippo defaults `async` to true, returning before rates exist. Pass `async: false` to get `rates` in the response, or read them later with `shipments.rates`."
  shipments.rates: "Call this after an async create returned `status: QUEUED` with no rates."
  transactions.create: "Spends money on the account's carrier. Pass `async: false` to wait for `label_url`. `label_file_type` takes any of `PNG`, `PNG_2.3x7.5`, `PDF`, `PDF_2.3x7.5`, `PDF_4x6`, `PDF_4x8`, `PDF_A4`, `PDF_A5`, `PDF_A6` or `ZPLII`; omitting it uses the dashboard default. Never retried on a 5xx, because the carrier may already have applied it."
  transactions.get: "`label_url` expires; its `Expires` query parameter is a Unix timestamp. Re-read the transaction instead of reusing an old URL."
  refunds.create: "Asks the carrier to void the label. The carrier can refuse, so the outcome arrives as a `status`, not as a success."
  refunds.list: "This route is `/refunds/` with a trailing slash; `/refunds` answers 404."
  batches.create: "Each shipment needs a carrier and a servicelevel, from the entry or the batch defaults. Those two resolve independently."
  batches.purchase: "Charges once per shipment and answers 202, so the merged label URLs arrive through `batches.get`, one PDF per 100 labels."
  orders.list: "The status filter is sent as `order_status[]`, which Shippo takes as a comma-separated list."
  tracks.register: "Registers a tracking number Shippo has not seen, usually from a label bought elsewhere. `track_updated` webhooks fire for it afterwards."
  webhooks.create: "Shippo signs nothing and allows no custom header, so the receiving URL must be private. One subscription per event, but a label it sells creates its own tracking webhook."
