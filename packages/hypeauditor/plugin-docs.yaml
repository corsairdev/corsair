displayName: HypeAuditor
description: HypeAuditor influencer data - reports, media, audience history, brand mentions, discovery search and saved lists.
domain: hypeauditor.com
recommendedAuth: api_key
overviewNote: |
  HypeAuditor reports on influencer accounts: followers, audience quality, engagement, demographics, brand mentions and growth history. This plugin wraps the v2 API.

  Every request needs **two** credentials, issued together for an API subscription: a Client ID and an API token. Store the API token as the account's API key and the Client ID as its `client_id`. They are sent as `X-Auth-Id` and `X-Auth-Token`. The docs note that the token changes when the account password changes.

  Things to know before you call:

  - **Reports spend credits.** The first request for a creator costs one credit, taken at the moment of the request, before the report exists. A second request for the same creator is free while the report stays unlocked, which is one year: a request after 365 days costs another credit. `type: 'report'` is the mini report and costs a mini-report credit; `advanced_report`, the default, costs a full one. A report may answer with a `202` body carrying `retryTtl`, the seconds to wait before asking again, so the result is either the report or that pending notice.
  - **A failed build is refunded.** If the report cannot be built, the credit is returned, and `account.unlockedReports` shows `refunded: true` for it. That is the read to check when a credit seems to have gone.
  - **Discovery is charged per page, 20 rows at a time.** The result is capped at 10,000 rows, so the highest page is 500. Pass `sandbox: true` to validate a request and get sample data without spending a call.
  - **Discovery filters are passed through.** The docs list 46 filters, each available on a different subset of networks and plans, and the table changes between releases. They go in `filters` unchanged rather than being modelled field by field, so a filter the provider accepts is never refused here. `social_network` and `page` are checked, because the docs give them a fixed set and a maximum.
  - **Media, history, mentions, lists and account reads are free.** They change nothing and are safe to retry, which is what makes them usable while a report is still being built.
  - **The version is pinned.** HypeAuditor's `v` parameter defaults to its latest, and `v=1` was deprecated on 2024-08-01. The plugin sends `v=2` on every call, and a `v` passed by a caller cannot override it.
  - **One route is spelled differently from its docs page.** The YouTube history action is `auditor.youtube.history`, not `auditor.youtubeHistory`: the latter answers `405` with code `3` (`Unknown method passed`). Every other network answers both spellings.
  - **Errors branch on a numeric code.** A failure is `{ error: { code, description } }`. Code `3` means the action name is wrong, `4` means the token is wrong or the account is private or has no posts, and `31` means the account has too few followers. A `402` is an exhausted balance or an expired subscription, which no retry can fix.
  - **The documented limit is just under 100 requests a minute.**
  - **No inbound webhooks.** The API documents none, so this plugin registers no webhook route.
references:
  - title: Authentication, limits, versions and status codes
    url: https://hypeauditor.readme.io/reference/basic
  - title: Discovery search and its filters
    url: https://hypeauditor.readme.io/reference/general_discovery
  - title: Instagram report
    url: https://hypeauditor.readme.io/reference/report_instagram
  - title: Saved lists
    url: https://hypeauditor.readme.io/reference/get_lists
examples:
  read:
    path: media.instagram
    title: Read an account's recent media, which costs nothing
    args:
      channel: nasa
  write:
    path: reports.youtube
    title: Read the YouTube report the docs name for testing (free only with HypeAuditor's sandbox credentials)
    args:
      channel: UCLA_DiR1FfKNvjuUpBHmylQ
apiExamples:
  reports.instagram:
    call: "{ username: 'nasa' }"
  reports.youtube:
    call: "{ channel: 'NASA', type: 'report' }"
  reports.tiktok:
    call: "{ channel: 'littlebig' }"
  reports.twitch:
    call: "{ channel: 'nasa' }"
  reports.twitter:
    call: "{ channel: 'nasa' }"
  reports.snapchat:
    call: "{ channel: 'nasa' }"
  media.instagram:
    call: "{ channel: 'nasa' }"
  media.youtube:
    call: "{ channel: 'NASA', page: 1 }"
  media.tiktok:
    call: "{ channel: '1234567' }"
  history.instagram:
    call: "{ channel: 'nasa' }"
  history.youtube:
    call: "{ channel: 'NASA' }"
  history.tiktok:
    call: "{ channel: 'littlebig' }"
  history.twitch:
    call: "{ channel: 'nasa' }"
  history.twitter:
    call: "{ channel: 'nasa' }"
  mentions.youtube:
    call: "{ channel: 'NASA' }"
  mentions.tiktok:
    call: "{ channel: 'littlebig' }"
  discovery.search:
    call: "{ social_network: 'instagram', filters: { search: ['nasa'], subscribers_count: { from: 10000, to: 100000 } }, page: 1 }"
  discovery.keywords:
    call: "{ socialNetwork: 'instagram', contentIds: '123,456' }"
  lists.list:
    call: "{}"
  lists.items:
    call: "{ id: 0, limit: 100, offset: 0 }"
  lists.add:
    call: "{ list_id: 483, channel_id: 'nasa', type: 'IG' }"
  lists.remove:
    call: "{ report_id: 6456, list_id: 483 }"
  account.planInfo:
    call: "{}"
  account.unlockedReports:
    call: "{ limit: 100, date_from: '2024-01-01' }"
  suggester.get:
    call: "{ search: 'nas' }"
  taxonomy.get:
    call: "{}"
apiNotes:
  reports.instagram: 'Send exactly one of `username` or `user_id`; they are two separate actions.'
  reports.tiktok: 'Send exactly one of `channel` or `user_id`, for the same reason.'
  media.youtube: 'One page at a time, which is free and safe to repeat.'
  history.youtube: 'The action is `auditor.youtube.history`. The docs page names `auditor.youtubeHistory`, which answers 405 code 3.'
  discovery.search: 'Each page costs one discovery call and returns 20 rows; the last page is 500. `sandbox: true` spends nothing.'
  account.unlockedReports: 'A date without a time is read as `00:00:00`, and omitting both dates covers the account history.'
  taxonomy.get: 'Returns the category, thematics and language ids the discovery filters take.'
