displayName: Telnyx
description: Voice and SMS with Telnyx - send SMS and MMS, manage messaging profiles and phone numbers, search numbers to buy, place and control calls, and manage the call control applications calls dial through.
domain: telnyx.com
recommendedAuth: api_key
overviewNote: |
  Create a key in the Telnyx portal under API Keys. Send it as `Authorization: Bearer <key>`. A key inherits the permissions of the user who created it, so a restricted user's key cannot manage numbers.

  Things to know before you call:

  - **Sending charges the account.** `messages.send` bills per message part, and `calls.create` bills per minute from the moment the call is answered. There is no sandbox.
  - **A sender is required, in one of two forms.** Send `from` for a phone number or alphanumeric sender ID, or send `messaging_profile_id` and let that profile's number pool pick the sender. The plugin rejects a send with neither.
  - **SMS needs text, MMS needs media.** A send with neither text nor `media_urls` is rejected before the request, because Telnyx refuses it too.
  - **Paging uses bracketed keys.** `page[number]` and `page[size]` on the messaging profile, number and application lists. `page[size]` runs from 1 to 250. The available-numbers route has no pages: it takes its filters bracketed, `filter[country_code]` and the rest, and `limit` is one of those filters rather than a top-level value.
  - **Responses are wrapped.** Every answer is `{ data }`, and a list adds `meta` with `total_pages`, `total_results`, `page_number` and `page_size`. The one exception is `messages.delete`, which answers with the bare message.
  - **Sends, dials and live-call actions are destructive.** `messages.send`, `calls.create`, `calls.speak` and `calls.hangup` bill the account, reach a person or cannot be undone. `calls.speak` needs `payload` and `voice`; `language` is optional.
  - **`messages.delete` cancels a scheduled message.** It only works on a message sent with `send_at` that has not gone out yet.
  - **Number settings.** `phoneNumbers.update` changes the connection, tags, billing group, customer reference and similar fields. Telnyx sets a number's messaging profile and emergency settings on separate routes this plugin does not cover.
  - **Call control application first.** `calls.create` takes a `connection_id`, which is the ID of a call control application. Create one with `callControlApplications.create`, which requires a `webhook_event_url` because Telnyx sends every call event there.
  - **Releasing a number is permanent.** `phoneNumbers.delete` gives the number back to the pool and it cannot be recovered. Deleting a messaging profile detaches its numbers rather than releasing them.
  - **Error codes.** A failure is core's `ApiError`, whose body is `{ errors: [{ code, title, detail }] }`; `telnyxErrorDetails(error)` reads the entries. `20100` is "Insufficient Funds", which no retry fixes.
examples:
  read:
    path: phoneNumbers.list
    title: List the numbers on the account
    args:
      pageSize: 25
  write:
    path: messages.send
    title: Send an SMS
    args:
      from: '+13125550001'
      to: '+13125550002'
      text: Hello from Telnyx
apiExamples:
  messages.send:
    call: "{ from: '+13125550001', to: '+13125550002', text: 'Hello from Telnyx' }"
  messages.get:
    call: "{ messageId: '40385f64-5717-4562-b3fc-2c963f66afa6' }"
  messages.delete:
    call: "{ messageId: '40385f64-5717-4562-b3fc-2c963f66afa6' }"
  messagingProfiles.list:
    call: "{ pageNumber: 1, pageSize: 20 }"
  messagingProfiles.get:
    call: "{ profileId: '3fa85f64-5717-4562-b3fc-2c963f66afa6' }"
  messagingProfiles.create:
    call: "{ name: 'Primary profile', whitelisted_destinations: ['US'], webhook_url: 'https://example.com/webhooks/telnyx' }"
  messagingProfiles.update:
    call: "{ profileId: '3fa85f64-5717-4562-b3fc-2c963f66afa6', name: 'Renamed profile' }"
  messagingProfiles.delete:
    call: "{ profileId: '3fa85f64-5717-4562-b3fc-2c963f66afa6' }"
  phoneNumbers.list:
    call: '{ pageSize: 25 }'
  phoneNumbers.get:
    call: "{ phoneNumberId: '1293384261075731499' }"
  phoneNumbers.update:
    call: "{ phoneNumberId: '1293384261075731499', connection_id: '1293384261075731500', tags: ['support'] }"
  phoneNumbers.delete:
    call: "{ phoneNumberId: '1293384261075731499' }"
  availablePhoneNumbers.list:
    call: "{ countryCode: 'US', locality: 'Chicago', limit: 10 }"
  calls.create:
    call: "{ connection_id: '1293384261075731500', to: '+13125550002', from: '+13125550001' }"
  calls.get:
    call: "{ callControlId: 'v3:abc123' }"
  calls.hangup:
    call: "{ callControlId: 'v3:abc123' }"
  calls.speak:
    call: "{ callControlId: 'v3:abc123', payload: 'Hello, this is a test', voice: 'female', language: 'en-US' }"
  callControlApplications.list:
    call: '{ pageNumber: 1, pageSize: 10 }'
  callControlApplications.get:
    call: "{ applicationId: '1293384261075731500' }"
  callControlApplications.create:
    call: "{ application_name: 'Voice app', webhook_event_url: 'https://example.com/webhooks/calls' }"
  callControlApplications.update:
    call: "{ applicationId: '1293384261075731500', active: false }"
  callControlApplications.delete:
    call: "{ applicationId: '1293384261075731500' }"
apiNotes:
  'messages.send': 'Charges the account per part; send from, or a messaging_profile_id so the number pool picks the sender; SMS needs text and MMS needs media_urls.'
  'availablePhoneNumbers.list': 'countryCode is required; every other filter, limit included, travels as a filter[..] query key.'
  'calls.create': 'connection_id is the call control application ID, and the call bills per minute once answered.'
  'calls.speak': 'payload and voice are required; language is optional.'
  'messages.delete': 'Cancels a scheduled message that has not been sent yet; answers with the bare message, not { data }.'
  'messagingProfiles.create': 'whitelisted_destinations is required, e.g. ["US"].'
  'callControlApplications.create': 'webhook_event_url is required because Telnyx delivers every call event there.'
  'phoneNumbers.delete': 'Releases the number permanently; it cannot be recovered.'
  'messagingProfiles.delete': 'Detaches the profile from its numbers and stops inbound delivery.'
