    call: '{ hash: "41654" }'
  giftcards.create:
    call: '{ giftcardProgramUuid: "8fb59dcf-fb5b-4cee-88d8-35e361e55a12" }'
  giftcards.sendByEmail:
    call: '{ giftcardUuid: "5b3dab1c-bdde-4313-a74d-67de815c751c", contactUuid: "1b7e3c4a-5f2d-4e8b-9a6c-0d2f4e6a8b1c" }'
  giftcards.listPrograms:
    call: '{}'
  businesses.listProfiles:
    call: '{}'
  businesses.getProfile:
    call: '{ uuid: "123123" }'
  webhooks.list:
    call: '{}'
  webhooks.create:
    call: '{ name: "Contact alerts", eventType: "contact_created", url: "https://example.com/piggy/webhooks", version: "V2" }'
  webhooks.get:
    call: '{ webhookSubscriptionUuid: "f1dc2d67-caa8-4919-a537-66491a94ed2f" }'
  webhooks.update:
    call: '{ webhookSubscriptionUuid: "f1dc2d67-caa8-4919-a537-66491a94ed2f", status: "INACTIVE" }'
  webhooks.delete:
    call: '{ webhookSubscriptionUuid: "f1dc2d67-caa8-4919-a537-66491a94ed2f" }'
apiNotes:
  contacts.list: 'Attribute filters ride through attributesQuery with Piggy bracketed parameter names, e.g. "attributes[visits][gte]": 10 or "attributes[likes_pizza]": true; a contact must match every filter.'
  contacts.create: 'Only the email is required; Piggy answers with the new UUID only. Use contacts.update to add attributes.'
  contacts.delete: 'Schedules the removal; DEFAULT keeps a detailed log and GDPR removes personal data references. Cannot be undone.'
  contacts.merge: 'The source contact ceases to exist and the merge cannot be undone; verify both emails belong to the same person first.'
  loyalty.listTransactions: 'type filters to credit_receptions or reward_receptions; shopUuid takes a business profile UUID.'
  points.create: 'A negative points value subtracts; the transaction can be reversed once with points.reverse.'
  rewards.redeem: 'The claim fails with documented codes when credits are insufficient (1017), stock is empty (1018) or the per-contact limit is reached (1019).'
  vouchers.redeem: 'contactUuid is required when the voucher has no linked contact; pass the releaseKey from vouchers.lock for locked vouchers.'
  vouchers.lock: 'Returns a release_key needed for later redemption or release; Piggy auto-releases the lock after one hour.'
  giftcards.create: 'The public API only creates digital giftcards (the plugin sends type 1); physical cards are refused with error 55021.'
  webhooks.create: 'One subscription per event type: creating again for the same event_type overwrites the existing subscription. version V2 batches events and is the recommended envelope.'
