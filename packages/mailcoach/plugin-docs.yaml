apiNotes:
  subscribers.subscribe: "This can restart an unsubscribed address. Supplied tags replace existing tags; only use skip_confirmation when consent is already established."
  subscriberImports.create: "Creates a draft only. CSV imports bypass confirmation and can resubscribe or unsubscribe existing contacts depending on the optional flags. Import only consented addresses."
  subscriberImports.update: "Only draft imports can be updated; resend both required fields."
  subscriberImports.append: "Append CSV rows without repeating the header, then call start separately."
  subscriberImports.start: "Starts asynchronous processing and returns 204 with no body. Poll subscriberImports.get until completed or failed; completed imports may still have row errors."
  tags.update: "Send both name and visible_in_preferences."
  segments.update: "Send the complete desired positive and negative tag conditions; updates replace existing conditions."
  templates.create: "structured_html is editor-specific and has no editor-independent schema; omit it unless required by the chosen editor."
  templates.update: "Include name along with the content to update."
  campaigns.create: "Creates a draft; nothing is sent. Scheduling is campaigns.schedule and sending is campaigns.send, both destructive. Use either template fields or inline HTML as appropriate."
  campaigns.update: "This is not a sparse patch: omitted content, segment, or scheduling values can reset. Resend the full intended draft settings. Updating a scheduled campaign through this operation clears its schedule."
  campaigns.schedule: "Schedules delivery to the campaign audience at schedule_at (UTC, YYYY-MM-DD HH:mm:ss). This is a full PUT: resend every campaign setting."
  campaigns.sendTest: "Sends a test email to up to ten comma-separated addresses. This sends real mail."
  campaigns.send: "Sends to the campaign audience. Never blindly retry after a timeout because the first request may already have been accepted."
  campaigns.clicks: "Has an additional 5 requests/second burst limit per team, in addition to the normal authenticated limit."
  transactionalMails.send: "Provide either mail_name for a saved transactional template or subject plus at least one of html/text. fake=true logs without delivering. The default store=true returns a top-level uuid; store=false returns 204. Failures can be plain text and are surfaced as sanitized status errors."
  transactionalMails.listTemplates: "Lists saved transactional email templates, not sent-message log items."
  automationMails.create: "Creates a reusable automation email and does not start an automation or send to subscribers."
  automationMails.update: "Include name and only the documented fields you want to update."
  sends.delete: "Deletes the send record but cannot recall an email already delivered."
  links.get: "Has an additional 5 requests/second burst limit per team."
  suppressions.create: "Creates a team-wide manual sending block."
  suppressions.delete: "Hosted Mailcoach forbids deleting spam-complaint suppressions. Removing an allowed suppression can permit future sends."
  uploads.create: "Uses the documented JSON base64 form. Upload up to 10 JPEG, PNG, GIF, or WebP images, each no larger than 8 MB; SVG is not accepted. The upload does not alter any email until you reference the returned URL in its HTML."
