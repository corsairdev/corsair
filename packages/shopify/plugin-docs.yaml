# Display copy for the docs, the catalog, corsair.dev and Hub.
displayName: "Shopify"
description: "Read and manage products, variants, inventory, collections, orders and customers in a Shopify store, and verify the webhooks Shopify sends."
domain: "shopify.com"
recommendedAuth: "api_key"
overviewNote: |
  Connecting a store asks for its `*.myshopify.com` domain plus one of two
  credentials, all stored on the account:

  - **Client ID and Client secret** of a Dev Dashboard app (every app created
    since January 2026). The plugin exchanges them for an Admin API token with
    the client credentials grant, keeps the token with its expiry, renews it
    five minutes before Shopify's 24-hour limit, and renews once more if
    Shopify rejects it early with a 401. Nothing has to be replaced by hand:
    `pnpm corsair setup --plugin=shopify --tenant=acme shop_domain=<store>.myshopify.com client_id=<id> client_secret=<secret>`.
  - **Admin API access token** (`shpat_…`) from an app made with the old
    admin-created custom app flow. Those tokens do not expire:
    `pnpm corsair setup --plugin=shopify --tenant=acme api_key=<token> shop_domain=<store>.myshopify.com`.
    A token and domain can also be passed as `key` and `shopDomain` in the
    plugin options.

  When the client ID and secret are set they win: the API key slot then holds
  the token the plugin minted. A token or app without a domain fails before the
  call, because every request URL is built from it.

  To make a Dev Dashboard app, open dev.shopify.com, create the app, add a
  version with the scopes the operations you call need (`read_products`,
  `write_products`, `read_orders`, `write_orders`, `read_customers`,
  `write_customers`, `read_inventory`, `write_inventory`), release it, and
  install it on the store. Copy the Client ID and Client secret from the app's
  Settings. The client credentials grant only works when the app and the store
  belong to the same organisation in the Dev Dashboard: if a call fails with
  `shop_not_permitted`, create the store from the Dev Dashboard's Dev stores
  page; `app_not_installed` means the app is not installed on the store yet.

  A Dev Dashboard app also needs protected customer data access before it can
  read customers. Request it in the Partner Dashboard (partners.shopify.com,
  your app, API access, Protected customer data): pick the reasons, and the
  Name, Email, Phone and Address fields you need. Apps that are not on the App
  Store get it without review. Until then Shopify refuses every query that
  touches the Customer object, so `customers.list` and `customers.get` fail with
  "This app is not approved to access the Customer object".

  The Admin API is GraphQL and versioned quarterly. This plugin calls
  `2026-10`, the newest stable version. Shopify throttles by calculated query
  cost and reports the result in the response body rather than a header, so a
  throttled call arrives as HTTP 200 with a `THROTTLED` code; the plugin reads
  the cost bucket and waits long enough to cover the query before retrying.

  A mutation that the store rejects also answers HTTP 200, with the reason in
  `userErrors`. The plugin treats a populated `userErrors` as a failure, so a
  caller is never told a write succeeded when it did not.

  With object access granted but a field such as Name or Email not selected,
  Shopify returns the customer rows with those fields nulled and an
  `ACCESS_DENIED` error beside the data. The plugin accepts that partial result
  and logs a warning rather than failing the call, so `customers.list` still
  returns ids, order counts and spend. The `Customer` object's `displayName` is the one exception: asking for
  it returns no data at all, so this plugin never selects it and callers build a
  name from `firstName` and `lastName`.

  Webhook deliveries are JSON and signed with `X-Shopify-Hmac-Sha256`. Set the
  app's signing secret as the plugin's webhook secret. Verification runs over
  the raw request body, so the handler must receive a `rawBody`.
examples:
  read: "products.list"
  write: "products.update"
apiExamples:
  products.list:
    args:
      first: 10
      query: "status:active"
  products.get:
    args:
      id: "gid://shopify/Product/108828309"
  products.create:
    call: "{ title: 'Hiking backpack', vendor: 'Acme', status: 'DRAFT' }"
  products.update:
    call: "{ id: 'gid://shopify/Product/108828309', title: 'Trail backpack' }"
  products.delete:
    args:
      id: "gid://shopify/Product/108828309"
  variants.list:
    call: "{ productId: 'gid://shopify/Product/108828309' }"
  variants.update:
    call: "{ productId: 'gid://shopify/Product/108828309', id: 'gid://shopify/ProductVariant/1', price: '19.99' }"
  inventory.list:
    call: "{ inventoryItemId: 'gid://shopify/InventoryItem/1' }"
  inventory.adjust:
    call: "{ inventoryItemId: 'gid://shopify/InventoryItem/1', locationId: 'gid://shopify/Location/1', delta: 5, reason: 'correction' }"
  collections.list:
    args:
      first: 10
  collections.get:
    args:
      id: "gid://shopify/Collection/1"
  collections.create:
    call: "{ title: 'Outdoor gear' }"
  collections.addProducts:
    call: "{ id: 'gid://shopify/Collection/1', productIds: ['gid://shopify/Product/108828309'] }"
  orders.list:
    args:
      first: 10
      query: "financial_status:paid"
  orders.get:
    args:
      id: "gid://shopify/Order/1"
  orders.listLineItems:
    args:
      id: "gid://shopify/Order/1"
      first: 50
  orders.cancel:
    call: "{ id: 'gid://shopify/Order/1', reason: 'CUSTOMER', restock: true }"
  orders.markAsPaid:
    args:
      id: "gid://shopify/Order/1"
  orders.close:
    args:
      id: "gid://shopify/Order/1"
  customers.list:
    args:
      first: 10
  customers.get:
    args:
      id: "gid://shopify/Customer/1"
  customers.create:
    call: "{ email: 'buyer@example.com', firstName: 'Jenny' }"
  customers.update:
    call: "{ id: 'gid://shopify/Customer/1', note: 'VIP' }"
  shop.get: {}
  shop.listLocations:
    args:
      first: 10
  webhookSubscriptions.list:
    args:
      first: 10
  webhookSubscriptions.create:
    call: "{ topic: 'ORDERS_CREATE', uri: 'https://example.com/webhooks/shopify' }"
  webhookSubscriptions.delete:
    args:
      id: "gid://shopify/WebhookSubscription/1"
exampleWebhook:
  path: "shopify.receive"
  note: 'Shopify puts the topic in the X-Shopify-Topic header and signs the raw body with X-Shopify-Hmac-Sha256. One handler covers every supported topic and the header selects the payload schema.'
  after: '// result.data.topic names the delivery, e.g. orders/create'
apiNotes:
  products.delete:
    'Deletes synchronously by default and returns deletedProductId. Set synchronous to false for a product with many variants: the delete then runs in the background and returns productDeleteOperation, whose id and status let you track it, while deletedProductId may be null.'
  orders.cancel:
    'Cancels the order without refunding. Cancelling and refunding are separate decisions, so the deprecated refund flag is not used and no money moves on a cancel.'
  customers.update:
    'Passing tags replaces the full tag set. Use the Shopify admin or a tagsAdd mutation to append one without dropping the rest.'
  'customers.list':
    'Needs protected customer data access on the app; without it the call fails. With access to the Customer object but not to a field (Name, Email, Phone, Address), Shopify nulls that field and returns an ACCESS_DENIED warning beside the rows, and the plugin keeps the rows.'
  'customers.get':
    'Needs protected customer data access on the app. Fields the app was not granted (name, email, phone) come back null with an ACCESS_DENIED warning, and the rest of the customer is returned.'
  inventory.adjust:
    'Adjusts the available quantity by a signed delta at one location. A positive delta adds stock and a negative one removes it. Each call sends a new idempotency key unless you pass idempotencyKey; pass the same key only to retry the same adjustment.'
  'webhookSubscriptions.create':
    'Registers a JSON subscription. Shopify also delivers XML, which this plugin cannot verify or parse, so the format is not configurable.'
  shop.listLocations:
    'Returns the inventory locations. Pass a location id to inventory.adjust to change stock at that location.'
