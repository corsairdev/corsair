displayName: Jotform
description: Manage Jotform online forms, questions, submissions, reports, folders, and labels through the official Jotform REST API.
domain: jotform.com
recommendedAuth: api_key
overviewNote: >-
  Authenticate with a Jotform API key passed in the APIKEY header. Standard (api.jotform.com),
  EU (eu-api.jotform.com), and HIPAA (hipaa-api.jotform.com) base URLs are supported. Daily API
  call limits are reported via limit-left response headers.
examples:
  read:
    path: user.get
    title: Get authenticated user profile
    args: {}
  write:
    path: forms.create
    title: Create a new form
    args:
      properties:
        title: Customer Feedback
apiExamples:
  user.get:
    call: "{}"
  user.getForms:
    call: "{ limit: 20 }"
  user.getSubmissions:
    call: "{ limit: 20 }"
  user.getFolders:
    call: "{}"
  user.getHistory:
    call: "{ action: 'formCreation' }"
  user.getSettings:
    call: "{}"
  user.updateSettings:
    call: "{ company: 'Acme Corp' }"
  user.getSettingByKey:
    call: "{ key: 'time_zone' }"
  user.getSubusers:
    call: "{}"
  user.getUsage:
    call: "{}"
  user.getReports:
    call: "{}"
  user.getInvoices:
    call: "{}"
  user.getLabels:
    call: "{}"
