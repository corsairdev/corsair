displayName: Formdesk
description: Connect to Formdesk REST v1 to manage forms, submissions, users, visitors, and uploaded files with validated requests and responses.
domain: formdesk.com
recommendedAuth: api_key
overviewNote: Formdesk Connect returns the account host; pass that host and the account domain to subsequent operations. API keys use the Authorization Bearer scheme. Credential-based Connect returns an API key, so treat its output as a secret.
examples:
  read:
    path: forms.list
    title: List forms
    args:
      host: fd7.formdesk.com
      domain: apitest
  write:
    path: forms.park
    title: Create a prefill ticket
    args:
      host: fd7.formdesk.com
      domain: apitest
      data:
        name: Ada
      expires: 3600
apiNotes:
  connect.credentials: >-
    This call sends Formdesk username/password credentials and returns an API key;
    treat its output as a secret. Connect is exempt from the API credit charge.
  results.export: >-
    Credits equal the number of completed forms downloaded. The published format
    list and request sample conflict: the list has `excel`, while the sample uses
    `excel2007`; both spellings are accepted.
  results.list: >-
    Filter parameters are supported, but the collection documents no page or
    cursor pagination. The response is the full matching collection.
  results.add: >-
    A single entry or an array of up to 10 entries may be sent. Form fields are
    account-defined, so their identifiers are preserved as JSON keys.
  results.markProcessed: >-
    Marking a result processed is explicitly documented as free and is used by
    Formdesk's synchronization workflow.
  results.pdf: >-
    Returns binary data as `{ kind: 'binary', contentType, base64, filename?,
    byteLength }`. Responses over 25 MiB are rejected by this plugin.
  files.content: >-
    Returns binary data as `{ kind: 'binary', contentType, base64, filename?,
    byteLength }`. Responses over 25 MiB are rejected by this plugin.
apiExamples:
  connect.apiKey:
    call: "{ domain: 'apitest' }"
  connect.credentials:
    call: "{ domain: 'apitest', username: 'automation-user', password: 'not-a-real-password' }"
  forms.list:
    call: "{ host: 'fd7.formdesk.com', domain: 'apitest' }"
  forms.park:
    call: "{ host: 'fd7.formdesk.com', domain: 'apitest', data: { name: 'Ada' }, expires: 3600 }"
  forms.items:
    call: "{ host: 'fd7.formdesk.com', domain: 'apitest', form: 'people' }"
  forms.filters:
    call: "{ host: 'fd7.formdesk.com', domain: 'apitest', form: 'people' }"
  results.export:
    call: "{ host: 'fd7.formdesk.com', domain: 'apitest', form: 'people', format: 'csv' }"
  results.list:
    call: "{ host: 'fd7.formdesk.com', domain: 'apitest', form: 'people', query: { status: 'DONE', sync_status: 'N,C' } }"
  results.get:
    call: "{ host: 'fd7.formdesk.com', domain: 'apitest', entryId: 93755850 }"
  results.add:
    call: "{ host: 'fd7.formdesk.com', domain: 'apitest', form: 'people', data: { name: 'Ada' } }"
  results.update:
    call: "{ host: 'fd7.formdesk.com', domain: 'apitest', entryId: 93755850, data: { name: 'Ada' } }"
  results.remove:
    call: "{ host: 'fd7.formdesk.com', domain: 'apitest', entryId: 93755850 }"
  results.increment:
