# Display copy for the docs, the catalog, corsair.dev and Hub, and one call
# example per operation. Generated with the plugin from Netlify's swagger;
# docs-examples.test.ts parses every example with its input schema.
displayName: Netlify
domain: netlify.com
description: "Sites, deploys (with file and function uploads), builds and build hooks, environment variables, forms and submissions, functions, DNS zones and records, TLS certificates, split tests, snippets, Netlify DB databases, agent runs, teams, members and audit logs, deploy keys, add-ons and AI Gateway tokens, plus JWS-signed webhooks for deploy and form events (185 operations)."
recommendedAuth: api_key
overviewNote: |
  Connect with a Netlify personal access token (User settings >
  Applications > Personal access tokens) or an OAuth access token; it is sent
  as `Authorization: Bearer <token>` and acts as that user across every team
  they belong to. Netlify calls a team an account: `account_id` and
  `account_slug` come from `accounts.list`, site ids from `sites.list`.

  - **Deploys.** `sites.deploys.create` takes a digest of the files
  (`files`: path -> SHA1) and answers with the SHA1s it still needs in
  `required`; send each with `deploys.uploadFile` (the file's path and its
  bytes as `file`: a URL, `{ base64 }` or a Blob), and
  upload the functions it lists in `required_functions` the same way with
  `deploys.uploadFunction` (a zip per function). After the last upload
  Netlify processes the deploy: poll `deploys.get` until `state` is `ready`.
  A `draft` deploy is never published, and a locked site keeps its current
  deploy. A whole site can also go up as one zip (`zip` on
  `sites.deploys.create`). `sites.builds.create` starts a build from the
  linked repository instead.
  - **Lists** page with `page` (1-based) and `per_page`; the plugin sends 100
  when `per_page` is left out. Paged lists return `{ items, next_page }`,
  with `next_page` set while a page comes back full: step `page` until it
  is null.
  - **Risk.** Every delete is `destructive` except the three that only stop
  work (`agentRunners.delete`, `agentRunners.sessions.delete`,
  `sites.devServers.deleteAll`, which are `write`), as are team plan changes
  (`accounts.create`, `accounts.update`), add-ons, database compute settings,
  data resets and restores, migrations, member invitations (they send
  email), agent runs (they spend AI credits), commits and pull requests
  from agent runs, DNS zone transfers, unlinking a repository and disabling
  a site.
  - **Webhooks.** Create an outgoing hook with `hooks.create` (type `url`,
  `data.url` your Corsair webhook URL, `data.signature_secret` a long random
  secret) for each event you want, and give the plugin the same secret as
  `webhookSecret` (or store it as the account's webhook signature).
  Deliveries are checked against `X-Webhook-Signature` (a JWS, HS256, whose
  `sha256` claim must match the body) and routed by `X-Netlify-Event`:
  deploy events to `deploy`, `submission_created` to `submission`.
  - Rate limits: 500 requests a minute, 3 deploys a minute and 100 a day;
  core waits for `X-RateLimit-Reset` and retries a 429 three times.
  - Not wrapped: three routes the swagger tags `x-internal` (the build
  plugins runtime's own calls).
examples:
  read:
    path: sites.list
    title: List sites
    args: {"filter": "owner", "per_page": 20}
  write:
    path: sites.builds.create
    title: Start a build
    args: {"site_id": "5b2f8a51-7c1e-4d8a-9f43-2b6e1c0a9d17", "clear_cache": true}
