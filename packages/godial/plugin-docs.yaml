displayName: "GoDial"
description: List GoDial contact lists and add contacts to a selected list through the documented external API.
domain: godial.cc
recommendedAuth: api_key
examples:
  read:
    path: lists.list
    title: List GoDial lists
    args: {}
  write:
    path: contacts.add
    title: Add a contact to a list
    args:
      listId: list-123
      name: Ada Lovelace
      phone: "+15555550123"
apiExamples:
  lists.list: {}
  contacts.add:
    call: "{ listId: 'list-123', name: 'Ada Lovelace', phone: '+15555550123' }"
apiNotes:
  lists.list: "GoDial's reference (godial.stoplight.io) shows only an empty example response, so the result schema comes from live responses: an array of lists, each with an id. Other fields pass through as GoDial sends them, except the IndiaMart block, which keeps only `enabled` because it also carries that integration's API key. A response that isn't an array of objects with ids fails validation."
  contacts.add: "phone and listId are required. With assignmentMode 'roundrobin' or an accountsId the contact is assigned to an agent and joins that agent's calling queue. The reference shows only an empty example response."
overviewNote: "Create an External API access token in the GoDial dashboard. The provider requires it as the access_token query parameter for every request."
