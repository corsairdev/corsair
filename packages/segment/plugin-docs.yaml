    call: "{ trackingPlanId: 'tp_2ljkchcmkcY9anKnhvQ1WqAGOGC', sourceId: 'qQEHquLrjRDN9j1ByrChyn' }"
  functions.list:
    call: "{ resourceType: 'DESTINATION' }"
  functions.get:
