  functions.delete:
    call: "{ functionId: 'fn_2ljkchcmkcY9anKnhvQ1WqAGOGC' }"
  catalog.listDestinations:
    call: "{ count: 50 }"
  catalog.getDestination:
    call: "{ destinationMetadataId: '5gPpjD6ikn' }"
  catalog.listSources:
    call: "{ count: 50 }"
  catalog.getSource:
    call: "{ sourceMetadataId: 'IqDTy1TpoU' }"
  regulations.list:
    call: "{ count: 25 }"
  regulations.create:
    call: "{ regulationType: 'DELETE_ONLY', subjectType: 'USER_ID', subjectIds: ['user_123'] }"
  regulations.get:
    call: "{ regulateId: '1qJkfE1tpwvQcklImGksLN629wn' }"
apiNotes: >
  'Auth: a Public API token from app.segment.com, Settings, Access
  Management, Tokens, Create Token. Pick the Public API token type; the
  legacy Config API token in the same menu is a different credential that
  this plugin does not target. Tokens are workspace-scoped with
  per-token permissions. EU workspaces answer on
  eu1.api.segmentapis.com; this plugin pins the US host
  api.segmentapis.com, so EU tokens need a separate setup. The Tracking
  API on api.segment.io (write keys, event ingestion) is out of scope:
  different credential, different host, and its 200 answers never prove
  delivery. Sources.list, sources.get and sources.createWriteKey return
  writeKeys, which are live credentials. regulations.create permanently
  deletes the named users'' data and cannot be undone or cancelled;
  poll regulations.get with the returned regulateId, where FINISHED and
  PARTIAL_SUCCESS are terminal-done and FAILED, INVALID and
  NOT_SUPPORTED are terminal-failed. List endpoints always send
  pagination.count (1-1000, default 200); responses carry
  data.pagination.next for the following page. Segment checks auth
  before routing, so a 403 on any path means the token is bad or lacks
  permission. Shapes follow the official spec v74.1.0; routing was not
  verifiable live without a token, so response fields are parsed
  leniently.'
