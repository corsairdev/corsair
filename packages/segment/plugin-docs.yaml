  destinations.update:
    call: "{ destinationId: 'rh5BDZp6QDHvXFCkibm1pR', enabled: false }"
  destinations.delete:
    call: "{ destinationId: 'rh5BDZp6QDHvXFCkibm1pR' }"
  warehouses.list:
