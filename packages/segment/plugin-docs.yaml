  sources.listConnectedDestinations:
    call: "{ sourceId: 'qQEHquLrjRDN9j1ByrChyn' }"
  sources.listConnectedWarehouses:
    call: "{ sourceId: 'qQEHquLrjRDN9j1ByrChyn' }"
  sources.updateSchemaSettings:
