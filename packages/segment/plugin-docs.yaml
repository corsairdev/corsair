displayName: Segment
description: Twilio Segment customer data platform. Manage the workspace configuration a Public API token can reach - sources, destinations, warehouses, tracking plans, functions, the integration catalog and GDPR deletion runs.
domain: segmentapis.com
recommendedAuth: api_key
overviewNote: >
  This plugin wraps the Segment Public API (api.segmentapis.com) with one
  credential: a Public API token. Create it in the Segment app under
  Settings, Access Management, Tokens: choose the Public API token type,
  not the legacy Config API token. Tokens are workspace-scoped; an EU
  workspace lives on eu1.api.segmentapis.com, so pass the baseUrl option
  set to https://eu1.api.segmentapis.com (the default base is the US host).

  Things to know before you call:

  - **Regulations permanently delete data.** `regulations.create` starts a
  deletion or suppression run over the `subjectIds` you pass. It cannot be
  cancelled and the data cannot be recovered. The run is asynchronous: poll
  `regulations.get` with the returned `regulateId` until
  `overallStatus` is a terminal value (`FINISHED` or `PARTIAL_SUCCESS` mean
  done; `FAILED`, `INVALID` or `NOT_SUPPORTED` mean it did not finish).

  - **The Tracking API is out of scope.** Sending track, identify and other
  events needs a different credential (a per-source write key on
  api.segment.io), and that API answers 200 for events it silently drops,
  so this plugin only manages workspace configuration.

  - **Write keys are secrets.** Source objects embed a `writeKeys` array;
  treat values from `sources.list`, `sources.get` and
  `sources.createWriteKey` like passwords. `sources.createWriteKey` mints
  a credential, and `sources.removeWriteKey` breaks every sender using
  that key immediately.

  - **Catalog first.** `sources.create`, `destinations.create` and
  `warehouses.create` all need a `metadataId` from the catalog group, and
  the catalog item describes the settings the instance requires.

  - **Paging.** Every list call sends `pagination.count` (1-1000, default
  200) and returns `data.pagination`, whose `next` cursor pages forward.

  - **Errors.** Segment checks auth before routing: a 403 means the token
  is invalid or lacks the permission, whatever path you called. The plugin
  retries rate limits (429) with backoff and reads GET 5xxs twice more.
examples:
  read:
    path: sources.list
    title: List the workspace sources
    args:
      count: 25
  write:
    path: trackingPlans.create
    title: Create a tracking plan
    args:
      name: Mobile app plan
      type: TEMPLATE
apiExamples:
