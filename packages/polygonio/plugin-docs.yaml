displayName: Polygon.io
description: US stock market data from Polygon.io (now Massive) - historical aggregates, ticker reference data, snapshots and market status.
domain: massive.com
recommendedAuth: api_key
overviewNote: |
  Polygon.io renamed itself Massive in 2025: polygon.io now redirects to massive.com, and `api.polygon.io` and `api.massive.com` serve the same API. The plugin calls `api.polygon.io`. Create a key in the Massive dashboard under Keys and paste it into the plugin; it travels as the documented `apiKey` query parameter.

  What to know before you query:

  - **Plans gate the data, not the routes.** A free (Basic) key reaches market status and holidays, tickers, ticker types, exchanges and the end-of-day aggregates (`bars` by minute and up, `previousDay`, `dailySummary`, `marketSummary`). Snapshots, movers and second bars need a paid plan. When a plan does not include a dataset the API answers 403 `NOT_AUTHORIZED` rather than an empty result, and the plugin reports that as a permission error instead of retrying.
  - **`status` is not always `OK`.** A plan with delayed data answers `DELAYED`, so the field stays a string rather than an enum a future value could break.
  - **Paging.** `aggregates.bars` and `tickers.list` return `next_url` while another page exists (`marketSummary` answers every ticker in one page). It already carries the cursor and your filters, so pass it to the same operation as `nextUrl` and the other arguments are ignored. Any `apiKey` the URL echoes is dropped, because the plugin adds the caller's own.
  - **A missing bar is not an error.** `aggregates.bars` omits `results` when no qualifying trades happened in the window, so the plugin reads that as an empty page rather than a failed call. It does not mean the market was closed: an open session with no trades produces the same answer. Use `market.status` when you need the current market state.
  - **Rates.** The free tier allows 5 calls a minute. A 429 is retried by the transport three times, honouring any `Retry-After` the API sends; the plugin adds no retries of its own, so the budget is not multiplied.
  - **Webhooks.** The API sends none, so the plugin receives none.
references:
  - title: Stocks REST API
    url: https://massive.com/docs/rest/stocks/overview
  - title: REST quickstart
    url: https://massive.com/docs/rest/quickstart
# `timespan` is an enum, and the validator renders enum members unquoted while
# requiring a quoted string example, so the call lives in `apiExamples` below
# where the argument string is passed through verbatim.
examples:
  read:
    path: tickers.list
    title: List actively traded US stocks
    args:
      market: stocks
      active: true
  write:
    path: snapshots.snapshot
    title: Read a ticker's latest snapshot
    args:
      ticker: AAPL
apiExamples:
  aggregates.bars:
    call: "{ ticker: 'AAPL', multiplier: 1, timespan: 'day', from: '2026-01-02', to: '2026-01-09' }"
  aggregates.previousDay:
    call: "{ ticker: 'AAPL', adjusted: true }"
  aggregates.dailySummary:
    call: "{ ticker: 'AAPL', date: '2026-01-09' }"
  aggregates.marketSummary:
    call: "{ date: '2026-01-09', include_otc: false }"
  snapshots.snapshot:
    call: "{ ticker: 'AAPL' }"
  snapshots.movers:
    call: "{ direction: 'gainers', include_otc: false }"
  tickers.list:
    call: "{ market: 'stocks', active: true, limit: 50 }"
  tickers.overview:
    call: "{ ticker: 'AAPL' }"
  tickers.types:
    call: "{ asset_class: 'stocks' }"
  market.status:
    call: '{}'
  market.holidays:
    call: '{}'
  market.exchanges:
    call: "{ asset_class: 'stocks', locale: 'us' }"
