{
  "displayName": "DeployHQ",
  "description": "Manage DeployHQ accounts, projects, servers, deployments, configuration, users, and deployment resources through its documented REST API.",
  "recommendedAuth": "api_key",
  "overviewNote": "Configure the account permalink with the api_key account field account_subdomain or the accountSubdomain plugin option. Authenticated calls use HTTP Basic with the DeployHQ email/username and API key; save the key as Corsair api_key auth and set username in the api_key account fields or plugin option. The API key alone is insufficient. For clients without a database or KEK, provide key, username, and accountSubdomain directly in plugin options and keep credentials in a secret manager. The API guide documents a 40-character API key but no OAuth 2 flow. The OpenAPI document enumerates 216 REST operations, all linked in the package README. Public routes do not send credentials. Writes are not retried; safe GETs use the shared HTTP transport and honor numeric-seconds Retry-After values. The shared transport does not parse HTTP-date Retry-After on JSON routes; fixing that requires shared-core scope. Invoice downloads parse both forms locally. No undocumented pagination or rate limits are assumed. The signup operation posts to `https://api.deployhq.com/api/v1/signup`, so it does not require an existing account subdomain. The [signup guide](https://www.deployhq.com/support/api/signup) shows `https://deployhq.com/api/v1/signup`, but that host answers 301 to www.deployhq.com, which returns 404. SVG status badges are returned as text strings. No inbound webhook contract is documented or implemented.",
  "apiNotes": {
    "languageVersions.replaceProjectBuildConfigurationBuildLanguage": "The OpenAPI path requires override_build_configuration_id in the URL, but the parameter list describes the same field as an optional query parameter. This plugin follows the explicit route template and requires the path value; verify this discrepancy with DeployHQ before use.",
    "languageVersions.updateProjectBuildConfigurationBuildLanguage": "The OpenAPI path requires override_build_configuration_id in the URL, but the parameter list describes the same field as an optional query parameter. This plugin follows the explicit route template and requires the path value; verify this discrepancy with DeployHQ before use.",
    "projects.listProjectInsights": "The OpenAPI URL `/projects/{id}/insights` contains the path token `{id}`, while its parameter list includes both project_id and id. This implementation follows the URL template and uses its id field; confirm the intended identifier with DeployHQ.",
    "buildConfigurations.getProjectBuildConfiguration": "The OpenAPI URL `/projects/{project_id}/build_configuration` contains only the `{project_id}` path token, but its parameter list also declares an id path parameter. The extra parameter is omitted because it is not present in the URL template; confirm with DeployHQ.",
    "security.deleteSecurityApiKey": "The OpenAPI URL `/security/api_keys/{id}` contains the `{id}` path token, but its parameter list declares both identifier and id as path parameters. This implementation uses the URL's id field; confirm the intended identifier with DeployHQ.",
    "templates.showPublicTemplateTemplatePublic": "The OpenAPI URL `/templates/{id}/public/{id}` repeats the `{id}` path token but defines a single id parameter. The same value is used for both URL occurrences; confirm with DeployHQ whether distinct identifiers are intended.",
    "projects.statusBadgeStatusBadge": "The parameter list describes an optional identifier that is not present in this route. Use statusBadgeStatusBadgeByIdentifier for the documented URL that includes an identifier.",
    "invoices.getAccountInvoice": "The route summary says this downloads an invoice PDF, while the OpenAPI response schema declares a JSON string. JSON responses are returned as strings; non-JSON PDF bytes are preserved in a `kind: 'binary'` base64 envelope. The `kind` discriminator is the string literal `'binary'`. Binary responses are capped at 10 MiB by this plugin as a local memory-safety limit, not as a DeployHQ limit.",
    "globalServers.copyToProjectGlobalServer": "Pass the target project's `identifier` (a UUID) as project_id. The project permalink returns 404 on this route (checked 11-13).",
    "servers.createProjectServer": "Send the connection fields for the chosen protocol_type inside `server` (for SSH: hostname, username, port, use_ssh_keys or password), as listed in DeployHQ's [create a server guide](https://www.deployhq.com/support/api/servers/create-a-new-server). DeployHQ checks that the host is reachable and answers 422 when it is not.",
    "environmentVariables.deleteProjectEnvironmentVariable": "DeployHQ answers with 204 No Content, so the operation returns undefined on success.",
    "templates.createTemplate": "Pass the source project's `identifier` (a UUID) as template.project_id. Without a project_id DeployHQ answers 500 (checked 11-13).",
    "signup.createSignup": "This public operation posts to `https://api.deployhq.com/api/v1/signup`, not an account subdomain. The [signup guide](https://www.deployhq.com/support/api/signup) shows `https://deployhq.com`, which redirects to a 404. The API key works only after the new account's email address is verified."
  },
