# Display copy for the generated docs and the catalog, plus one call
# example per operation. Generated with the plugin from Discourse's OpenAPI spec;
# docs-examples.test.ts parses every example with its input schema.
displayName: Discourse
domain: discourse.org
description: "Run a Discourse forum: topics, posts, private messages, categories, tags, groups, users, badges, invites, notifications, search, uploads and backups (95 operations), plus signed webhooks."
recommendedAuth: api_key
overviewNote: |
  Create an API key on the forum (Admin > Advanced > API keys) and connect it with the forum URL and the username to act as. Things to know before you write:

  - **Which user acts.** An "All users" key acts as whatever user `Api-Username` names (use an admin, or `system`); a "Single user" key always acts as its own user. Admin routes (`/admin/...`) need an admin.
  - **Hosted plans.** Discourse's hosted Free plan has no API keys; self-hosted forums and the paid hosted plans do.
  - **Posting.** `posts.create` makes a topic (title + raw), a reply (topic_id + raw) or a private message (archetype `private_message` + `target_recipients`). New topics notify watchers.
  - **Rate limits.** Admin keys get 60 requests a minute by default; a 429 carries Retry-After, and core retries it.
  - **Webhooks.** Discourse signs each delivery with HMAC-SHA256 of the raw body in `X-Discourse-Event-Signature` (`sha256=<hex>`) using the webhook's secret. The plugin checks it before handling `topic`, `post`, `user`, `group`, `category`, `tag` and other events.
examples:
  read:
    path: topics.listLatest
    title: List the latest topics
    args: {}
  write:
    path: posts.create
    title: Create a topic
    args: {"title": "Release notes for 2.4", "raw": "What changed in this release, one line per change.", "category": 4}
