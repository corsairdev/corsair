displayName: Render
description: Manage Render services and deploys, Postgres and Key Value databases, env groups, environments, custom domains, disks, logs, metrics, webhooks and workflows.
domain: render.com
recommendedAuth: api_key
overviewNote: |
  Create an API key in the Render Dashboard under Account Settings, API Keys. A key can reach every workspace its user belongs to, so most create and list calls take an `ownerId` (the workspace ID, `tea-...` or `usr-...`); `owners.list` returns them. Things to know before you call:

  - **Replace operations delete what you leave out.** `final.updateEnvVarsForService`, `final.updateSecretFilesForService`, `final.updateHeaders`, `final.updateRoutes`, `buildSources.envVars.update` and `buildSources.secretFiles.update` take the full list as `body`. Entries not in the list are removed. To change one variable, use `final.updateEnvVar` (or `final.updateEnvGroupEnvVar`) instead.
  - **Secrets come back in plain text.** Env var and secret file reads return values and file contents.
  - **`id` and `key` in the `final` group.** These operations name their path values generically. `id` is the parent resource (a service, env group, Postgres database or workspace) and `key` is the child: `final.retrieveDeploy` takes the service ID as `id` and the deploy ID as `key`. Each operation's description says which is which.
  - **Paging.** Lists return an array of `{ cursor, <resource> }` entries. Pass the last entry's `cursor` to get the next page; `limit` goes up to 100.
  - **Rate limits.** On a 429 the plugin waits for Render's `Retry-After` (at most 60 seconds) and retries up to five times.
  - **Not covered.** The deprecated `/redis` routes (use the Key Value operations), sandboxes, flows, and the streaming endpoints (log subscribe and task-run events). The plugin does not receive webhooks; `automation.createWebhook` and friends manage Render's outgoing webhooks.
examples:
  read:
    path: services.list
    title: List web services in a region
    args:
      type:
        - web_service
      region:
        - oregon
      limit: 20
  write:
    path: services.triggerDeploy
    title: Deploy the latest commit of a service
    args:
      serviceId: srv-d0k1q2r3s4t5u6v7w8x9
dbExample:
  entity: renderOwner
  note: >-
    `owners.list` and `owners.retrieve` store each workspace by owner ID
    (`id`, `name`, `email`, `type`).
  data:
    name: Acme
apiExamples:
  services.list:
    call: "{ type: ['web_service'], region: ['oregon'], limit: 20 }"
  services.retrieve:
    call: "{ serviceId: 'srv-d0k1q2r3s4t5u6v7w8x9' }"
  services.triggerDeploy:
    call: "{ serviceId: 'srv-d0k1q2r3s4t5u6v7w8x9', clearCache: 'clear' }"
  services.listDeploys:
    call: "{ serviceId: 'srv-d0k1q2r3s4t5u6v7w8x9', status: ['live'], limit: 10 }"
  services.rollbackDeploy:
    call: "{ serviceId: 'srv-d0k1q2r3s4t5u6v7w8x9', deployId: 'dep-d0k1q2r3s4t5u6v7w8y0' }"
  services.scale:
    call: "{ serviceId: 'srv-d0k1q2r3s4t5u6v7w8x9', numInstances: 2 }"
  services.environments.list:
    call: "{ projectId: 'prj-d0k1q2r3s4t5u6v7w8x9' }"
  services.environments.removeResources:
    call: "{ environmentId: 'evm-d0k1q2r3s4t5u6v7w8x9', resourceIds: ['srv-d0k1q2r3s4t5u6v7w8x9'] }"
  services.envGroups.create:
    call: "{ name: 'shared-config', ownerId: 'tea-cjnxpkdhshc73d12t9i0', envVars: [{ key: 'LOG_LEVEL', value: 'info' }] }"
  projects.create:
    call: "{ name: 'storefront', ownerId: 'tea-cjnxpkdhshc73d12t9i0', environments: [{ name: 'production' }] }"
  postgres.create:
    call: "{ name: 'orders-db', ownerId: 'tea-cjnxpkdhshc73d12t9i0', plan: 'basic_256mb', version: '17' }"
  logs.list:
    call: "{ ownerId: 'tea-cjnxpkdhshc73d12t9i0', resource: ['srv-d0k1q2r3s4t5u6v7w8x9'], limit: 50 }"
  blueprints.validate:
    call: "{ ownerId: 'tea-cjnxpkdhshc73d12t9i0', file: 'services:\\n  - type: web\\n    name: api\\n    runtime: node\\n' }"
  final.updateEnvVar:
    call: "{ id: 'srv-d0k1q2r3s4t5u6v7w8x9', key: 'LOG_LEVEL', value: 'debug' }"
  final.updateEnvVarsForService:
    call: "{ id: 'srv-d0k1q2r3s4t5u6v7w8x9', body: [{ key: 'LOG_LEVEL', value: 'info' }, { key: 'SESSION_SECRET', generateValue: true }] }"
  final.updateRoutes:
    call: "{ id: 'srv-d0k1q2r3s4t5u6v7w8x9', body: [{ type: 'rewrite', source: '/app/*', destination: '/index.html' }] }"
  final.retrieveDeploy:
    call: "{ id: 'srv-d0k1q2r3s4t5u6v7w8x9', key: 'dep-d0k1q2r3s4t5u6v7w8y0' }"
  automation.createTaskRun:
    call: "{ task: 'my-workflow/send-report', input: ['weekly'] }"
