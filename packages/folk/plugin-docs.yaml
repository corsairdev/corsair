displayName: Folk
description: Manage people, companies, groups, interactions, notes, users, and credits with Folk's relationship management API.
domain: folk.app
recommendedAuth: api_key
overviewNote: |
  Folk provides a public REST API at `https://api.folk.app/v1` to manage relationships for service businesses and high-touch teams.

  - **Authentication:** Use an API key from workspace settings under API. Pass it as a Bearer token (`Authorization: Bearer <key>`).
  - **Rate limits:** Folk applies rate limits per user across two concurrent windows: a default limit of 600 requests per minute, and a burst limit of 20 requests per 2 seconds. The plugin automatically reads standard `Retry-After` headers on 429 responses.
  - **Idempotency:** Modifying endpoints (`POST`, `PATCH`, `DELETE`) accept an optional `idempotencyKey` parameter that passes an `Idempotency-Key` header to safely retry requests without duplication.
  - **Custom fields:** People and companies support `customFieldValues` mapped by group ID and custom field name.
examples:
  read:
    path: people.list
    title: List workspace contacts
    args:
      limit: 10
  write:
    path: people.create
    title: Create a person contact
    args:
      firstName: Jane
      lastName: Doe
      emails:
        - jane.doe@example.com
apiExamples:
  people.list:
    call: "{ limit: 10 }"
  people.get:
    call: "{ personId: 'per_183ed5cc-3182-45de-84d1-d520f2604810' }"
  people.create:
    call: "{ firstName: 'Jane', lastName: 'Doe', emails: ['jane.doe@example.com'] }"
  people.update:
    call: "{ personId: 'per_183ed5cc-3182-45de-84d1-d520f2604810', jobTitle: 'Senior Lead' }"
  people.delete:
    call: "{ personId: 'per_183ed5cc-3182-45de-84d1-d520f2604810' }"
  companies.list:
    call: "{ limit: 10 }"
  companies.get:
    call: "{ companyId: 'com_92346499-30bf-4278-ae8e-4aa3ae2ace2c' }"
  companies.create:
    call: "{ name: 'Acme Corporation' }"
  companies.update:
    call: "{ companyId: 'com_92346499-30bf-4278-ae8e-4aa3ae2ace2c', description: 'Enterprise Software' }"
  companies.delete:
    call: "{ companyId: 'com_92346499-30bf-4278-ae8e-4aa3ae2ace2c' }"
  groups.list:
    call: "{ limit: 10 }"
  groups.create:
    call: "{ name: 'Strategic Partners', visibility: 'public' }"
  groups.update:
    call: "{ groupId: 'grp_5fa60242-0756-4e31-8cca-30c2c5ff1ac2', name: 'Key Partners' }"
  groupMembers.list:
    call: "{ groupId: 'grp_5fa60242-0756-4e31-8cca-30c2c5ff1ac2' }"
  groupMembers.add:
    call: "{ groupId: 'grp_5fa60242-0756-4e31-8cca-30c2c5ff1ac2', id: 'usr_bc984b3f-0386-434d-82d7-a91eb6badd71', role: 'contributor' }"
  groupMembers.update:
    call: "{ groupId: 'grp_5fa60242-0756-4e31-8cca-30c2c5ff1ac2', userId: 'usr_bc984b3f-0386-434d-82d7-a91eb6badd71', role: 'admin' }"
  groupMembers.remove:
    call: "{ groupId: 'grp_5fa60242-0756-4e31-8cca-30c2c5ff1ac2', userId: 'usr_bc984b3f-0386-434d-82d7-a91eb6badd71' }"
  interactions.list:
    call: "{ entityId: 'per_183ed5cc-3182-45de-84d1-d520f2604810', timeframe: 'past' }"
  interactions.listPast:
    call: "{ entityId: 'per_183ed5cc-3182-45de-84d1-d520f2604810' }"
  interactions.listUpcoming:
    call: "{ entityId: 'per_183ed5cc-3182-45de-84d1-d520f2604810' }"
  interactions.get:
    call: "{ interactionId: 'lit_b049db09-c03d-4f32-96d6-d314760add5d', entityId: 'per_183ed5cc-3182-45de-84d1-d520f2604810' }"
  interactions.create:
    call: "{ entity: { id: 'per_183ed5cc-3182-45de-84d1-d520f2604810' }, dateTime: '2025-07-17T09:00:00.000Z', title: 'Coffee Catchup', content: 'Met to discuss roadmap' }"
  interactions.update:
    call: "{ interactionId: 'lit_b049db09-c03d-4f32-96d6-d314760add5d', entity: { id: 'per_183ed5cc-3182-45de-84d1-d520f2604810' }, title: 'Follow-up Call' }"
  interactions.delete:
    call: "{ interactionId: 'lit_b049db09-c03d-4f32-96d6-d314760add5d', entityId: 'per_183ed5cc-3182-45de-84d1-d520f2604810' }"
  notes.list:
    call: "{ limit: 10 }"
  notes.get:
    call: "{ noteId: 'nte_14c18444-a0c7-459a-86b0-ccd70ebcd65c' }"
  notes.create:
    call: "{ entity: { id: 'per_183ed5cc-3182-45de-84d1-d520f2604810' }, visibility: 'public', content: 'Follow-up planned for next month' }"
  notes.update:
    call: "{ noteId: 'nte_14c18444-a0c7-459a-86b0-ccd70ebcd65c', content: 'Updated meeting notes' }"
  notes.delete:
    call: "{ noteId: 'nte_14c18444-a0c7-459a-86b0-ccd70ebcd65c' }"
  users.list:
    call: "{ limit: 10 }"
  users.getCurrentUser:
    call: "{}"
  users.get:
    call: "{ userId: 'usr_bc984b3f-0386-434d-82d7-a91eb6badd71' }"
  credits.get:
    call: "{}"
