displayName: Callingly
description: Lead response management platform that automates immediate phone calls and text follow-ups to new leads.
recommendedAuth: api_key
examples:
  read:
    path: leads.list
    title: List leads
  write:
    path: leads.create
    title: Create lead
    args:
      name: John Doe
      phone_number: '+15551234567'
dbExample:
  entity: leads
  note: Search synced leads without hitting Callingly's API.
  data:
    status: new
  limit: 50
exampleWebhook:
  path: calls.completed
  note: React when a call completes and its outcome is logged.
  after: |
    const duration = result.data?.duration;
    console.log('Call completed with duration:', duration);
