apiNotes:
  storms.list: >-
    The list read pages with start and results and answers hasmore plus the
    storms array; walk it by advancing start until hasmore is false.
    Filters combine: team, folder and needle narrow the result, and the
    documented status values are active and closed.
  storms.close: >-
    Closing answers {"message": "Storm closed"} and can be undone with
    api.storms.reopen, so it is registered as a write rather than a delete.
  storms.favorite: >-
    The favorite and unfavorite toggles carry no documented response
    example, so their output schema accepts any JSON object.
  ideas.create: >-
    Stormboard assigns the id; the answer carries it as {"message": "idea
    created", "id": 10000001}. The color and shape values have API defaults
    (yellow, standard) and the docs name no closed list, so they pass
    through as strings.
  ideas.deleteConnectorBetween: >-
    The documented delete-between route takes the two idea ids as request
    parameters, which travel as query parameters on a DELETE.
