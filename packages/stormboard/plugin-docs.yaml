displayName: Stormboard
description: >-
  Stormboard turns unstructured collaboration into data-rich workspaces.
  This plugin manages storms and ideas with comments, votes, connectors,
  tags and tasks, handles chat and invitations, and reads the account
  profile behind the token.
domain: stormboard.com
recommendedAuth: api_key
overviewNote: >-
  The API key sits on the API tab of the Stormboard account
  (stormboard.com/users/account#api) and authenticates with the X-API-Key
  header. Some operations need an active team subscription; the docs mark
  each route's availability (Public, Team Members, Team Owners). The API
  uses standard rate-limiting headers (RateLimit-Limit,
  RateLimit-Remaining, RateLimit-Reset) and answers 429 when the period
  quota is spent, which this plugin waits out before retrying. The two
  documented /templates routes answer an HTML 404 on the live API, so they
  are left out of this plugin; a team's template list is reachable through
  api.folders.list. Response examples mix numeric and string ids across
  routes, so id fields accept both.
examples:
  read:
    path: storms.list
    title: List your Storms
  write:
    path: ideas.create
    title: Create an idea on a Storm
