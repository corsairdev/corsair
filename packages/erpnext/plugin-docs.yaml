# Display copy for the docs, the catalog, corsair.dev and Hub.
# `pnpm validate:plugins` fails until the TODO is replaced.
displayName: "ERPNext"
description: Open-source ERP integration for documents, DocTypes, workflows, stock, selling, buying, and accounting over the Frappe REST API.
domain: frappe.io
recommendedAuth: api_key
overviewNote: |
  Authenticate with a Frappe token pair: `Authorization: token <api_key>:<api_secret>`, created per user under Settings > My Settings > API Access. Every ERPNext deployment is its own site, so a token only works on the site that issued it: pass `baseUrl` to pin one site for every account, or leave it out and store `base_url` per account. Credentials and their site always come from the same source.

  This plugin implements the requested 51 operations over the generic Frappe REST surface. Inbound webhooks are not included.
factory:
  note: Pass `baseUrl` to pin one site for every account, or leave it out and store `base_url` per account.
  options:
    baseUrl: https://yourcompany.frappe.cloud
