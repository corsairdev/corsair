# Display copy for the docs, the catalog, corsair.dev and Hub.
# `pnpm validate:plugins` fails until the TODO is replaced.
displayName: "ERPNext"
description: Open-source ERP integration for documents, DocTypes, workflows, stock, selling, buying, and accounting over the Frappe REST API.
domain: frappe.io
recommendedAuth: api_key
overviewNote: |
  Authenticate with a Frappe token pair: `Authorization: token <api_key>:<api_secret>`, created per user under Settings > My Settings > API Access. Every ERPNext deployment is its own site, so a token only works on the site that issued it. When credentials are configured explicitly, set the matching `baseUrl` beside them. When credentials come from a connected account, that account must also store its matching `base_url`; requests do not fall back to the plugin option. The site URL must be an https URL (for example `https://yourcompany.frappe.cloud`); without one, Corsair raises AuthMissingError so the account can be connected with it.

  Submitting, cancelling and workflow transitions cannot be undone, and stock entries made by `erp.makeStockEntry` are submitted unless `do_not_submit` is set, so those operations are `destructive`. So is `desk.addComment`: users @mentioned in a comment get an email.

  This plugin implements the requested 51 operations over the generic Frappe REST surface. Inbound webhooks are not included.
factory:
  note: |
    A connected account needs three fields: `api_key`, `api_secret` and the site's `base_url`. Store them together, for example `pnpm corsair setup --plugin=erpnext --tenant=acme api_key=<your-key> api_secret=<your-secret> base_url=https://yourcompany.frappe.cloud`, and call `erpnext()` with no options. `baseUrl` applies only to credentials passed in code, for that same site: `erpnext({ apiKey: process.env.ERPNEXT_API_KEY, apiSecret: process.env.ERPNEXT_API_SECRET, baseUrl: 'https://yourcompany.frappe.cloud' })`.
examples:
  read:
    path: desk.searchGlobal
    title: Search customers
    args:
      doctype: Customer
      txt: Acme
      page_length: 10
  write:
    path: desk.addComment
    title: Add a customer comment
    args:
      body:
        reference_doctype: Customer
        reference_name: CUST-0001
        content: Follow-up scheduled for Friday.
        comment_email: agent@example.com
        comment_by: Corsair Agent
apiExamples:
  desk.searchGlobal:
    doctype: Customer
    txt: Acme
    page_length: 10
  desk.addComment:
    body:
      reference_doctype: Customer
      reference_name: CUST-0001
      content: Follow-up scheduled for Friday.
      comment_email: agent@example.com
      comment_by: Corsair Agent
