displayName: Spondyr
description: 'Generate and deliver template-driven correspondence, and manage the templates, recipients, conditions and search filters behind it.'
domain: spondyr.io
recommendedAuth: api_key
overviewNote: |
  Spondyr needs two credentials: the Subscription APIKey and the Application Token. Both are on your subscription and application records in the Spondyr dashboard. Set the API key as the plugin key and pass the Application Token as `applicationToken` in the plugin options, or store both on the account. The plugin sends them as `APIKey` and `ApplicationToken` headers.

  Things to know before you send:

  - **A 200 can mean the request failed.** Spondyr reports most failures with `APIStatus: "ERROR"` inside a normal response. The plugin throws a 400 `ApiError` with Spondyr's `ErrorMessage` in that case, so a resolved promise means the request was accepted.
  - **Generate then deliver.** `correspondence.send` with `is_generate_only: true` generates the document without delivering it. `correspondence.deliver` then sends it, optionally to extra recipients.
  - **Status codes.** `SUBMITTED` and `MATCH` mean work is still in progress, `FINISH` and `FINISHPART` are terminal, and `NOMATCH` means no template matched the event. Poll `correspondence.status`, passing the `ReferenceID` that `send` returned as `reference_id`.
  - **Templates come from uploaded content.** Call `templates.uploadContent` with the base64 file first, then pass the `ReferenceID` it returns as `template_content_reference_id` to `templates.create`. One upload can attach to a single template.
  - **Placeholders merge transaction data.** A Recipient's address fields and a Search Filter's tag may hold `{FieldName}` tokens that Spondyr fills from the transaction data.
  - **Errors are text.** A wrong credential arrives as a plain 400 with the reason in `ErrorMessage`, the same status a bad field gets. The plugin reads the message to tell them apart.
  - **No webhooks.** Spondyr calls a status callback URI you configure on the application, which this plugin does not receive. Poll `correspondence.status` or `batch.status` instead.
examples:
  read:
    path: transactionTypes.list
    title: List the Transaction Types on the subscription
  write:
    path: correspondence.send
    title: Generate a document and hold it for review
    args:
      event_type: OrderPlaced
      is_generate_only: true
      data:
        OrderNumber: 12345
        Customer:
          FirstName: John
          LastName: Doe
          Email: john@acme.com
apiExamples:
  correspondence.send:
    call: "{ event_type: 'OrderPlaced', data: { OrderNumber: 12345 }, is_generate_only: true }"
  correspondence.deliver:
    call: "{ reference_id: 'c1a2b3-reference', original_recipients: 'All' }"
  correspondence.status:
    call: "{ reference_id: 'c1a2b3-reference', include_data: true }"
  correspondence.retry:
    call: "{ reference_id: 'c1a2b3-reference' }"
  correspondence.search:
    call: "{ event_type: 'OrderPlaced', page: 1, page_size: 50 }"
  batch.send:
    call: "{ event_type: 'OrderPlaced', data: [{ Recipient: 'a@acme.com' }, { Recipient: 'b@acme.com' }], shared_data: { Message: 'Hello World!' } }"
  batch.status:
    call: "{ reference_id: 'batch-reference' }"
  transactionTypes.list: {}
  transactionTypes.get:
    call: "{ transaction_type: 'Customer Orders' }"
  transactionTypes.create:
    call: "{ name: 'Customer Orders', template_json: '{\"OrderNumber\":12345}' }"
  transactionTypes.update:
    call: "{ transaction_type: 'Customer Orders', name: 'Orders', template_json: '{\"OrderNumber\":12345}' }"
  transactionTypes.delete:
    call: "{ transaction_type: 'Customer Orders' }"
  eventTypes.list:
    call: "{ transaction_type: 'Customer Orders' }"
  eventTypes.get:
    call: "{ event_type: 'OrderPlaced' }"
  eventTypes.create:
    call: "{ transaction_type: 'Customer Orders', name: 'OrderPlaced' }"
  eventTypes.update:
    call: "{ transaction_type: 'Customer Orders', event_type: 'OrderPlaced', name: 'OrderCreated' }"
  eventTypes.delete:
    call: "{ event_type: 'OrderPlaced' }"
  recipients.list:
    call: "{ transaction_type: 'Customer Orders' }"
  recipients.get:
    call: "{ transaction_type: 'Customer Orders', recipient: 'Customer' }"
  recipients.create:
    call: "{ transaction_type: 'Customer Orders', name: 'Customer', email: '{Customer.Email}' }"
  recipients.update:
    call: "{ transaction_type: 'Customer Orders', recipient: 'Customer', name: 'Customer', mobile_phone: '{Customer.Mobile}' }"
  recipients.delete:
    call: "{ transaction_type: 'Customer Orders', recipient: 'Customer' }"
  conditions.list:
    call: "{ transaction_type: 'Customer Orders' }"
  conditions.get:
    call: "{ transaction_type: 'Customer Orders', condition: 'Is Express' }"
  conditions.create:
    call: "{ transaction_type: 'Customer Orders', name: 'Is Express', field_name: 'Shipping', possible_values: 'Express' }"
  conditions.update:
    call: "{ transaction_type: 'Customer Orders', condition: 'Is Express', name: 'Is Express', field_name: 'Shipping' }"
  conditions.delete:
    call: "{ transaction_type: 'Customer Orders', condition: 'Is Express' }"
  searchFilters.list:
    call: "{ transaction_type: 'Customer Orders' }"
  searchFilters.get:
    call: "{ search: 'OrderNumber' }"
  searchFilters.create:
    call: "{ transaction_type: 'Customer Orders', name: 'OrderNumber', tag: '{OrderNumber}' }"
  searchFilters.update:
    call: "{ transaction_type: 'Customer Orders', search: 'OrderNumber', name: 'OrderNumber', tag: '{OrderNumber}' }"
  searchFilters.delete:
    call: "{ search: 'OrderNumber' }"
  templates.list:
    call: "{ transaction_type: 'Customer Orders' }"
  templates.get:
    call: "{ transaction_type: 'Customer Orders', template: 'Order Confirmation' }"
  templates.create:
    call: "{ transaction_type: 'Customer Orders', name: 'Order Confirmation', event_type: 'OrderPlaced', content_type: 'PDF', template_content_reference_id: '9f2c', recipients: [{ name: 'Customer', delivery_method: 'Email', email_subject: 'Your order' }] }"
  templates.update:
    call: "{ transaction_type: 'Customer Orders', template: 'Order Confirmation', name: 'Order Confirmation', event_type: 'OrderPlaced', content_type: 'PDF', template_content_reference_id: '9f2c', recipients: [{ name: 'Customer', delivery_method: 'Email' }] }"
  templates.delete:
    call: "{ transaction_type: 'Customer Orders', template: 'Order Confirmation' }"
  templates.uploadContent:
    call: "{ content: 'JVBERi0xLjQK' }"
apiNotes:
  correspondence.send: 'Pass `is_generate_only: true` to generate without delivering. The returned `ReferenceID` is what the status and deliver calls take.'
  correspondence.deliver: 'Set `original_recipients` to "None" to deliver only to `new_recipients`. A targeted delivery method needs the matching address, which the input schema checks.'
  correspondence.status: '`MATCH` and `SUBMITTED` mean work is still running. `FINISH` and `FINISHPART` are terminal, and `NOMATCH` means no template matched.'
  correspondence.search: 'Omit `event_type` to search every type. `page_size` is capped at 250.'
  batch.send: '`shared_data` is merged into every entry of `data`. The response ReferenceID is for `batch.status`.'
  transactionTypes.create: '`template_json` is the JSON sample that defines the fields available to templates.'
  transactionTypes.delete: 'Deletes the type along with the templates, conditions and search filters built on it.'
  recipients.create: 'Any address field may hold a `{FieldName}` placeholder that Spondyr resolves from the transaction data.'
  searchFilters.get: 'This route takes only the name; it is not scoped by Transaction Type.'
  templates.create: 'Upload the file with `templates.uploadContent` first and pass its ReferenceID. DocuSign delivery needs at least one signer.'
  templates.uploadContent: 'Content is base64, and the returned ReferenceID can attach to one template only.'
