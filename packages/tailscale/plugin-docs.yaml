# Display copy for the docs, the catalog, corsair.dev and Hub, and one call
# example per operation. Generated with the plugin from Tailscale's OpenAPI
# spec; docs-examples.test.ts parses every example with its input schema.
displayName: Tailscale
description: "Run a tailnet from an agent: list and approve devices, mint tagged, ephemeral auth keys for new nodes, read, validate and safely update the policy file (ACLs and grants, with etag checks and ACL tests), publish internal apps and MCP servers as Tailscale Services, and manage DNS, users, invites, webhooks, posture attributes and the configuration audit log (93 operations)."
overviewNote: "Connect with an API access token (expires after at most 90 days) or, better for a team, an OAuth client secret (tskey-client-...), which never expires and carries only the scopes it was given. Every call addresses the tailnet the key belongs to unless `tailnet` is set. Change the policy file with `policyFile.validate` first, then `policyFile.set` with the etag from `policyFile.get`."
examples:
  read:
    path: devices.list
    title: List tagged servers
    args: {"filters": {"tags": ["tag:mcp"]}}
  write:
    path: keys.create
    title: Mint an auth key for an agent node
    args: {"description": "agent node", "expirySeconds": 3600, "capabilities": {"devices": {"create": {"reusable": false, "ephemeral": true, "preauthorized": true, "tags": ["tag:agent"]}}}}
