displayName: Asana
description: Work management platform for tasks, projects, teams, and cross-functional collaboration.

examples:
  read:
    path: tasks.list
    title: List tasks
  write:
    path: tasks.create
    title: Create a task
    args:
      data:
        name: Follow up from Corsair

dbExample:
  entity: tasks
  note: 'Search synced tasks without hitting Asana.'
  data:
    completed: false
  limit: 50

exampleWebhook:
  path: tasks.taskEvent
  note: 'Fires on Asana task create/update events. Do not use challenge.challenge.'
  after: |
    console.log('Asana task event:', result.data);
