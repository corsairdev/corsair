# Display copy for the docs, the catalog, corsair.dev and Hub.
displayName: Loops
description: Email platform for software companies with Loops - manage contacts, properties, lists and suppressions, send events and transactional email, build campaigns, workflows, email messages, themes, components and footers, read metrics, and receive signed webhooks.
domain: loops.so
recommendedAuth: api_key
overviewNote: |
  Create a key in Loops under Settings, API (https://app.loops.so/settings?page=api) and paste it as the API key. One key per team; it has full account access, so keep it server-side.

  - **Real email.** `events.send` can trigger workflows that email real people, and `transactional.send` delivers a published transactional email to a real inbox. `transactionalId` is the id of a transactional email you created in the Loops dashboard, not the recipient.
  - **Upserts.** `contacts.update` creates the contact when no match exists, so it cannot fail with not-found. `contacts.create` answers 409 when the email or userId already exists.
  - **Deleting a contact is permanent.** `contacts.delete` removes the contact and its subscriptions; there is no restore call.
  - **Custom properties.** Pass them under `customProperties`; values can be strings (max 500 characters), numbers or booleans, and they land on the request body beside the fixed fields, so a key like `email` or `userId` there is rejected. A custom property must exist in the team before a call sets it: create it once with `contacts.createProperty` or in the dashboard. The write example's `planName` needs `contacts.createProperty({ name: 'planName', type: 'string' })` first on a new team.
  - **Success envelope.** A 2xx body with `success: false` is still a failure: the plugin throws core's `ApiError` with Loops' message (status 200). Errors keep Loops' answer in `body` (validation failures name a `path` there) and leave out the request body, which holds contact data and template variables.
  - **Feature gating.** Campaigns, campaign/transactional/workflow groups, transactional-email management, email messages, workflows and workflow nodes, themes, components, footers, uploads, audience segments and event patterns use Loops' content API. A team without it gets a 401 whose message says the feature is not enabled; the plugin keeps that apart from a bad key and never retries it.
  - **Campaign sends.** `campaigns.create` and `campaigns.update` take `scheduling`; `{ method: 'now' }` sends the campaign to its whole audience, so both are `destructive`. Leave `scheduling` out to work on a draft.
  - **Workflow edits use revisions.** Workflow and node writes need the workflow's current `expectedRevisionId` (from `workflows.get`) and answer 409 on a stale one. `workflows.changeMailingList` and the node deletes take `dryRun: true`; with queued contacts they answer `status: 'queuedContactsFound'` until you pass `queuedContactPolicy`.
  - **Uploads.** `uploads.create` answers a presigned URL; PUT the file there yourself, then call `uploads.complete`.
  - **Pagination.** List calls take `perPage` (10 to 50) and `cursor`; the next cursor is `pagination.nextCursor`. `lists.list` and `contacts.listProperties` answer bare arrays.
  - **Rate limits.** 10 requests per second per team. Loops sends `x-ratelimit-limit` and `x-ratelimit-remaining` but no Retry-After; the plugin retries a 429 up to three times with exponential backoff, except a used-up quota (50 uploads per 24 hours, the daily preview limit), which it returns at once.
  - **Idempotency.** `transactional.send` and `events.send` accept an `idempotencyKey` (max 100 characters). Reusing one within 24 hours answers 409 instead of sending a duplicate. Passing a key also lets the plugin replay a 5xx safely; other writes are never replayed.
  - **Inbound webhooks.** Loops signs every delivery the Standard Webhooks way (`webhook-id`, `webhook-timestamp`, `webhook-signature: v1,<base64>`) with the signing secret from Settings → Webhooks (one endpoint per team). Set `webhookSecret`, or store it with `keys.set_webhook_signature`. Verification needs the untouched request body; deliveries more than five minutes off are refused. Events: `contact.created`, `contact.unsubscribed`, `contact.deleted`, `contact.mailingListSubscribed`, `contact.mailingListUnsubscribed`, `transactional.emailSent`, `campaign.emailSent`, `loop.emailSent`, `email.delivered`, `email.softBounced`, `email.hardBounced`, `email.opened`, `email.clicked`, `email.unsubscribed`, `email.resubscribed`, `email.spamReported` and `testing.testEvent`.
examples:
  read:
    path: lists.list
    title: List mailing lists
    args: {}
  write:
    path: contacts.create
    title: Create a contact with a custom property
    args:
      email: jordan@acme-logistics.com
      firstName: Jordan
      subscribed: true
      customProperties:
        planName: Pro
apiExamples:
  apikey.verifyConnection:
    call: '{}'
  contacts.find:
    call: "{ email: 'alex@company.com' }"
  contacts.create:
    call: "{ email: 'jordan@acme-logistics.com', firstName: 'Jordan', customProperties: { planName: 'Pro' } }"
  contacts.update:
    call: "{ userId: 'usr_7f8e9d0c1b2a', lastName: 'Rivera' }"
  contacts.delete:
    call: "{ userId: 'usr_7f8e9d0c1b2a' }"
  contacts.listProperties:
    call: "{ list: 'custom' }"
  contacts.getSuppression:
    call: "{ email: 'alex@company.com' }"
  events.send:
    call: "{ eventName: 'signup', email: 'alex@company.com', eventProperties: { plan: 'pro' } }"
  transactional.send:
    call: "{ email: 'alex@company.com', transactionalId: 'cll42l54f20i1la0lfooe3z12', dataVariables: { name: 'Alex' }, idempotencyKey: '0e8e17e0-3e73-4c8b-b7c9-2a5a6d3f9c1d' }"
  lists.list:
    call: '{}'
  campaigns.list:
    call: '{ perPage: 20 }'
  campaigns.create:
    call: "{ name: 'Spring announcement', mailingListId: 'clm2k8j4h6g0f8d6s4a2b0z8' }"
  workflows.get:
    call: "{ workflowId: 'clw1a3b5c7d9e1f3g5h7i9j1' }"
  transactionalEmails.list:
    call: '{ perPage: 20 }'
  contacts.createProperty:
    call: "{ name: 'planName', type: 'string' }"
  emailMessages.render:
    call: "{ emailMessageId: 'cle5f7g9h1i3j5k7l9m1n3p5', contactProperties: { firstName: 'Alex' } }"
apiNotes:
  contacts.update: 'Updates by email or userId and upserts when no match exists, so a typo in the selector silently creates a new contact.'
  contacts.delete: 'Permanent. Loops answers 404 when the contact does not exist.'
  events.send: 'Needs eventName and one of email or userId. Fires any workflow that listens for the event, which can send email to the contact.'
  campaigns.create: 'Creates a draft and its empty email message (emailMessageId); set subject and content with emailMessages.update. scheduling { method: now } sends at once.'
  contacts.removeSuppression: 'Uses one of a small rolling 30-day removal quota (see contacts.getSuppression).'
  emailMessages.sendPreview: 'Sends real preview emails to every address in emails. Campaign previews take contactProperties, workflow previews also eventProperties, transactional previews dataVariables.'
  transactional.send: 'The transactionalId must name a published transactional email. Requires the data variables that email declares; missing ones answer 400 with their names in the message.'
  contacts.listProperties: "Pass list: 'all' or list: 'custom'; the answer is a bare array, not a paginated envelope."
  lists.list: 'The answer is a bare array. There is no pagination on this endpoint.'
