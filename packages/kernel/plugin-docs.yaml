# Display copy for the docs, the catalog, corsair.dev and Hub, and one call
# example per operation. Generated with the plugin from Kernel's OpenAPI spec;
# docs-examples.test.ts parses every example with its input schema.
displayName: Kernel
description: "Cloud browsers for agents: start headless or headful Chromium sessions, drive them with Playwright, computer controls or WebMCP in one call, hand a session to a person through a live view, keep logins in profiles and managed auth, and manage files, processes, replays, proxies, extensions, pools and vaults (200 operations)."
overviewNote: "A browser bills per second while active and holds a concurrency slot until it is deleted: call `browsers.delete` when done. `headless: true` costs about 8x less than headful but has no live view. `browsers.playwright.execute` acts on a page in one call. Screenshots, file reads, replays and archives come back as files. Kernel's event streams (SSE) are left out; poll the matching `get` instead."
examples:
