    path: sandboxes.list
    title: List sandboxes
    args: {}
  write:
    path: sandboxes.commands.run
    title: Run a command in a sandbox
    args: {"sandboxId": "bx_23456789", "command": "uname -a", "timeoutSeconds": 30}
