displayName: Qdrant
description: Vector search engine for semantic, hybrid and filtered search over embeddings, self-hosted or on Qdrant Cloud.
domain: qdrant.tech
overviewNote: |
  Works with self-hosted Qdrant and [Qdrant Cloud](https://cloud.qdrant.io). Each account stores its cluster URL as `base_url` next to its API key. The URL is never taken from endpoint input. A stored URL must use https and a public host; pin a local or private cluster such as `http://localhost:6333` or `http://qdrant:6333` with the `baseUrl` option.
recommendedAuth: api_key
factory:
  note: Pass `baseUrl` to pin one cluster for every account, or leave it out and store `base_url` per account.
  options:
    baseUrl: https://xyz-example.eu-central.aws.cloud.qdrant.io:6333
examples:
  read:
    path: query.points
    title: Find the nearest neighbours of a vector
    args:
      collectionName: docs
      query: [0.12, 0.08, 0.91, 0.33]
      filter:
        must:
          - key: lang
            match:
              value: en
      limit: 5
      with_payload: true
  write:
    path: points.upsert
    title: Store embeddings with their payload
    args:
      collectionName: docs
      points:
        - id: 1
          vector: [0.12, 0.08, 0.91, 0.33]
          payload:
            url: https://example.com/guide
            lang: en
apiExamples:
  collections.list: {}
  collections.get:
    collectionName: docs
  collections.exists:
    collectionName: docs
  collections.update:
    collectionName: docs
    optimizers_config:
      indexing_threshold: 20000
  collections.delete:
    collectionName: docs_old
  aliases.list: {}
  aliases.listForCollection:
    collectionName: docs
  payloadIndexes.create:
    collectionName: docs
    field_name: lang
    field_schema:
      type: keyword
  payloadIndexes.delete:
    collectionName: docs
    fieldName: lang
  points.upsert:
    collectionName: docs
    points:
      - id: 1
        vector: [0.12, 0.08, 0.91, 0.33]
        payload:
          url: https://example.com/guide
          lang: en
  points.get:
    collectionName: docs
    ids: [1, 2]
    with_payload: true
  points.delete:
    collectionName: docs
    points: [1, 2]
  points.count:
    collectionName: docs
    filter:
      must:
        - key: lang
          match:
            value: en
    exact: true
  points.setPayload:
    collectionName: docs
    payload:
      reviewed: true
    points: [1]
  points.overwritePayload:
    collectionName: docs
    payload:
      url: https://example.com/guide
      lang: de
    points: [1]
  points.deletePayload:
    collectionName: docs
    keys: [reviewed]
    points: [1]
  points.clearPayload:
    collectionName: docs
    filter:
      must:
        - key: lang
          match:
            value: en
  points.updateVectors:
    collectionName: docs
    points:
      - id: 1
        vector:
          dense: [0.12, 0.08, 0.91, 0.33]
  points.deleteVectors:
    collectionName: docs
    vector: [bm25]
    points: [1]
  query.points:
    collectionName: docs
    query: [0.12, 0.08, 0.91, 0.33]
    limit: 5
    with_payload: true
  query.batch:
    collectionName: docs
    searches:
      - query: [0.12, 0.08, 0.91, 0.33]
        limit: 3
      - query: 1
        limit: 3
  query.facet:
    collectionName: docs
    key: lang
    exact: true
  snapshots.list:
    collectionName: docs
  snapshots.create:
    collectionName: docs
  snapshots.delete:
    collectionName: docs
    snapshotName: docs-2026-11-05-20-09-51.snapshot
  collections.create:
    collectionName: docs
    vectors:
      dense:
        size: 384
        distance: Cosine
    sparse_vectors:
      bm25:
        modifier: idf
  points.scroll:
    collectionName: docs
    filter:
      must:
        - key: lang
          match:
            value: en
    limit: 100
  query.groups:
    collectionName: docs
    query: [0.12, 0.08, 0.91, 0.33]
    group_by: document_id
    group_size: 1
    limit: 10
  aliases.update:
    actions:
      - delete_alias:
          alias_name: docs_live
      - create_alias:
          collection_name: docs_v2
          alias_name: docs_live
