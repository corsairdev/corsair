displayName: Loomio
description: Group decision making with Loomio - browse groups, threads and discussions, read thread timelines and markdown exports, start discussions and comments, and create polls.
domain: loomio.com
recommendedAuth: api_key
overviewNote: |
  Create an API key by signing in at loomio.com and opening the API access page at https://www.loomio.com/profile/api_access. The page also lists your groups with their numeric ids, which every group-scoped call needs.

  - **The key is you.** The key acts as its full user account, with that account's permissions and visibility. Loomio recommends a dedicated bot account for integrations. The key rotates when the account's password changes.
  - **Header auth only.** Requests authenticate with `Authorization: Bearer <key>`. Query-string keys are rejected. This plugin always talks to `https://www.loomio.com/api/user0` (never the legacy `/api/b2` prefix, which renames poll fields), so self-hosted installs are not reachable with it.
  - **Bad keys answer 403.** A missing or invalid key gets 403 `{"error":"You are not authorized to access this page."}`, and so does a permission denial, even on calls that name a record. The plugin reports both readings on the error.
  - **Compound envelopes.** Every response carries the primary records in an array named after the resource (`groups`, `discussions`, `threads`, `items`, `polls`, `comments`), related records in sibling arrays (users, topics, groups, poll_options, outcomes), and `meta: {root, total}`. Thread titles are not on the thread record: join the related `discussions` (or `polls`) array on `topicable_id`.
  - **Paging.** List calls take `limit` (default 50, capped at 500 for groups and thread items) and `offset`, and return `meta.total` plus a derived `next_offset` that disappears on the last page.
  - **Polls.** A poll without `closing_at` stays a draft with voting disabled. Proposal polls default to the agree, disagree, abstain, and block options when `options` is omitted. Options ride in the related `poll_options` array and the current outcome in `outcomes`, matched by `current_outcome_id`.
  - **No webhooks.** Loomio supports outgoing webhooks (chatbots) for group admins, but this plugin does not receive webhook deliveries and does not manage chatbot registrations.
  - **Writes are not idempotent.** A retry of a failed `discussions.create` or `comments.create` can post twice, so the plugin never replays writes on server errors.
examples:
  read:
    path: discussions.list
    title: List the latest discussions in a group
    args:
      group_id: 12
      limit: 20
  write:
    path: discussions.create
    title: Start a discussion
    args:
      group_id: 12
      title: Spring palette
      description: Pick three colours for the rebrand.
apiExamples:
  groups.list:
    call: "{ limit: 50 }"
  groups.get:
    call: "{ id: 'design' }"
  discussions.list:
    call: "{ group_id: 12, limit: 20 }"
  discussions.get:
    call: "{ id: 'dX2' }"
  discussions.create:
    call: "{ group_id: 12, title: 'Spring palette', description: 'Pick three colours for the rebrand.' }"
  comments.create:
    call: "{ discussion_id: 88, body: 'Sounds good to me.' }"
  threads.list:
    call: "{ limit: 50 }"
  threads.items:
    call: "{ topic_id: 55, limit: 100 }"
  threads.markdown:
    call: "{ topic_id: 55 }"
  polls.list:
    call: "{ group_id: 12, status: 'all', limit: 50 }"
  polls.get:
    call: "{ id: 63 }"
  polls.create:
    call: "{ discussion_id: 88, title: 'Which blue?', poll_type: 'poll', options: ['Sky blue', 'Navy'], closing_at: '2026-04-01T00:00:00.000Z' }"
apiNotes:
  groups.get:
    'The id accepts a numeric id, a url key, or a handle.'
  discussions.list:
    'group_id is required; Loomio answers a missing one with 404 {"error":404}. status takes open (default), closed, or all.'
  discussions.create:
    'A permission denial on create answers the same 403 body a bad key does, so a failure here can mean the account may not post in that group.'
  comments.create:
    'discussion_id is the thread id (the discussion''s topic_id). body_format takes md (default) or html.'
  threads.items:
    'Items come back in ascending sequence order and cap limit at 500. Comments, polls, votes, and outcomes ride in related arrays matched by itemable_id.'
  threads.markdown:
    'Requires export permission on the thread; the thread''s whole visible content comes back as one document under markdown.'
  polls.create:
    'Provide group_id or discussion_id. Omit closing_at (or send null) to keep the poll a draft with voting disabled. For proposals, options default to agree, disagree, abstain, and block.'
  polls.list:
    'status takes active (default), closed, or all. Current outcomes ride in the outcomes array; match current_outcome_id on each poll.'
