displayName: Prerender
description: Prerender service API for recaching pages, searching the cache, submitting sitemaps and tuning the render queue.
domain: prerender.io
recommendedAuth: api_key
overviewNote: |
  Prerender.io serves pre-rendered HTML to crawlers so a JavaScript-heavy site stays indexable, and its REST API controls that cache. Find the token under Security and Access, Prerender Token, and paste it in; it travels as the `prerenderToken` field of the JSON body, and in the path on the status route.

  What to know before you recache:

  - **Recache is the cheap refresh.** `recache` caches a URL for the first time or refreshes one already cached, which is how a longer global cache expiration stays affordable. One call takes either a single `url` or up to 1000 `urls`.
  - **Mobile is a separate entry.** Add `adaptiveType: 'mobile'` to act on the mobile rendering rather than the desktop one, and the same filter on `search` to read one of the two.
  - **Search pages by 200.** `search` matches a substring with `query` or a whole URL with `exactMatch`, at 200 results per page, and takes `start` for the next page. It allows 50 requests a minute and answers 429 past that.
  - **A sitemap adds only new URLs.** `sitemap` caches what is not cached yet and leaves existing entries alone, so use `recache` to refresh them.
  - **Clearing is a job.** `cacheClear` takes a SQL-like pattern where `%` matches any run, schedules a job, and only one job runs at a time. Check it with `cacheClearStatus`, where a 403 means a job is still running rather than a failure.
  - **Recache speed affects your origin.** `changeSpeed` sets how many URLs the queue renders per hour, from 3600 up to 36000, or 0 to restore the automatic delay. A faster rate can overload the origin, so confirm the stack can take it first.
references:
  - title: Prerender.io REST API
    url: https://docs.prerender.io/docs/6-api
  - title: Rendering queues
    url: https://docs.prerender.io/docs/10-recaching
examples:
  read:
    path: cache.search
    title: Search the cache for a path
    args:
      query: example.com/path
      start: 0
  write:
    path: cache.recache
    title: Recache one page
    args:
      url: https://example.com/pricing
apiExamples:
  cache.recache:
    call: "{ url: 'https://example.com/pricing' }"
  cache.search:
    call: "{ query: 'example.com/path', start: 0 }"
  cache.sitemap:
    call: "{ url: 'https://example.com/sitemap.xml' }"
  cache.clear:
    call: "{ query: 'https://example.com%' }"
  cache.clearStatus:
    call: '{}'
  queue.changeSpeed:
    call: '{ urlsPerHour: 18000 }'
