displayName: Make
description: Manage and run Make automation scenarios.
domain: make.com
overviewNote: >-
  Each Make organization lives in one zone (eu1, eu2, us1, us2, celonis-eu1, celonis-us1), so each connected account stores its zone (the `zone` field) next to its API token; the `zone` plugin option overrides it for single-account setups. The token needs the scopes for the operations you call.
  Scenario runs and replays can trigger external actions and consume credits.
  The client does not retry failed requests automatically, including quota-related 429 responses.
  Buildtime variables are not available on Make's free plan, which answers those calls with 403 (SC403).
factory:
  note: "Each connected account stores its Make zone (the `zone` field, for example `eu1`, the subdomain of the Make URL you sign in at) next to its API token: `pnpm corsair setup --plugin=make --tenant=acme zone=eu1`, or the connect page with Hub. Set the `zone` option only for a single-account setup; it overrides the stored value."
  options:
    zone: eu1
examples:
  read:
    path: scenarios.list
    title: List scenarios for a team
    args:
      teamId: 123
  write:
    path: scenarios.update
    title: Rename a scenario
    args:
      scenarioId: 123
      body:
        name: Updated scenario
