displayName: FreeAgent
description: Manage FreeAgent company records, verified sender addresses, contacts, projects, invoices, and tracking groups through its OAuth 2.0 REST API.
domain: freeagent.com
recommendedAuth: oauth_2
examples:
  read:
    path: contacts.list
    title: List contacts
  write:
    path: contacts.create
    title: Create a contact
    args:
      contact:
        organisation_name: Example Ltd
apiExamples:
  company.get: {}
  company.businessCategories: {}
  company.taxTimeline: {}
  emailAddresses.list: {}
  contacts.list: {}
  contacts.get:
    id: '1'
  contacts.create:
    contact:
      organisation_name: Example Ltd
  contacts.update:
    id: '1'
    contact:
      organisation_name: Example Ltd
  contacts.delete:
    id: '1'
  projects.list: {}
  projects.get:
    id: '1'
  projects.create:
    project:
      contact: https://api.freeagent.com/v2/contacts/1
      name: Example Project
      status: Active
      currency: GBP
      budget_units: Hours
  projects.update:
    id: '1'
    project:
      name: Example Project
  projects.delete:
    id: '1'
  invoices.list: {}
  invoices.get:
    id: '1'
  invoices.pdf:
    id: '1'
  invoices.create:
