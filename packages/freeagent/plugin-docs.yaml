apiNotes:
  invoices.create: >-
    FreeAgent creates new invoices in Draft status. Use an explicit status-transition
    operation to mark an invoice sent; this plugin exposes the documented
    transitions. Payment methods are configured with valid documented flags.
  invoices.sendEmail: >-
    Sending an invoice email is a separate action from marking the invoice sent.
    The operation accepts the documented template flag, message fields, and
    base64 attachments up to 5 MiB each.
  invoices.directDebit: >-
    This requests a real GoCardless payment and is available only for sent invoices
    with an enabled pre-authorised mandate and no previous payment.
  invoices.pdf: >-
    FreeAgent returns PDF bytes as base64 in pdf.content; decode that value to
    obtain the PDF file.
  contacts.list: >-
    FreeAgent paginates collections with a default of 25 records and a maximum
    per_page of 100. The result includes pagination.link and pagination.total_count,
    preserving the Link header and X-Total-Count header value respectively.
  emailAddresses.list: >-
    Returns the company's verified sender email addresses. The result includes
    pagination.link and pagination.total_count from FreeAgent's collection headers.
  recurringInvoices.list: >-
    Supports the documented draft, active, or inactive view filter and a contact
    URL filter. Collection pagination uses the standard page and per_page parameters.
  trackingGroups.list: >-
    Hidden groups and labels are omitted by default. Use include_hidden, order_by,
    and reverse as documented; collection pagination uses page and per_page.
  journalSets.update: >-
    Updates can omit unchanged journal-set fields. Existing journal entries are
    updated by URL, deleted with _destroy: true, or added without a URL. Creation
    remains a separate operation that requires at least two entries. This update
    is destructive because entry deletion cannot be undone through this API.
  bills.update: >-
    Existing bill items can be deleted with their URL and _destroy: 1. This
    operation is classified as destructive because item deletion cannot be undone.
  creditNotes.update: >-
    Existing credit note items can be deleted with their id and _destroy: 1. This
    operation is classified as destructive because item deletion cannot be undone.
  invoices.update: >-
    payment_methods accepts the five keys documented on the invoice API. Invalid
    options may be omitted by FreeAgent in responses; stripe and gocardless_preauth
    cannot both be true for one invoice.
  bankTransactionExplanations.listAttachments: >-
    Uses X-Api-Version 2026-09-01, the minimum version documented for the
    Bank Transaction Explanation Attachments API.
  bankTransactionExplanations.createAttachments: >-
    Sends base64 file data as JSON. FreeAgent allows up to ten attachments per
    request and up to fifty on an explanation.
  bankTransactionExplanations.updateAttachments: >-
    A PUT can add, update, and remove attachments together; deletion uses the
    documented _destroy: "true" form.
  expenses.batchCreate: >-
    The first-party API forum confirms a 201 response containing one expense per
    submitted item in order. One observed 422 validation failure created no
    records; this does not establish whether an ambiguous timeout or lost response
    committed. Check for the submitted expenses before retrying an ambiguous
    failure.
  accountLocks.list: >-
    Requires Full Access. Lists user and resource locks. If earliest_lock_date is
    absent, a user account lock cannot be set.
  accountLocks.update: >-
    Requires Full Access. Sets or updates only the user account lock; choose a
    locked_to_date within the bounds returned by accountLocks.list.
  accountLocks.delete: >-
    Requires Full Access. Deletes only the user account lock; other listed locks
    are read-only through this API.
  users.create: >-
    Requires user-management access. When send_invitation is true, FreeAgent sends
    a password setup invitation; this operation is classified as destructive.
  timeslips.create: >-
    This operation creates one timeslip. The API docs also show a batch request
    mode, but do not document its response envelope, so that mode is not exposed.
  estimates.create: >-
    Create estimates as Draft and use status transitions. FreeAgent's first-party
    forum reports Sent is rewritten to Open, while Open and Invoiced are rejected
    at create time; the input schema accepts only verified create statuses.
  estimates.delete: >-
    FreeAgent's first-party forum reports that non-Draft estimates must first be
    returned to Draft with markDraft before deletion.
  bankTransactions.uploadStatement: >-
    Implements the documented JSON transaction-array statement import. The
    alternate multipart file-upload mode is not exposed. FreeAgent can answer
    200 before the transactions appear, so check them with bankTransactions.list
    for the same bank account before treating the import as done.
overviewNote: >-
  Connect a FreeAgent OAuth 2.0 app (client ID and secret from dev.freeagent.com).
  Access tokens last an hour and refresh automatically. Pass sandbox: true to use
  api.sandbox.freeagent.com for both OAuth and the API. Route coverage and all
  unresolved or excluded contracts are listed in the package README; coverage
  remains partial and is not a claim of full API coverage. Three published paths
  are typos that answer 404 on the sandbox, so the plugin uses the working ones:
  tasks delete (DELETE /v2/tasks/:id, not /v2/users/:id), price list item delete
  and bank transaction delete (plural paths). Timeslips batch-create is withheld
  because its response is undocumented. The Bills and Expenses docs omit Monthly
  from their recurring enums, so their input schemas enforce only those published
  values and do not claim Monthly support. The separate Recurring Invoices resource
  documents Monthly. The Accountancy Practice API requires practice-enabled OAuth
  and X-Subdomain client scoping and is excluded.
