apiNotes:
  invoices.create: >-
    FreeAgent creates new invoices in Draft status. Use an explicit status-transition
    operation to mark an invoice sent; this plugin currently exposes markSent.
  invoices.sendEmail: >-
    Sending an invoice email is a separate action from marking the invoice sent.
    The operation accepts the documented template flag, message fields, and
    base64 attachments up to 5 MiB each.
  invoices.directDebit: >-
    This requests a real GoCardless payment and is available only for sent invoices
    with an enabled pre-authorised mandate and no previous payment.
  invoices.pdf: >-
    FreeAgent returns PDF bytes as base64 in pdf.content; decode that value to
    obtain the PDF file.
  contacts.list: >-
    FreeAgent paginates collections with a default of 25 records and a maximum
    per_page of 100. The result includes pagination.link and pagination.total_count,
    preserving the Link header and X-Total-Count header value respectively.
  emailAddresses.list: >-
    Returns the company's verified sender email addresses. The result includes
    pagination.link and pagination.total_count from FreeAgent's collection headers.
  recurringInvoices.list: >-
    Supports the documented draft, active, or inactive view filter and a contact
    URL filter. Collection pagination uses the standard page and per_page parameters.
  trackingGroups.list: >-
    Hidden groups and labels are omitted by default. Use include_hidden, order_by,
    and reverse as documented; collection pagination uses page and per_page.
overviewNote: >-
  Connect a FreeAgent OAuth 2.0 app (client ID and secret from dev.freeagent.com).
  Access tokens last an hour and refresh automatically. Pass sandbox: true to use
  api.sandbox.freeagent.com for both OAuth and the API. This plugin exposes company
  profile, verified sender addresses, contacts, projects, selected invoice and
  recurring invoice operations, and tracking groups. Many other
  official company API routes remain unimplemented; see the linked route inventory
  in the package README. The Accountancy Practice API requires practice-enabled
  OAuth and X-Subdomain client scoping and is excluded.
