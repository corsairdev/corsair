displayName: Teamwork
description: Teamwork.com projects, tasks, task lists, milestones, comments, time tracking, timers, people and companies.
overviewNote: "Store each tenant's Teamwork site as site_name with its API key: acme for acme.teamwork.com, acme.eu for an EU site. The optional siteName plugin option is a global single-site override."
examples:
  read:
    path: tasks.list
    title: List a project's open tasks
    args: {"query":{"projectIds":[1470497],"includeCompletedTasks":false}}
  write:
    path: tasks.create
    title: Create a task without emailing anyone
    args: {"path":{"tasklistId":4073104},"body":{"task":{"name":"Draft the launch post"},"taskOptions":{"notify":false}}}
