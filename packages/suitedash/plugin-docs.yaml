displayName: SuiteDash
description: Client portal CRM from SuiteDash - manage companies, contacts and projects, read the account's custom field definitions, list worlds, and subscribe contacts to marketing audiences.
domain: suitedash.com
recommendedAuth: api_key
overviewNote: |
  SuiteDash's Secure API is behind two credentials, not one. Open Flyout Menu, then Integrations, then Secure API, and copy the Public ID and a Secret Key.

  - The **Public ID** is the plugin's `key`.
  - The **Secret Key** is a second account field. Pass it as `secretKey` or store it as `secret_key` on the account.

  Every call sends both, each in its own header (`X-Public-ID` and `X-Secret-Key`). There is no single-token form.

  Things to know before you write:

  - **A 200 can still mean failure.** Every answer is an envelope, `{ success, message, data }`, and SuiteDash reports some business errors with `success: false` on a 200. The plugin turns that into an error rather than handing it back as data.
  - **The call limit is monthly, not per second.** 80 calls on trial, 400 on Start, 2000 on Thrive, 20000 on Pinnacle, counted per account. A 429 means the allowance is used up, so the plugin never retries it.
  - **A company is addressed by uid or name, a contact by uid or email.** SuiteDash decides which from the value, so no lookup step is needed. A project instead takes an explicit mode in the path: `uid`, `name`, `contains_the_following` or `most_recent`.
  - **Custom fields need the account's own keys.** Every write that touches `public_custom_fields`, `private_custom_fields` or `target_custom_fields` uses keys that are uuids unique to the account. Read them from `companies.meta`, `contacts.meta` or `projects.meta` first.
  - **Custom fields read as an array.** A response sends `public_custom_fields` as an array, usually empty, even though the spec types it as an object. The output accepts both.
  - **A company's `role` decides portal access.** `Lead`, `Client` or `Prospect`, and the same three values on a contact. The write example below omits it because the docs generator cannot render an enum in example arguments; see the API reference for the accepted values.
  - **A contact create needs four fields.** First name, last name, email and role are all required by the spec, and a company create can add its first contact via `primaryContact` with `create_primary_contact_if_not_exists`.
  - **Paging.** Lists report `meta.pagination` with `totalItems`, `totalPages` and a `nextPage` URL. Pass `page` to advance. The `meta` flag controls whether that block and the custom field definitions come back at all.
  - **Marketing subscribe is all-or-nothing at the top.** The answer carries one result per subscriber, and its top-level `success` is true only when every one worked.
examples:
  read:
    path: contacts.list
    title: List contacts created this year
    args:
      createdMin: '2026-01-01T00:00:00+00:00'
      orderBy: created:desc
  write:
    path: contacts.create
    title: Create a contact from a name and email
    args:
      first_name: Matilda
      last_name: Walker
      email: matilda@example.com
apiExamples:
  companies.list:
    call: "{ page: 1, orderBy: 'created:desc' }"
  companies.get:
    call: "{ identifier: 'Schowalter-Parisian', meta: true }"
  companies.create:
    call: "{ name: 'Microsoft', role: 'Client', website: 'https://www.microsoft.com' }"
  companies.update:
    call: "{ identifier: 'e2c43cd3-eb1c-4269-a184-ffd9d26d6ef8', name: 'Microsoft Corporation', role: 'Client' }"
  companies.meta: {}
  contacts.list:
    call: "{ createdMin: '2026-01-01T00:00:00+00:00' }"
  contacts.get:
    call: "{ identifier: 'matilda@example.com' }"
  contacts.create:
    call: "{ first_name: 'Matilda', last_name: 'Walker', email: 'matilda@example.com', role: 'Client' }"
  contacts.update:
    call: "{ identifier: 'aa454efd-4074-3926-a370-e96cda162aa0', title: 'Manager', send_welcome_email: true }"
  contacts.meta: {}
  projects.list:
    call: "{ page: 1 }"
  projects.get:
    call: "{ type: 'contains_the_following', identifier: 'Digital' }"
  projects.update:
    call: "{ type: 'uid', identifier: '2ff558c3-3eb0-48e1-a3bc-4c7f59dfb02f', status: 'Completed' }"
  projects.meta: {}
  worlds.list: {}
  marketing.subscribe:
    call: "{ subscribers: [{ email: 'matilda@example.com', first_name: 'Matilda', audiences: [35, 485] }] }"
apiNotes:
  companies.get: 'The identifier is a uid or an exact name; SuiteDash decides which from the value. Set meta to true to also get the paging and custom field definitions.'
  contacts.get: 'The identifier is a uid or an email address, decided from the value.'
  projects.get: 'The lookup mode is part of the path: uid, name, contains_the_following, or most_recent with identifier "true".'
  companies.meta: 'Read this before writing custom fields: the keys are uuids unique to the account, not field names.'
  companies.update: 'Custom fields are keyed by uuid. A response sends them as an array, but a write sends an object keyed by field uuid.'
  marketing.subscribe: 'The body is a bare array. The answer carries one result per subscriber and its top-level success is true only when every one worked, so a partial failure throws rather than looking like success.'
  contacts.create: 'First name, last name, email and role are all required by the spec, and role decides what the client portal shows them.'
  companies.create: 'Set primaryContact.create_primary_contact_if_not_exists to create the first contact in the same call; first_name, last_name and email are then required inside it.'
