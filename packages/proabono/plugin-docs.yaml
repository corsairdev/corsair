displayName: ProAbono
description: Subscription billing API for managing customers, offers, subscriptions, usages, balance lines and invoices.
domain: proabono.com
recommendedAuth: api_key
overviewNote: |
  ProAbono bills recurring subscriptions. Every account is served from its own host, `api-<account>.proabono.com`, so the plugin needs your account number as well as the two keys from MY PROFILE, INTEGRATION: the agent key and the API key. They travel as HTTP Basic, with the agent key as the username and the API key as the password.

  What to know before you bill:

  - **The account number.** Pass `account: '42'` to reach `api-42.proabono.com`. Without it there is no host to call, so the plugin refuses the request rather than guessing.
  - **Two steps to a subscription.** A subscription is created from an offer reference and a customer reference, and it only starts billing once the customer is billable. `TryStart: false` creates it without starting, so it can be customised first; `start` then begins it.
  - **Amounts are integer cents.** Every amount, such as `AmountRecurrence` and an invoice's `AmountTotal`, is in the currency's minor unit, so 9900 is 99.00.
  - **Usages accumulate.** `usages.increment` adds to a feature's usage, and a negative increment subtracts, which is how a reversed action is recorded. `usages.update` sends several rows at once.
  - **A 204 is not an error.** ProAbono answers a read that finds nothing with 204 and an empty body. The plugin turns that into an empty result rather than failing the parse.
  - **A 422 lists the bad fields.** It carries one entry per field, which the thrown error keeps on `validationErrors`.
  - **Nothing to check a subscription with.** The docs warn against using `subscriptions.get` to decide whether a user is a subscriber, and point at their own method instead.
  - **Webhooks.** ProAbono notifies through its portal rather than by webhook deliveries, so this plugin receives none.
references:
  - title: ProAbono API overview
    url: https://docs.proabono.com/en/developer/api-overview/
  - title: API Live reference
    url: https://doc-api.proabono.com/
examples:
  read:
    path: offers.list
    title: List the offers in your account
    args: {}
  write:
    path: customers.create
    title: Create a customer with your own reference
    args:
      ReferenceCustomer: cust-42
      Name: Jane Smith
      Email: jane@example.com
apiExamples:
  customers.create:
    call: "{ ReferenceCustomer: 'cust-42', Name: 'Jane Smith', Email: 'jane@example.com' }"
  customers.get:
    call: "{ ReferenceCustomer: 'cust-42' }"
  customers.list:
    call: "{ Page: 1, SizePage: 20 }"
  customers.update:
    call: "{ ReferenceCustomer: 'cust-42', Email: 'new@example.com' }"
  customers.anonymize:
    call: "{ ReferenceCustomer: 'cust-42' }"
  customers.invalidate:
    call: "{ ReferenceCustomer: 'cust-42' }"
  customers.suspend:
    call: "{ ReferenceCustomer: 'cust-42' }"
  offers.list:
    call: '{}'
  offers.get:
    call: "{ ReferenceOffer: 'premium' }"
  features.list:
    call: '{}'
  features.get:
    call: "{ ReferenceFeature: 'feat-users' }"
  subscriptions.create:
    call: "{ ReferenceOffer: 'premium', ReferenceCustomer: 'cust-42' }"
  subscriptions.get:
    call: '{ IdSubscription: 44082 }'
  subscriptions.list:
    call: "{ ReferenceCustomer: 'cust-42' }"
  subscriptions.start:
    call: '{ IdSubscription: 44082 }'
  subscriptions.suspend:
    call: '{ IdSubscription: 44082 }'
  subscriptions.terminate:
    call: '{ IdSubscription: 44082 }'
  subscriptions.upgrade:
    call: "{ IdSubscription: 44082, ReferenceOffer: 'ultimate' }"
  subscriptions.updateTerm:
    call: "{ IdSubscription: 44082, DateTerm: '2026-12-31T00:00:00Z' }"
  usages.list:
    call: "{ ReferenceCustomer: 'cust-42' }"
  usages.get:
    call: '{ IdUsage: 1 }'
  usages.increment:
    call: "{ ReferenceCustomer: 'cust-42', ReferenceFeature: 'feat-users', Increment: 1 }"
  usages.update:
    call: "{ usages: [{ ReferenceCustomer: 'cust-42', ReferenceFeature: 'feat-users', Increment: 1 }] }"
  balanceLines.create:
    call: "{ ReferenceCustomer: 'cust-42', Title: 'One-off setup', Amount: 59900 }"
  balanceLines.list:
    call: "{ ReferenceCustomer: 'cust-42' }"
  invoices.list:
    call: "{ ReferenceCustomer: 'cust-42' }"
  invoices.get:
    call: '{ IdInvoice: 499734 }'
