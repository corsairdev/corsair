# Display copy for the docs, the catalog, corsair.dev and Hub, and one call
# example per operation. Generated with the plugin from Railway's GraphQL schema;
# docs-examples.test.ts parses every example with its input schema.
displayName: Railway
domain: railway.com
description: "Projects, environments, services and service instances, deployments with logs, deploy, redeploy, restart and rollback, variables, domains and TCP proxies, volumes and backups, buckets, databases, templates, GitHub repo deploys, workspaces, members, invitations and tokens, notification rules, observability dashboards, metrics, HTTP logs and traces, usage limits, sandboxes and cloud agents (394 operations over Railway's public GraphQL API)."
recommendedAuth: api_key
overviewNote: |
  Connect with a Railway token from railway.com/account/tokens: an account
  token reaches every workspace you are in, a workspace token one workspace.
  Both go out as `Authorization: Bearer <token>`. A project token (from a
  project's settings) works with `tokenKind: 'project'` in the plugin
  options and reaches only that project's environment.

  - **One operation per GraphQL field.** Every query and mutation of
  Railway's public API (`backboard.railway.com/graphql/v2`) is an operation;
  its input is the field's arguments, mostly an `input` object for mutations.
  The plugin sends a fixed document per operation that selects the result's
  scalar and enum fields and the scalars of each nested object. Fields that
  need arguments, connections inside a result (a project's services come
  from their own list operation) and fields API tokens can't read
  (`User.platformFeatureFlags`) are left out.
  - **Lists.** Relay connections (projects, deployments, environments, ...)
  take `first`/`after` (or `last`/`before`) and return `{ items, pageInfo }`;
  pass `pageInfo.endCursor` as `after` for the next page. A few lists page
  their own way (`cloudAgentTasks.list` returns `nextCursor` and takes
  `cursor`): their output says which fields to use.
  - **Errors.** Railway answers most failures with HTTP 200 and a GraphQL
  `errors` list; the plugin raises them as `RailwayGraphQLError` with a
  status (403 for "Not Authorized", 404 for a missing record, 429 for
  "too many requests" or "too quickly", 400 otherwise). When the only
  errors are inside the result (an audit log entry whose project was
  deleted), the call succeeds and those nested fields come back null.
  - **Risk.** Queries are `read`. Deletes, deploys, redeploys, restarts,
  rollbacks, template and repo deploys, new services, environments,
  volumes, buckets, sandboxes and cloud agents (all use credits), tokens and
  credential resets, invitations (they send email), billing and usage limits,
  restores and transfers are `destructive`; other mutations are `write`.
  - Not wrapped: Railway's CLI telemetry and login-session fields, its staff
  and careers fields, the dashboard's landing and X-agent claim state, email
  change and second-factor/passkey setup (they need a person at the
  dashboard), and fields Railway marks deprecated. Railway's project
  webhooks are not signed, so the plugin has no webhook handlers.
examples:
  read:
    path: projects.list
    title: List projects
    args: {"first": 20}
  write:
    path: variables.upsert
    title: Set a service variable
    args: {"input": {"projectId": "00000002-5c1e-4d8a-9f43-2b6e1c0a9d17", "environmentId": "00000003-5c1e-4d8a-9f43-2b6e1c0a9d17", "serviceId": "00000004-5c1e-4d8a-9f43-2b6e1c0a9d17", "name": "API_URL", "value": "https://api.example.com"}}
