displayName: Productboard
description: Read and manage Productboard notes, entities, relationships, field options, teams, members, Jira connections, and PBFM documents through Public REST API v2.
recommendedAuth: api_key
overviewNote: |
  Configure a Productboard personal access token in Corsair. Productboard requires `Authorization: Bearer <token>` and `Accept: application/json`; personal access tokens are available on Pro plans and above. An OAuth access token can also be supplied as the bearer credential, but this plugin does not issue or refresh OAuth tokens. Productboard's current OAuth guide, Authentication guide, and v2 per-route OpenAPI security sections publish different OAuth URL/scope spellings; use a personal access token for the supported default setup and verify scopes with Productboard before using OAuth.

  Productboard uses opaque cursor pagination (`pageCursor`) with `links.next`; its documented default rate limit is 50 requests per second per token. On 429 responses the shared transport preserves `Retry-After` and the plugin avoids duplicate retries.

  Entity and note field names and values are workspace-configurable. The plugin strictly validates operation-level inputs and accepts JSON for provider-native request envelopes, query structures, and dynamic field maps. PII may be redacted by Productboard without `members:pii:read`. The customer-score operation is beta. Webhook subscriptions and inbound webhook/action callback handlers are not included; plugin-integration control-plane REST operations are available.
examples:
  read:
    path: teams.list
    title: List workspace teams
    args:
      query:
        name: Product Team
  write:
    path: notes.create
    title: Create a synthetic feedback note
    args:
      body:
        data:
          type: textNote
          fields:
            name: Synthetic feedback
            content: A synthetic example note.
references:
  - title: Productboard Public API v2 documentation
    url: https://developer.productboard.com/
  - title: Authentication methods
    url: https://developer.productboard.com/reference/authentication
  - title: OAuth 2.0 authorization-code flow
    url: https://developer.productboard.com/reference/oauth-authorization-code
  - title: Cursor pagination
    url: https://developer.productboard.com/reference/pagination
  - title: Rate limits
    url: https://developer.productboard.com/reference/rate-limits
