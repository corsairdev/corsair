apiNotes:
  entities.create: 'If your workspace feature configuration requires a parent, include a `parent` relationship to an existing entity ID as shown; check the configuration for any other required fields.'
  entities.fieldValues.create: 'Productboard only supports creating values for SINGLE_SELECT, MULTI_SELECT, and TAG fields here; STATUS values are managed separately.'
  entities.fieldValues.update: 'Productboard does not support updating STATUS values through this operation.'
  entities.fieldValues.delete: 'Productboard does not support deleting STATUS values. The `force` and `replaceWith` query options are mutually exclusive.'
  entities.customerScore: 'This Productboard customer-score API is documented as beta and may change or be removed.'
  notes.search: 'Structured filter groups use the documented relationship semantics. `pageCursor` is passed as a query parameter.'
  entities.search: 'Entity types and available fields are workspace-configured. Only documented AND filter semantics are supported.'
  pluginIntegrations.create: 'This example creates the integration disabled, which skips Productboard’s endpoint probe. Enabled creation requires a publicly reachable action URL that can answer the probe. The plugin passes `action` as provider-native JSON and does not locally validate its URL syntax or reachability; Productboard validates the request and probes enabled endpoints. `action.headers.authorization` is write-only and is never returned.'
  pluginIntegrations.update: 'Changing an enabled integration action URL triggers a Productboard probe. The action authorization secret is write-only.'
  pluginIntegrations.connections.list: 'List responses exclude connections in the initial state; follow the cursor in `links.next`.'
  pluginIntegrations.connections.get: 'If no connection exists, Productboard returns the initial state instead of 404.'
  pluginIntegrations.connections.update: 'The operation is an upsert. State `initial` resets the connection, equivalent to delete.'
  webhooks.create: 'The plugin validates notification URL syntax, length, and the HTTPS prefix; Productboard checks public reachability after the request is sent. Its optional authorization header is write-only and is never logged or returned.'
  webhooks.delete: 'Deleting a subscription is permanent and stops future notifications; the inbound notification receiver remains the caller''s responsibility.'
