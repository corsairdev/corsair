displayName: ntfy
description: Push notifications with ntfy on ntfy.sh or a self-hosted server - publish messages and file attachments to topics, poll cached messages, update, clear and delete message sequences, manage the account (tokens, synced subscriptions, topic reservations, phone numbers, emails, settings, billing, web push), and administer users, topic access and tiers.
domain: ntfy.sh
recommendedAuth: api_key
overviewNote: |
  Create an access token at https://ntfy.sh/account (or `<your server>/account`) under Manage access tokens. The token starts with `tk_` and is shown once. The key can also be `username:password`, which is sent as HTTP Basic. A self-hosted server is set with the account's `base_url` (or the `serverUrl` plugin option); leave it empty for ntfy.sh. A bad Authorization header is a 401 even on public topics, so check the key before anything else. With the `anonymous: true` option and no key, calls go out without credentials (open topics, signup). Credentials are only sent over https (or to localhost). Things to know before you send:

  - **Real pushes.** `messages.send`, `messages.sendFile` and `messages.update` deliver real push notifications to every subscriber of the topic and are marked destructive. `email` and `call` on a send also email or phone someone. On ntfy.sh a visitor can send 250 messages per rolling 24 hours. Failed sends are never replayed after a 5xx or a dropped connection, because a retry can duplicate a notification. A burst-limit 429 (42901, 42906, 42911) is retried twice; a spent daily quota (messages, emails, calls, bandwidth) never is.
  - **Sequences.** Publishing with `sequenceId` (`[-_A-Za-z0-9]{1,64}`) gives the message a stable id: publishing again with the same id updates it (the server keeps both versions), `messages.clear` marks it read and dismissed, and `messages.delete` tells subscribers to remove it. A scheduled message that has not gone out yet is cancelled and removed from the server; a delivered one stays in the cache with a delete event after it, and clients that support it remove the notification.
  - **Polling, not webhooks.** ntfy sends no webhooks: `messages.poll` reads the topic cache as NDJSON and returns the messages with `event: "message"`. An unknown topic polls to an empty list, not an error. Use `since` (a duration like `10min`, unix seconds, a message id, `all` or `latest`) as the cursor, and `scheduled: true` to list undelivered scheduled messages.
  - **Priorities and actions.** `priority` takes 1-5 or min|low|default|high|urgent; names are sent as their number, since the JSON publish takes an int only. `actions` takes up to 3 buttons of type view, http, broadcast or copy.
  - **Attachments.** `messages.sendFile` uploads a file (base64 in, PUT body out) and the message carries `attachment.url`; `files.download` fetches it by the id at the end of that URL. `attach` on `messages.send` links an external URL instead.
  - **Account and admin routes.** `account.*`, `tokens.*`, `subscriptions.*`, `reservations.*`, `phoneNumbers.*`, `emails.*`, `billing.*` and `webPush.*` act on the signed-in user. `users.*` and `tiers.*` need an admin. Routes for a feature the server has turned off (email, calls, payments, web push, signup) answer 400 or 404.
examples:
  read:
    path: messages.poll
    title: Poll a topic
    args:
      topic: mytopic
      since: 10min
  write:
    path: messages.send
    title: Send a notification
    args:
      topic: mytopic
      message: Disk space is low at 5.1 GB
      title: Low disk space alert
      priority: 4
      tags:
        - warning
        - cd
apiExamples:
  messages.send:
    call: "{ topic: 'mytopic', message: 'Disk space is low at 5.1 GB', title: 'Low disk space alert', priority: 4, tags: ['warning', 'cd'] }"
  messages.poll:
    call: "{ topic: 'mytopic', since: '10min' }"
  messages.update:
    call: "{ topic: 'mytopic', message: 'Disk space is low at 4.9 GB', sequenceId: 'disk-alert' }"
  messages.clear:
    call: "{ topic: 'mytopic', sequenceId: 'disk-alert' }"
  messages.delete:
    call: "{ topic: 'mytopic', sequenceId: 'disk-alert' }"
  account.usage: {}
  messages.sendFile:
    call: "{ topic: 'mytopic', filename: 'report.txt', contentBase64: 'aGVsbG8K', message: 'Nightly report' }"
  users.grantAccess:
    call: "{ username: 'phil', topic: 'alerts*', permission: 'read-only' }"
  reservations.add:
    call: "{ topic: 'mytopic', everyone: 'deny-all' }"
  server.health: {}
  server.stats: {}
apiNotes:
  messages.send: 'Publishes as JSON to the server root. `email` and `call` also email or phone someone (servers with those features). `message` defaults to ''triggered'' server-side. `delay` accepts 10s to 3d on ntfy.sh; self-hosted servers may differ.'
  messages.poll: 'Reads the server-side cache (12h on ntfy.sh, 10 MB replay cap per topic). Poll filters: `message`, `title`, `id` match text; `priority` is an OR list, `tags` an AND list. A multi-topic comma list (up to 150 topics) interleaves by time.'
  messages.update: 'Publishes with `sequence_id` set. The server keeps both versions and every subscriber is notified again.'
  messages.clear: 'Sends a `message_clear` event: subscribers mark the message read and dismissed. The cache entry stays until it expires.'
  messages.delete: 'Sends a `message_delete` event. A scheduled message that has not gone out is cancelled and removed from the server; a delivered one stays cached with the delete event after it, and clients that support it remove the notification. Republishing the same `sequenceId` revives the sequence.'
  messages.sendFile: 'Uploads the file as the request body (PUT /{topic}) with the other options as X- headers. The answer carries `attachment` with its name, size, type, expiry and URL. The server needs an attachment cache; ntfy.sh limits files by tier.'
  files.download: 'Takes the id at the end of `attachment.url` (/file/<id>) and returns the file: text as `text`, other files as base64.'
  account.create: 'Signup must be enabled on the server, and ntfy refuses it from a signed-in user: use the plugin with `anonymous: true` and no key.'
  account.delete: 'Confirmed with the current password. The server marks the account for removal, so it can stay listed (and keep its tier) for a while.'
  tokens.delete: 'Without `token`, revokes the token the call is made with.'
  users.resetPassword: 'Returns a reset link holding a token; the server needs a base URL configured. `sendEmail` also emails it.'
  billing.createSubscription: 'Returns a Stripe checkout URL to open; nothing is charged until checkout is completed.'
  account.usage: 'Anonymous callers get an IP-based view; with a token it is the account tier. No per-topic stats exist on ntfy.sh.'
  server.health: 'No special rights needed, but corsair still sends the token.'
  server.stats: 'Server-wide totals, not per-account.'
