displayName: VPNDetection
description: Check whether an IP address is a VPN, a Tor node or a privacy relay such as iCloud Private Relay, with its country and ASN, with or without an API key.
domain: vpndetection.io
recommendedAuth: api_key
overviewNote: |
  The API answers without a key, so the plugin works with none stored: leave the key unset and each lookup goes out keyless. A key from vpndetection.io adds the fields its plan includes, which pass through unchanged. Keyless use is covered by the API's [terms](https://vpndetection.io/terms) and [privacy policy](https://vpndetection.io/privacy).
examples:
  read:
    path: ip.lookup
    title: Check whether an IP is a VPN
    args:
      ip: 185.65.135.230
apiNotes:
  ip.lookup: |
    Omit `ip` and the service looks up the caller address. Every answer carries `ip`, `is_vpn`, `is_tor`, `is_relay`, `is_bogon`, `is_anycast`, `tor`, `relay`, `location`, `asn` and `hostname`. A lookup with an explicit `ip` is saved to the `lookups` table under that address, replacing the previous row for it; a lookup without `ip` is returned but not saved, and a failed save does not fail the lookup. Anything but an IPv4 or IPv6 address in `ip` is refused before the request.
apiExamples:
  ip.lookup:
    call: "{ ip: '185.65.135.230' }"
