displayName: SearchAPI
description: Read SearchAPI account usage and locations, run a search, and read a cached search.
domain: searchapi.io
recommendedAuth: api_key
overviewNote: |
  The key is the api_key query parameter. GET /api/v1/me, GET /api/v1/locations, and GET /api/v1/search with an empty key returned HTTP 401 Invalid API key. GET /api/v1/searches/search_doesnotexist and the .html form returned HTTP 404 Search not found. A search spends a credit. The query, result rows, and cached HTML are not stored.
examples:
  read:
    path: account.get
    title: Read account
    args: {}
apiNotes:
  account.get: |
    GET /api/v1/me. Stores the usage numbers on id account.
  locations.list: |
    GET /api/v1/locations. Stores google_id, name, canonical name, country code, and target type.
  searches.run: |
    GET /api/v1/search. engine picks the source (google, google_news, google_maps, bing, youtube, amazon_search and the others in searchapi.io/docs). location, gl, hl, device, page, safe and time_period are typed; any other parameter the engine documents goes in params (for example { video_id } for youtube_transcripts). results holds organic_results (position, title, link, snippet, date, source, domain); sections holds every other part of the answer under SearchAPI's own key (answer_box, ai_overview, knowledge_graph, related_questions, top_stories, local_results, pagination). Uses one search credit. Stores id, status, and engine; the query and results are not stored.
  searches.get: |
    GET /api/v1/searches/{id}. This is the json_url. Returns the same results and sections as searches.run. Stores id, status, and engine.
  searches.html: |
    GET /api/v1/searches/{id}.html. Returns the HTML and does not store it.
apiExamples:
  account.get:
    call: "{}"
  locations.list:
    call: "{ q: 'london' }"
  searches.run:
    call: "{ engine: 'google', q: 'coffee roasters', location: 'Austin,Texas,United States', time_period: 'last_month' }"
  searches.get:
    call: "{ id: 'search_example' }"
  searches.html:
    call: "{ id: 'search_example' }"
