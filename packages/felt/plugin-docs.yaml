apiNotes:
  maps.create: "Creates a new Felt map. You can optionally supply initial coordinates and zoom level."
  layers.upload: "Imports spatial data into a Felt map from a publicly accessible URL or pre-signed upload URL."
  sources.createCredential: "Adds a credential a source uses to authenticate (AWS role, Azure connection string, custom headers, GCP service account, key pair or Snowflake token). Secret values are redacted from errors and event logs."
