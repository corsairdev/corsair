apiNotes:
  maps.create: "Creates a new Felt map. You can optionally supply initial coordinates and zoom level."
  layers.upload: "Imports spatial data into a Felt map from a publicly accessible URL or pre-signed upload URL."
  sources.createCredential: "Configures database connection credentials (PostGIS/Snowflake/BigQuery). Credentials are strictly redacted from event logs."
