displayName: Gleap
description: Customer messaging, ticketing, feedback surveys, user sessions, and team collaboration platform.
domain: gleap.io
recommendedAuth: api_key
overviewNote: |
  Authentication uses an API key generated in your Gleap dashboard under **Settings → Developer → API keys**.
  The API key is passed in the `Authorization: Bearer <key>` header.
  API keys belong to one project, and every project-scoped call sends that project's ID in the `project` header: store the **Project ID** from **Settings → Project → General** on the connection (`project_id`).
  Keys only work in the project's data region. Leave `region` empty (or `eu`) for EU projects (`https://api.gleap.io/v3`); set it to `us` for US projects (`https://api.us.gleap.ai/v3`). Settings → Developer → API keys shows the region.
  In code, the `projectId` and `baseUrl` plugin options override the stored values.
  The API needs a Gleap Team plan or higher (Starter has no API access).
apiExamples:
  tickets.get:
    ticketId: "ticket_123"
  tickets.update:
    ticketId: "ticket_123"
    status: "OPEN"
  tickets.delete:
    ticketId: "ticket_123"
  tickets.search:
    searchTerm: "checkout error"
  messages.create:
    ticket: "ticket_123"
    markdownComment: "Hello from support"
  messages.update:
    messageId: "msg_123"
    comment: "Updated message"
  messages.delete:
    messageId: "msg_123"
  messages.getThread:
    messageId: "msg_123"
  messages.createThread:
    messageId: "msg_123"
    comment: "Follow-up reply"
  sessions.get:
    sessionId: "sess_123"
  sessions.getByUserId:
    userId: "usr_123"
  sessions.update:
    sessionId: "sess_123"
    name: "Jane Doe"
  sessions.delete:
    sessionId: "sess_123"
  sessions.activities:
    sessionId: "sess_123"
  users.update:
    userId: "user_123"
    firstName: "Alex"
    lastName: "Smith"
  feedback.rateConversation:
    conversationId: "conv_123"
    rating: 10
  feedback.rateMessage:
    messageId: "msg_123"
    rating: "positive"
  feedback.surveysGet:
    surveyId: "survey_123"
  feedback.surveysResponses:
    surveyId: "survey_123"
  feedback.surveysStats:
    surveyId: "survey_123"
  teams.create:
    name: "Support Tier 1"
    assignmentMethod: "balanced"
    members: ["user_123"]
  teams.update:
    teamId: "team_123"
    name: "Support Tier 2"
    assignmentMethod: "manual"
    members: ["user_123"]
  teams.delete:
    teamId: "team_123"
  boards.create:
    name: "Bug Tracker"
  boards.update:
    type: "BUG"
    name: "Software Bugs"
  boards.delete:
    type: "BUG"
  companies.get:
    companyId: "comp_123"
  companies.createOrUpdate:
    companyId: "comp_123"
    name: "Acme Corp"
  companies.delete:
    companyId: "comp_123"
