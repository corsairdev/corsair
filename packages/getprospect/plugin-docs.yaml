apiNotes:
  "people.bulkEnrich": "Credit-aware operation: newly revealed email; phone number found; enrich_email (on by default) / enrich_phone, per item. Check the workspace balance and the provider response before repeating the request."
  "people.enrich": "Credit-aware operation: newly revealed email; phone number found; enrich_email (on by default) / enrich_phone. Check the workspace balance and the provider response before repeating the request. This synchronous endpoint can take up to 95 seconds; a searching email result can be polled by calling the endpoint again after retry_after."
  "people.enrichSearch": "Credit-aware operation: phone number found; always, until the balance runs out. Check the workspace balance and the provider response before repeating the request."
  "people.save": "Credit-aware operation: person whose valid email is handed over and was not already owned; always; a re-save of a person already paid for is free. A person answered `searching` costs nothing until the refreshed search finds an email and the balance allows it. Check the workspace balance and the provider response before repeating the request."
  "people.saveSearch": "Credit-aware operation: person whose stored valid email is handed over and was not already owned; always, in search order, until the balance runs out. Check the workspace balance and the provider response before repeating the request."
  "people.search": "Credit-aware operation: newly revealed email; phone number found; only with enrich_email / enrich_phone. Check the workspace balance and the provider response before repeating the request."
  "email.findGet": "Credit-aware operation: served_address; a valid address is served that the workspace does not already own (the email of a revealed or saved person, and an address charged before, are free). Check the workspace balance and the provider response before repeating the request."
  "email.verificationsCreate": "Credit-aware operation: billable_row; when a `data.emails` job starts on its own after counting, for `counts.billable`; `unknown` rows and rows never verified are refunded when the job ends (a `file_key` job charges at `email_verifications_start`). Check the workspace balance and the provider response before repeating the request."
  "email.verificationsStart": "Credit-aware operation: billable_row; at start, for `counts.billable`; `unknown` rows and rows never verified are refunded when the job ends. Check the workspace balance and the provider response before repeating the request."
  "email.verifyGet": "Credit-aware operation: address; a valid, invalid or accept_all verdict, once per address per workspace. Check the workspace balance and the provider response before repeating the request."
  "email.find": "Credit-aware operation: served_address; a valid address is served that the workspace does not already own (the email of a revealed or saved person, and an address charged before, are free). Check the workspace balance and the provider response before repeating the request. This synchronous endpoint can take up to 95 seconds; the client uses the documented timeout."
  "email.verify": "Credit-aware operation: address; a valid, invalid or accept_all verdict, once per address per workspace. Check the workspace balance and the provider response before repeating the request. The provider documents a lookup timeout of up to 80 seconds; wallet charges apply only to billable verdicts."
  "exports.peopleExport": "Credit-aware operation: revealed profile not already owned; per chunk during the run, against the balance read at that chunk; emails past it are withheld. Check the workspace balance and the provider response before repeating the request."
  "enrichments.peopleEnrichmentsCreate": "Credit-aware operation: revealed profile not already owned / address found / mobile number found; during the job. Check the workspace balance and the provider response before repeating the request."
