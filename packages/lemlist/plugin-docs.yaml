apiNotes:
  campaigns.getSettings: Requires the Lemlist Email Pro plan or higher.
  campaigns.updateSettings: Requires Email Pro; send only writable settings sections, and an empty update is rejected.
  campaigns.addAbmLeads: Requires the ABM beta. Input IDs are People Database IDs, and existing contacts on another company may be skipped.
  campaigns.startExport: Starts an asynchronous export. Poll the returned export ID until status is no longer pending; the download URL expires after 24 hours.
  campaigns.getExportStatus: Export status is retained for two hours and files are available for 24 hours after completion.
  campaigns.setExportEmail: The notification email is a required path parameter; the export continues asynchronously.
  campaigns.exportLeads: JSON output is an array; CSV output is returned as text. Use documented comma-separated state filters.
  campaigns.skipStepForEveryone: A skipped step cannot be restored. Condition steps are not skippable.
  campaigns.skipStepForLeads: Accepts up to 100 lead IDs or emails per request; the deprecated single-lead operation remains available at leads.skipStep.
  leads.createInCampaign: Creates a new lead and never updates an existing lead. Additional string body keys are stored as custom variables. Enrichment query options may consume credits.
  leads.review: Launches a single lead and may start outreach. The API key user, campaign, AI variables, and sender must satisfy Lemlist's launch guards.
  leads.skipStep: Deprecated by Lemlist in favor of campaigns.skipStepForLeads; skips cannot be undone.
  leads.personalizeStep: Only supported message steps can be personalized, and a lead that has reached the step cannot be changed.
  leads.importFromCrm: Links the campaign to a filter once and imports asynchronously; requested enrichment features consume credits.
  unsubscribes.bulkUnsubscribeVariables: The API accepts up to 10,000 values and returns a text confirmation.
  unsubscribes.resubscribeVariable: Lemlist protects unsubscribe records whose source is LEAD or ABUSE from re-subscription.
  unsubscribes.exportVariables: Returns CSV text by default or a JSON array with format=json.
  unsubscribes.exportContacts: Returns CSV text by default or a JSON array with format=json.
