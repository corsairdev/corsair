displayName: Lemlist
description: Sales engagement and cold email outreach platform for automating multi-channel campaigns, lead tracking, deliverability, and unsubscribes.
domain: lemlist.com
recommendedAuth: api_key
overviewNote: |
  Lemlist uses HTTP Basic authentication. Provide your Lemlist API key from your team settings (`Settings` -> `Integrations` -> `API`).
  The API key is passed as the password with an empty username (`Authorization: Basic base64(:apiKey)`).

  Things to know before calling:
  - **Identifiers:** Campaign IDs and Lead IDs follow Lemlist's internal identifier format (e.g., `cam_...`, `lea_...`).
  - **Rate Limiting:** Lemlist enforces API rate limits. The plugin automatically handles HTTP 429 responses and backs off according to the `Retry-After` header.
  - **Campaign Lead Actions:** Most lead management operations (pause, resume, review, mark interested, personalize step) can be performed either globally or scoped to a specific campaign.
  - **Unsubscribes & Blacklist:** Contacts can be unsubscribed or resubscribed either by variable (such as `email` or `domain`) or via the contact management endpoints.

references:
  - title: Lemlist API Reference
    url: https://developer.lemlist.com/

examples:
  read:
    path: campaigns.list
    title: List campaigns
    args:
      limit: 10
  write:
    path: leads.createInCampaign
    title: Add a lead to an outreach campaign
    args:
      campaignId: cam_1234567890abcdef
      email: contact@example.com
      firstName: Jane
      lastName: Doe

