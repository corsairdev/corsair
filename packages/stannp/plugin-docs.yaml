displayName: Stannp
description: Direct mail with Stannp - send postcards, letters and SMS, manage recipients, groups and campaigns, validate addresses, read delivery reporting and receive mailpiece and campaign webhooks. Webhook deliveries are verified, not just registered.
domain: stannp.com
recommendedAuth: api_key
overviewNote: |
  Create your API key at the bottom of the settings page in Stannp. US and Canadian accounts use the api-us1 host and EU/UK accounts api-eu1; build the plugin with `region: 'us'` (default) or `region: 'eu'`. Things to know before you send:

  - **Real mail costs real money.** `postcards.create`, `letters.create`, `letters.post`, `sms.create`, `campaigns.book` and `account.topup` all spend from the balance once `test` is not set. Pass `test: true` to render a PDF proof without posting or charging.
  - **Sending takes two steps for campaigns.** `campaigns.create` builds a draft for a group; `campaigns.approve` locks it (this cannot be undone) and `campaigns.book` schedules dispatch and takes payment. Mailpieces send immediately on create unless `test` is set, and can be cancelled with `postcards.cancel` / `letters.cancel` only before processing starts.
  - **Idempotent sends.** The create and book operations accept an `idempotencyKey`, sent as the `X-Idempotency-Key` header. A repeat call with the same key and body returns the original response with HTTP 409 instead of running again; the original body is on `error.body` of the thrown `StannpAPIError`.
  - **Recipient ids are strings in lists and numbers in mailpiece reads.** Stannp returns `"id": "1943"` for recipients, groups and campaigns but numeric ids for mailpieces; the schemas keep both as documented.
  - **Paging.** `recipients.list` and `groups.list` page with `offset` and `limit`. Reporting pages by date range (`reporting.summary`, `reporting.list`).
  - **Rate limits.** Most endpoints allow 300 requests per minute. Responses carry `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset` (seconds until the window resets); the plugin reads the reset header and retries a 429 up to three times with backoff.
  - **Webhooks are created in the Stannp platform**, not through the API (account settings, webhooks page). On creation Stannp sends a validation POST (`event: "test_url"`) that must answer HTTP 200, which `webhooks.testUrl` handles. Set a secret on the webhook to enable signing: deliveries then carry an HMAC-SHA256 signature in `X-Stannp-Signature`, which the plugin verifies. With no secret configured, deliveries are accepted unverified, matching Stannp's optional signing.
  - **Binary uploads.** File parameters accept the documented URL and base64 forms; binary multipart bodies are not exposed.
  - **Under the hood.** All requests use HTTP Basic auth with the API key as the username and an empty password, over HTTPS. Every v1 response is wrapped in `{ "success": true, "data": ... }` or `{ "success": false, "error": "..." }`; a 200 body that still says error throws. Two documented operations are left out: `qrcode/create` (needs a separate public key and returns a binary JPEG) and `POST /v2/balance` (a separate API style; `account.topup` on `/v1/accounts/topup` is implemented instead).
examples:
  read:
    path: postcards.get
    title: Get a postcard by id
    args:
      id: 16818211
  write:
    path: letters.create
    title: Send a test letter to a new recipient
    args:
      test: true
      recipient:
        firstname: John
        lastname: Smith
        address1: 123 Sample Street
        city: Sampletown
        zipcode: '12345'
        country: US
      file: https://www.stannp.com/assets/samples/letter-heading.pdf
apiExamples:
  account.balance: {}
  account.topup:
    call: "{ net: '10.00' }"
  addresses.validate:
    call: "{ address1: '1000 N West Street', city: 'Wilmington', zipcode: '19801', country: 'US' }"
  postcards.create:
    call: "{ test: true, size: '4x6', front: 'https://www.stannp.com/assets/samples/a6-postcard-front.webp', back: 'https://www.stannp.com/assets/samples/signature-example.webp', message: 'hello world', recipient: { firstname: 'John', lastname: 'Smith', address1: '123 Sample Street', city: 'Sampletown', zipcode: '12345', country: 'US' }, tags: 'used.for.reporting' }"
  postcards.get:
    call: "{ id: 16818211 }"
  postcards.cancel:
    call: "{ id: 12345 }"
  letters.create:
    call: "{ test: true, file: 'https://www.stannp.com/assets/samples/letter-heading.pdf', recipient: { firstname: 'John', lastname: 'Smith', address1: '123 Sample Street', city: 'Sampletown', zipcode: '12345', country: 'US' }, addons: 'FIRST_CLASS' }"
  letters.post:
    call: "{ test: true, country: 'GB', pdf: 'https://www.stannp.com/assets/samples/letter-sample.pdf' }"
  letters.get:
    call: "{ id: 16818210 }"
  letters.cancel:
    call: "{ id: 12345 }"
  recipients.list:
    call: "{ group_id: 123, offset: 0, limit: 50 }"
  recipients.get:
    call: "{ id: 1943 }"
  recipients.create:
    call: "{ group_id: 123, firstname: 'John', lastname: 'Smith', address1: '123 Main Street', city: 'New York', zipcode: '10001', country: 'US', email: 'john.smith@example.com', ref_id: 'JS12345', on_duplicate: 'update' }"
  recipients.delete:
    call: "{ id: 12345 }"
  recipients.import:
    call: "{ file: 'https://example.com/data.csv', group_id: 123, duplicates: 'update' }"
  groups.list:
    call: "{ offset: 0, limit: 50 }"
  groups.create:
    call: "{ name: 'My Group' }"
  groups.addRecipients:
    call: "{ group_id: 39, recipients: [45112, 45113] }"
  groups.removeRecipients:
    call: "{ group_id: 39, recipients: [45112, 45113] }"
  groups.purge:
    call: "{ id: 123 }"
  groups.calculate:
    call: "{ group_id: 123 }"
  groups.delete:
    call: "{ id: 123 }"
  campaigns.list: {}
  campaigns.get:
    call: "{ id: 126 }"
  campaigns.create:
    call: "{ name: 'My Campaign', type: 'a6-postcard', template_id: 12345, group_id: 12345 }"
  campaigns.sample:
    call: "{ id: 123 }"
  campaigns.approve:
    call: "{ id: 123 }"
  campaigns.cost:
    call: "{ id: 123 }"
  campaigns.availableDates:
    call: "{ start: '2026-01-22', end: '2026-02-21' }"
  campaigns.book:
    call: "{ id: 123, send_date: '2026-01-22', use_balance: true }"
  campaigns.delete:
    call: "{ id: 123 }"
  events.create:
    call: "{ recipient_id: '12345', name: 'PURCHASE', value: '24.99', conversion: true }"
  selections.create:
    call: "{ group_id: 1, name: 'High spenders', filters: 'total_spent:::more_than:::300' }"
  reporting.summary:
    call: "{ startdate: '2024-01-01', enddate: '2024-01-31' }"
  reporting.list:
    call: "{ startdate: '2024-01-01', enddate: '2024-01-31', status: 'delivered' }"
  files.upload:
    call: "{ file: 'https://www.stannp.com/assets/samples/letter-heading.webp' }"
  files.createFolder:
    call: "{ name: 'Test Folder' }"
  files.listFolders: {}
  sms.create:
    call: "{ test: true, recipient_id: 12345, message: 'Hi {firstname}, your order has shipped' }"
  tools.templates: {}
  tools.pdfMerge:
    call: "{ files: ['https://file1.pdf', 'https://file2.pdf'] }"
