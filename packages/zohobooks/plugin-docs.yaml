displayName: Zoho Books
description: Manage organizations, contacts, invoices, bills, banking, projects, and accounting settings in Zoho Books.
domain: zoho.com
recommendedAuth: oauth_2
overviewNote: >-
  Zoho Books uses regional data centers. Set region to match the organization: us (default), eu, in, au, jp, ca, cn, sa,
  or ae. The Books introduction lists the API domains. OAuth uses the corresponding Zoho Accounts server; Canada uses
  accounts.zohocloud.ca. Zoho Books OAuth docs do not enumerate every Accounts host; the China Accounts mapping comes
  from Zoho's official regional API documentation for Zoho Forms and is called out in the package README. Each plugin
  instance has one region, so configure the Zoho OAuth client for that data center or use shared client credentials with
  Zoho multi-DC enabled. Access tokens use Authorization: Zoho-oauthtoken <token>, expire after one hour, and offline
  consent provides a refresh token. The plugin requests all 81 OAuth scopes present in the included operation contracts.
  A connection granted only a subset may receive 403 responses for operations outside those scopes.


  Most resource operations require query.organization_id; discover IDs with organizations.listOrganizations. Operations
  whose route contains {organization_id} take it in pathParams. Organization discovery/creation and user organization
  lookup routes are unscoped. Pass page and per_page as documented; the plugin makes one request per call and does not
  auto-follow pages. Zoho documents 200 records as the generic pagination default, while operation-specific OpenAPI
  defaults may differ.


  Zoho documents 100 API calls per minute per organization, plus plan-specific daily quotas and concurrent-call limits.
  Recoverable HTTP 429 responses are retried once with Retry-After; daily-quota code 45 is not retried.


  Binary downloads return { kind: binary, contentType, base64, byteLength }; responses over 10 MiB are rejected.
  Binary upload inputs accept { filename, contentType, base64 }. Fields that Zoho lists under Query Parameters are
  removed from the URL and transmitted as multipart form-data parts. When a JSON request accompanies a file, its
  non-file fields are sent in the JSONString form-data part; multipart boundaries are generated by fetch. The official OpenAPI bundle documents 885 REST
  operations; 884 are implemented. The all_tag_options route is excluded because its path has a numeric regex segment
  while tag_id is defined only as a query parameter and no matching path parameter is documented. Region and edition
  availability annotations are retained but are not enforced locally. No webhook handlers are registered.
references:
  - title: Zoho Books API v3 reference
    url: https://www.zoho.com/books/api/v3/introduction/
  - title: Zoho Books OAuth v2
    url: https://www.zoho.com/books/api/v3/oauth/
  - title: Official Zoho Books OpenAPI bundle
    url: https://www.zoho.com/books/api/v3/openapi-all.zip
  - title: Zoho Books pagination
    url: https://www.zoho.com/books/api/v3/pagination/
  - title: Zoho OAuth data-center server information
    url: https://accounts.zoho.com/oauth/serverinfo
  - title: Zoho official regional API and Accounts host mapping (China)
    url: https://www.zoho.com/forms/help/restapi/v1/introduction/
apiNotes:
  bills.getBillAttachment: Zoho documents this as returning the attached file; JSON metadata responses are also accepted. Binary files are returned with their response content type and are limited to 10 MiB.
  creditNotes.printCreditNotes: File responses use the response Content-Type supplied by Zoho and are returned base64-encoded.
  creditNotes.getCreditNoteDocument: File responses use the response Content-Type supplied by Zoho and are returned base64-encoded.
  deliveryChallans.addAttachmentToDeliveryChallan: For a documented binary upload field, pass { filename, contentType, base64 }; the plugin builds the multipart body.
  deliveryChallans.getDeliveryChallanAttachment: File responses use the response Content-Type supplied by Zoho and are returned base64-encoded.
  expenses.getExpenseReceipt: Zoho documents this as returning the attached receipt; JSON metadata responses are also accepted. Binary files are returned with their response content type and are limited to 10 MiB.
  expenses.addExpenseAttachment: For a documented binary upload field, pass { filename, contentType, base64 }; the plugin builds the multipart body.
  invoices.getInvoiceAttachment: Zoho documents this as returning the attached file; JSON metadata responses are also accepted. Binary files are returned with their response content type and are limited to 10 MiB.
  invoices.getInvoiceDocumentDetails: File responses use the response Content-Type supplied by Zoho and are returned base64-encoded.
  invoices.printInvoiceDeliveryNote: File responses use the response Content-Type supplied by Zoho and are returned base64-encoded.
  invoices.printInvoicePackingSlip: File responses use the response Content-Type supplied by Zoho and are returned base64-encoded.
  purchaseReturns.addAttachmentToPurchaseReturn: For a documented binary upload field, pass { filename, contentType, base64 }; the plugin builds the multipart body.
  purchaseOrder.getPurchaseOrderAttachment: Zoho documents this as returning the attached file; JSON metadata responses are also accepted. Binary files are returned with their response content type and are limited to 10 MiB.
  retainerInvoices.getRetainerInvoiceAttachment: Zoho documents this as returning the attached file; JSON metadata responses are also accepted. Binary files are returned with their response content type and are limited to 10 MiB.
  retainerInvoices.addRetainerInvoiceAttachment: The attachment is sent as a multipart file part; pass { filename, contentType, base64 }.
  salesOrder.getSalesOrderAttachment: Zoho documents this as returning the attached file; JSON metadata responses are also accepted. Binary files are returned with their response content type and are limited to 10 MiB.
  customModules.createCustomModuleRecord: Include module-defined field API names as top-level cf_<api_name> properties alongside record_name. Values are scalar strings, numbers, or booleans; other unknown property names remain invalid.
  customModules.updateCustomModuleRecord: Include module-defined field API names as top-level cf_<api_name> properties alongside record_name. Values are scalar strings, numbers, or booleans; other unknown property names remain invalid.
  customModules.bulkUpdateCustomModuleRecords: Include module-defined field API names as top-level cf_<api_name> properties alongside record_name. Values are scalar strings, numbers, or booleans; other unknown property names remain invalid.
