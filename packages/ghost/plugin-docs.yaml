# Display copy for the generated docs and the catalog, plus one call
# example per operation. Generated with the plugin from Ghost's OpenAPI spec;
# docs-examples.test.ts parses every example with its input schema.
displayName: Ghost
domain: ghost.org
description: "Publish with Ghost: posts, pages, tags, members, newsletters, tiers, offers, staff, uploads, themes and webhooks, plus the read-only Content API (82 operations)."
recommendedAuth: api_key
overviewNote: |
  In Ghost Admin, open Settings > Integrations > Add custom integration. Connect its **Admin API key** (`<id>:<secret>`) with the site URL; add its **Content API key** as well to use the `content.*` operations. Things to know before you write:

  - **Plans.** Self-hosted Ghost has the whole API. On Ghost(Pro), custom integrations come with the Publisher plan and up, not Starter; the Content API works on every plan.
  - **Bodies.** Pass the fields of one object (`title`, `html`, `status`...); the plugin sends them in Ghost's `{ "posts": [ ... ] }` format. Ghost stores content as Lexical: send `html` with `source: "html"` to have Ghost convert it.
  - **Edits** need the `updated_at` you last read: a stale value answers 409, so two edits never overwrite each other.
  - **Publishing and email.** `status: "published"` puts a post on the live site. Updating a post to published with the `newsletter` query value emails it to members, which can't be taken back. Both are marked `destructive`.
  - **Staff.** An integration key can list users and roles and send invites; editing or deleting a staff user needs a staff access token of an Administrator.
  - **Webhooks.** Ghost signs each delivery with HMAC-SHA256 of the raw body plus a timestamp, in `X-Ghost-Signature: sha256=<hex>, t=<ms>`, using the webhook's secret. The plugin checks it before handling post, page, tag, member and site events.
examples:
  read:
    path: posts.list
    title: List posts
    args: {}
  write:
    path: posts.create
    title: Create a draft from HTML
    args: {"title": "Release notes", "html": "<p>What changed this week.</p>", "source": "html", "status": "draft"}
